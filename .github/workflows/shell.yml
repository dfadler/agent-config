name: Shell

# Runs all shell CI checks. Each check lives in its own
# .github/workflows/sh-*.yml reusable workflow; this file calls them in
# parallel. It is itself called from ci.yml, which owns the triggers,
# concurrency and the required all-checks sentinel.
#
# To add a shell check:
#   1. Create .github/workflows/sh-<name>.yml with `on: workflow_call:`
#   2. Add a job here that calls it
# To add a whole new language: write a new reusable workflow, call it from
# ci.yml and add it to that sentinel's needs:.
#
# Checks and the scripts/ci.sh targets they invoke:
#   shellcheck     bash scripts/ci.sh lint-shellcheck
#   shfmt          bash scripts/ci.sh lint-shfmt
#   set-flags      pnpm run lint-set-flags
#   claude-md-size pnpm run lint-claude-md
#   structure      pnpm run check-plugin-structure
#   test-sh        bash scripts/ci.sh test-sh
#   coverage       bash scripts/ci.sh coverage   (needs test-sh: guards the kcov build)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    uses: ./.github/workflows/sh-shellcheck.yml
    permissions:
      contents: read

  shfmt:
    uses: ./.github/workflows/sh-shfmt.yml
    permissions:
      contents: read

  set-flags:
    uses: ./.github/workflows/sh-set-flags.yml
    permissions:
      contents: read

  claude-md-size:
    uses: ./.github/workflows/sh-claude-md-size.yml
    permissions:
      contents: read

  structure:
    uses: ./.github/workflows/sh-structure.yml
    permissions:
      contents: read

  test-sh:
    uses: ./.github/workflows/sh-test-sh.yml
    permissions:
      contents: read

  # coverage re-runs the bats suite under kcov. Guarded by needs: [test-sh]
  # so the expensive kcov build doesn't run against a broken test suite.
  coverage:
    needs: [test-sh]
    uses: ./.github/workflows/sh-coverage.yml
    permissions:
      contents: read
