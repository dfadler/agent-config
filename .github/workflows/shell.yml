name: Shell

# Orchestrates all shell CI checks. Each check lives in its own
# .github/workflows/sh-*.yml reusable workflow; this file calls them in
# parallel and gates on the all-checks sentinel.
#
# Branch protection requires only "Shell / all-checks". To add a check:
#   1. Create .github/workflows/sh-<name>.yml with `on: workflow_call:`
#   2. Add a job here that calls it
#   3. Add the job name to all-checks needs: — no settings change required.
#
# Checks and the make targets they invoke:
#   shellcheck    make lint-shellcheck
#   shfmt         make lint-shfmt
#   set-flags     make lint-set-flags
#   claude-md-size make lint-claude-md
#   structure     make structure
#   test-sh       make test-sh
#   coverage      make coverage   (needs test-sh: guards the kcov build)

on:
  pull_request:
  push:
    branches: [main]

# One live run per target: a new push to the same PR (or to main) supersedes
# the in-flight run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    uses: ./.github/workflows/sh-shellcheck.yml
    permissions:
      contents: read

  shfmt:
    uses: ./.github/workflows/sh-shfmt.yml
    permissions:
      contents: read

  set-flags:
    uses: ./.github/workflows/sh-set-flags.yml
    permissions:
      contents: read

  claude-md-size:
    uses: ./.github/workflows/sh-claude-md-size.yml
    permissions:
      contents: read

  structure:
    uses: ./.github/workflows/sh-structure.yml
    permissions:
      contents: read

  test-sh:
    uses: ./.github/workflows/sh-test-sh.yml
    permissions:
      contents: read

  # coverage re-runs the bats suite under kcov. Guarded by needs: [test-sh]
  # so the expensive kcov build doesn't run against a broken test suite.
  coverage:
    needs: [test-sh]
    uses: ./.github/workflows/sh-coverage.yml
    permissions:
      contents: read

  # Sentinel required by branch protection. Requiring each job name
  # individually would need a settings update on every rename or addition;
  # this job's name is the only one that ever needs to be required.
  # if: always() prevents a skipped dependency from skipping this job too.
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    if: always()
    needs: [shellcheck, shfmt, set-flags, claude-md-size, structure, test-sh, coverage]
    steps:
      - name: All checks passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          [[ "$results" =~ failure|cancelled ]] && exit 1 || exit 0
