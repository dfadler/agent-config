name: Plugin evals

# Paid `claude plugin eval` runs, per docs/plugin-eval-ci.md (#436, #582).
#
# STANDALONE and NON-GATING: not called from ci.yml. Trigger is manual only;
# the weekly run is a local scheduled task (docs/plugin-eval-ci.md, #738).
# NEVER add `pull_request`: the job passes --trust-plugin next to a subscription
# token, and this is a public repo.
#
# Runs go through the run-evals wrapper (plugins/eval-authoring/scripts/ts/run-evals),
# which applies each case's grants.yaml grants, pins the models and tier ceiling,
# and fixes the pass threshold at 1. Its exit code is 0 pass, 1 below threshold,
# 7 partial/untrustworthy, other codes setup problems.
#
# Each per-case aggregate-result.json is then read by scripts/ts/check-plugin-eval.ts
# (#583) for the extra validity checks (both arms) and the delta gate (mean floor 0.14, advisory under 16 cases, #736):
#   check-plugin-eval.ts --cli-exit N --threshold T --delta-floor 0.14 aggregate-result.json
# A mean delta below 0.14 is a regression once there are 16 cases (warn only before);
# per-case verdicts come from diagnose(); a missing delta is no signal.
# Exit 0 pass, 1 regression, 7 inconclusive, 2 bad args. Inconclusive fails the
# job too, but is reported as inconclusive rather than as a regression.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin directory name under plugins/ (empty = every plugin with evals/)
        type: string
        default: ""

# Evals are paid and slow; queue rather than cancel a half-finished run.
concurrency:
  group: plugin-evals
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: 2.1.283

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Visibility only (#648): a plugin with skills/agents but no evals/ is absent
      # from the matrix, so list it here rather than let the gap go unseen.
      - name: Report plugins without evals
        run: |
          set -euo pipefail
          missing=""
          for d in plugins/*/; do
            [ -d "${d}evals" ] && continue
            if [ -d "${d}skills" ] || [ -d "${d}agents" ] || [ -f "${d}SKILL.md" ]; then
              missing="$missing $(basename "$d")"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Plugins with skills/agents but no evals/:$missing"
            echo "Plugins with skills/agents but no evals/:$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Every plugin with skills/agents has evals/." >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: list
        env:
          PLUGIN: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          if [ -n "$PLUGIN" ]; then
            [ -d "plugins/$PLUGIN/evals" ] || { echo "no plugins/$PLUGIN/evals" >&2; exit 1; }
            names="$PLUGIN"
          else
            names=$(for d in plugins/*/evals; do basename "$(dirname "$d")"; done)
          fi
          echo "matrix=$(printf '%s\n' "$names" | jq -R . | jq -sc '{plugin: .}')" >> "$GITHUB_OUTPUT"

  eval:
    name: eval (${{ matrix.plugin }})
    needs: plan
    runs-on: ubuntu-latest
    # 180 (#648): the $25 ceiling lets big suites run to the end. eval-authoring
    # ran 23.8 min for at most 13 of 21 cases on 2026-10-19 and now has 42, so at
    # least ~76 min; 90 would stop it at about $19, before the ceiling. The wrapper
    # call below has its own shorter deadline so the Check and Upload steps still run.
    timeout-minutes: 180
    # Protected environment holds CLAUDE_CODE_OAUTH_TOKEN, a one-year token from
    # `claude setup-token` (Pro/Max/Team/Enterprise). Runs count against that
    # plan's usage limits; --max-cost-usd below is a list-price ceiling, not a
    # hard spend cap. Rotate the secret before it expires.
    environment: plugin-evals
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
      OUT_DIR: eval-results/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-node-pnpm

      # Bash-using eval cases need an OS sandbox backend.
      - name: Install sandbox backend
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap socat

      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Run evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p "$OUT_DIR"
          # Standard tier: every case, 3 runs, with and without the plugin. The tier's
          # flat $5 ceiling stopped the big suites part way (#648), so CI raises it to
          # $25; a ceiling, not a spend (small suites cost $0.7 to $2). The 165 minute
          # deadline (INT, then KILL after 2 more) is shorter than the job timeout, so a
          # slow suite ends here with exit 124 or 137: the Check step maps that to
          # inconclusive and the results of finished cases still upload.
          timeout --signal=INT --kill-after=2m 165m \
            node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts \
            "plugins/$PLUGIN" \
            --tier standard \
            --max-cost-usd 25 \
            --output-dir "$OUT_DIR" 2>&1 | tee "$OUT_DIR/eval.log"
          echo "${PIPESTATUS[0]}" > "$OUT_DIR/cli-exit"

      # No secrets in this step: it only reads the result files.
      - name: Check results
        run: |
          set -uo pipefail
          wrapper_exit="$(cat "$OUT_DIR/cli-exit")"
          # The checker takes 0 pass, 1 regression, 2 invalid run; the wrapper's
          # other codes (7 partial, setup errors) mean the run is not trustworthy.
          # The wrapper exit is one code for all cases, so on exit 1 every file is labelled
          # a regression; eval.log (in the artifact) has the per-case verdicts.
          case "$wrapper_exit" in 0) cli=0 ;; 1) cli=1 ;; *) cli=2 ;; esac
          worst=0
          found=0
          while IFS= read -r f; do
            found=1
            node scripts/ts/check-plugin-eval.ts \
              --cli-exit "$cli" --threshold 1 --delta-floor 0.14 "$f" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            rc="${PIPESTATUS[0]}"
            [ "$rc" -gt "$worst" ] && worst="$rc"
          done < <(find "$OUT_DIR" -name aggregate-result.json | sort)
          if [ "$found" -eq 0 ]; then
            echo "::error::No aggregate-result.json under $OUT_DIR (wrapper exit $wrapper_exit)"
            exit 7
          fi
          if [ "$worst" -eq 7 ]; then
            echo "::error::Eval run was inconclusive (not a regression); see the result summary"
          fi
          exit "$worst"

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-eval-${{ matrix.plugin }}-${{ github.run_id }}
          path: eval-results/${{ matrix.plugin }}/
          if-no-files-found: warn
          retention-days: 30

  # Failure notification (#738): a failed or inconclusive run opens or updates one
  # issue. GITHUB_TOKEN only, so no new secret; issues: write lives on this job alone.
  notify:
    name: notify on failure
    needs: [plan, eval]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Plugin evals failed"
          body="A plugin-evals run failed or was inconclusive: $RUN_URL

          The Check results step summary lists per-case verdicts and cases ungated by delta; results are in the plugin-eval-* run artifacts (30 days)."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
