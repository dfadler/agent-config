name: structure

on:
  workflow_call:

permissions:
  contents: read

jobs:
  structure:
    name: structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Structure (plugin manifests + frontmatter)
        run: make structure
