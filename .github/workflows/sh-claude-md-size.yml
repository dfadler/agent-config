name: claude-md-size

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `pnpm run lint-claude-md` runs a TypeScript check (needs Node + pnpm deps).
      - uses: ./.github/actions/setup-node-pnpm
      - name: Lint (claude-md-size)
        run: pnpm run lint-claude-md
