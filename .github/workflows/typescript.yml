name: TypeScript

# Lints, typechecks and tests the TypeScript scripts under scripts/ts/ (and,
# as they land, plugin scripts — see #419, #420).
#
# Calls the package.json scripts (`pnpm run <name>`) that the matching `make`
# targets delegate to, so `make check` and a green PR mean the same thing. The Node
# version comes from .nvmrc, the pnpm version from `packageManager` in
# package.json, and dependencies are pinned by pnpm-lock.yaml
# (`--frozen-lockfile` fails on any drift).

# Called from all-checks.yml, whose all-checks sentinel is the only required
# check for it. Concurrency is inherited from the caller.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job runs PR-controlled code and never needs authenticated git
          # after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      # Node from .nvmrc, pnpm from `packageManager`, then `pnpm install --frozen-lockfile`.
      - uses: ./.github/actions/setup-node-pnpm

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Skill contracts
        run: pnpm run check-skills

      - name: Plugin evals lint
        run: pnpm run lint-plugin-evals

      - name: Vitest flag drift
        run: make check-vitest-flags

      - name: Vitest 3 option names
        run: make check-vitest-v3-names

      - name: Test (vitest)
        run: pnpm run test

      - name: Coverage (vitest, floor)
        run: pnpm run coverage
