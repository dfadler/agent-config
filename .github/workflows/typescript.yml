name: TypeScript

# Lints, typechecks and tests the TypeScript scripts under scripts/ts/ and
# plugins/*/scripts/ts/, and runs the repo gates that are TypeScript checks
# (set-flags, CLAUDE.md size, plugin structure, markdown links). The first
# three duplicate sh-set-flags/sh-claude-md-size/sh-structure until phase 8 of
# #441 deletes those; vitest enforces the 90% line floor (vitest.config.ts).
#
# Calls the package.json scripts (`pnpm run <name>`) that
# `scripts/ci.sh check` delegates to, so a green local check and a green PR mean the same thing. The Node
# version comes from .nvmrc, the pnpm version from `packageManager` in
# package.json, and dependencies are pinned by pnpm-lock.yaml
# (`--frozen-lockfile` fails on any drift).

# Called from ci.yml, whose all-checks sentinel is the only required
# check for it. Concurrency is inherited from the caller.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job runs PR-controlled code and never needs authenticated git
          # after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      # Node from .nvmrc, pnpm from `packageManager`, then `pnpm install --frozen-lockfile`.
      - uses: ./.github/actions/setup-node-pnpm

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      - name: Shell set-flags lint
        run: pnpm run lint-set-flags

      - name: CLAUDE.md size
        run: pnpm run lint-claude-md

      - name: Plugin structure (manifests + frontmatter)
        run: pnpm run check-plugin-structure

      - name: Markdown links
        run: pnpm run check-links

      - name: Skill contracts
        run: pnpm run check-skills

      - name: Plugin evals lint
        run: pnpm run lint-plugin-evals

      - name: Vitest flag drift
        run: pnpm run check-vitest-flags

      - name: Vitest 3 option names
        run: pnpm run check-vitest-v3-names

      - name: Test (vitest)
        run: pnpm run test

      - name: Coverage (vitest, floor)
        run: pnpm run coverage
