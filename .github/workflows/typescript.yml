name: TypeScript

# Lints, typechecks and tests the TypeScript scripts under scripts/ts/ (and,
# as they land, plugin scripts — see #419, #420).
#
# Same contract as shell.yml and python.yml: CI calls the `make` targets humans
# run locally, so `make check` and a green PR mean the same thing. The Node
# version comes from .nvmrc, the pnpm version from `packageManager` in
# package.json, and dependencies are pinned by pnpm-lock.yaml
# (`--frozen-lockfile` fails on any drift).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    name: eslint + tsc + node:test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job runs PR-controlled code and never needs authenticated git
          # after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json, so the
      # pin lives in one place. Must run before setup-node's `cache: pnpm`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install pinned dependencies
        run: make node-modules

      - name: Lint (eslint)
        run: make lint-ts

      - name: Typecheck (tsc --noEmit)
        run: make typecheck-ts

      - name: Test (vitest)
        run: make test-ts

      - name: Coverage (vitest, floor)
        run: make coverage-ts
