name: issue-bot

# Files a standalone issue from a PR comment that mentions @issue-bot — see
# https://github.com/dfadler/issue-bot for what it captures and how dedup works.

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  issue-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: dfadler/issue-bot@778495b3d77158d2ed1f3c596f50bc2664f11386 # v1.3.0
        with:
          mention: "@issue-bot"
