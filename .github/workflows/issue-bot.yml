name: issue-bot

# Files a standalone issue from a PR comment that mentions @issue-bot — see
# https://github.com/dfadler/issue-bot for what it captures and how dedup works.

on:
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  issue-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: dfadler/issue-bot@e66038db719cdb9b17f12e6918c5beb239c3abf8 # v1.1.0
        with:
          mention: "@issue-bot"
