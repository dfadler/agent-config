name: Actionlint

# Lints the workflow YAML under .github/workflows/ itself — the one layer no
# job-level check can cover, because an invalid workflow file is rejected by
# GitHub before any job starts, and a broken file fails in 0s with "workflow
# file issue" while every other check stays green. actionlint catches that class
# of error, plus expression/type mistakes in ${{ }}, bad cron/glob syntax,
# unknown runner labels, and (via shellcheck) bugs in embedded `run:` scripts.
#
# Runs through the same `make lint-actions` entry point humans use locally
# (`brew install actionlint`), matching shell.yml's pattern.
#
# shellcheck is pinned to the same version shell.yml uses — the runner image
# preinstalls one, but the pinned copy in /usr/local/bin wins on PATH, and
# actionlint picks it up for linting embedded run: scripts.

on:
  # This lints .github/workflows/** — it can't find anything in a diff that
  # doesn't touch that directory, so scope the trigger rather than running on
  # every PR regardless of what changed.
  pull_request:
    paths: ['.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/workflows/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: v0.11.0
  # actionlint publishes its own checksums file, so this value is verified
  # against an upstream manifest rather than recorded from a download — a
  # stronger guarantee than the shellcheck/shfmt pins in shell.yml, which have
  # no upstream checksums to check against. Taken from
  # actionlint_1.7.12_checksums.txt.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verified before extraction, as in shell.yml: piping curl into tar would
      # run the unverified payload first and check it never.
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          rm -f /tmp/actionlint.tar.gz /tmp/actionlint
          actionlint --version

      - name: Install shellcheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf /tmp/shellcheck.tar.xz "/tmp/shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      - name: Lint workflows (actionlint)
        run: make lint-actions
