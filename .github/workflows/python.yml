name: Python

# Lints, typechecks and tests the Python side — currently the detached-terminal
# skill, which holds a PTY and a screen model for the agent to drive.
#
# It exists because that skill stopped being a shell wrapper. The previous
# implementation drove tmux, and tmux hands every pane a $TMUX handle back to
# the server governing it, so a process in the pane could rewrite the wrapper's
# own state. Replacing it with a purpose-built PTY holder removed that channel
# but moved the code into Python, which the Shell workflow cannot check.
#
# Same contract as shell.yml: CI calls the `scripts/ci.sh` targets humans run locally,
# so `scripts/ci.sh check` and a green PR mean the same thing. Dependencies are pinned
# in requirements-dev.txt.

# Called from ci.yml, whose all-checks sentinel is the only required
# check for it. Concurrency is inherited from the caller.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job runs PR-controlled code and never needs authenticated git
          # after checkout — don't leave the GITHUB_TOKEN in reach.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies
        run: |
          bash scripts/ci.sh venv
          .venv/bin/pip list

      - name: Lint (ruff check + format)
        run: bash scripts/ci.sh lint-py

      - name: Typecheck (mypy --strict)
        run: bash scripts/ci.sh typecheck

      # The integration tests fork real PTYs and start real daemons. They are
      # hermetic — AGENT_TERM_STATE is redirected per test and torn down — but
      # they do need a working pty(4), which the ubuntu runner provides.
      - name: Test (pytest)
        run: bash scripts/ci.sh test-py

      # Mirrors shell.yml's kcov step: re-runs the same suite under
      # pytest-cov and enforces a floor (see COVERAGE_PY_MIN in
      # scripts/ci.sh for the number and how it was measured). Unlike kcov this
      # needs no Linux-only guard — coverage.py instruments Python
      # identically on every platform `scripts/ci.sh coverage-py` runs on.
      - name: Coverage (pytest-cov, floor)
        run: bash scripts/ci.sh coverage-py
