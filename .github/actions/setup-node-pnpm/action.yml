name: Set up Node and pnpm
description: >
  Installs the Node version pinned in .nvmrc and the pnpm version pinned in
  package.json, then installs dependencies from pnpm-lock.yaml.

# Run actions/checkout first: this reads .nvmrc and package.json from the
# working directory. Any workflow that runs a TypeScript check (a `make`
# target that depends on node-modules) uses this one step instead of the
# pnpm/action-setup + setup-node + install sequence, so the pins live in one
# place. typescript.yml and sh-claude-md-size.yml use it today; the other
# sh-*.yml workflows add it as their checks move to TypeScript.
#
# Versions are not inputs on purpose: .nvmrc and `packageManager` are the
# single source of truth (also used locally), and `--frozen-lockfile` inside
# `make node-modules` fails on any lockfile drift.
#
# External actions are pinned by full commit SHA with the version as a trailing
# comment (see docs/github-actions.md); a tag can be repointed without the
# workflow file changing.

runs:
  using: composite
  steps:
    # Reads the pnpm version from `packageManager` in package.json. Must run
    # before setup-node's `cache: pnpm`.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install pinned dependencies
      shell: bash
      run: make node-modules
