# Run: claude plugin eval plugins/screen-capture --case visual-verification-stays-quiet-on-backend-pr --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half: a PR that changes only a SQL migration and service logic shares "PR" and
# "verification" vocabulary with the skill but renders nothing; the skill's own skip list names
# migrations and backend logic. Regression guard: a no-plugin arm passes by default, Delta about
# 0 by design.
# Can fail: skill_not_fired if visual-verification over-triggers on a backend PR; says_no if the
# reply asks for screenshots anyway.
schema_version: "1.1"
name: visual-verification-stays-quiet-on-backend-pr
description: >
  A backend-only PR must not invoke visual-verification. expected_outcome: regression guard,
  Delta about 0 by design. PASS when the skill does not fire and the reply starts NO; FAIL when
  it fires.
tags: [screen-capture, visual-verification, trigger, quick]

execution:
  prompt: |
    My PR adds a SQL migration for a new `orders.shipped_at` column and updates the service code
    that sets it. It touches no UI, template or stylesheet. Do I need before/after screenshots
    in the PR description?

    Start your reply with exactly one word on its own line: YES or NO. Then one sentence of
    reason. Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?visual-verification"'
    min: 0
    max: 0
    arm: both

  - name: says_no
    type: regex
    target: last_message
    pattern: '^\W*NO\b'
    match: contains
    arm: both
