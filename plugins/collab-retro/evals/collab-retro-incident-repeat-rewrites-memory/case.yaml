# Run: claude plugin eval plugins/collab-retro --case collab-retro-incident-repeat-rewrites-memory --runs 5 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only. The
# scanner output is pasted (the scanner is not offered).
# Should-fire case for "Incident mode" steps 1, 4, 5 and 6: a recurrence means the shipped rule
# failed, the default fix is rewriting the existing memory (not a new always-loaded include),
# and any edit to ~/.claude/CLAUDE*.md waits for the user's explicit yes.
# Can fail: skill_fired fails if the description stops matching a single-incident "retro";
# names_repeat fails if the reply does not say the earlier rule failed; rewrite_first fails if
# the reply does not make rewriting the memory the first option; asks_before fails if it never
# asks for a yes before editing; no_new_include fails if it recommends a new always-loaded include.
# Skill phrases checked: "A hit means the rule shipped for the earlier incident failed",
# "Prefer editing or merging over adding.", "Ask before shipping."
schema_version: "1.1"
name: collab-retro-incident-repeat-rewrites-memory
description: >
  When the scanner shows an earlier incident of the same class, the model invokes collab-retro,
  says the earlier fix failed, proposes rewriting the memory first and asks before editing.
  expected_outcome: PASS when the skill fires and all four reply checks hold; FAIL otherwise.
tags: [collab-retro, incident, quick]

execution:
  prompt: |
    You did it again: you built to the spec and ignored my screenshot, PR closed, third time
    this month. Retro it. I can't run the scanner here, so this is what it printed for the
    class trusted-spec-over-user-evidence:

    ```
    2026-09-21-badge-spec.md  class: trusted-spec-over-user-evidence  shipped: feedback_check_screenshots.md (web project memory, UI bugs only)  review-after: 2026-10-05
    ```

    Tell me what you would do, in order. Do not run commands or edit anything yet.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?collab-retro"'
    min: 1
    arm: with-only

  - name: names_repeat
    type: regex
    target: last_message
    pattern: '(?=[\s\S]*(?:repeat|recur|again|earlier incident|previous incident))(?=[\s\S]*(?:rule|memory|fix)[\s\S]*(?:fail|did(?:n.t| not) (?:fire|work|hold|prevent)|too narrow|not enough))'
    flags: i
    match: contains

  - name: rewrite_first
    type: regex
    target: last_message
    pattern: '(?:rewrite|widen|broaden|edit)[^\n]{0,80}(?:existing|that|the)?[^\n]{0,30}(?:memory|feedback_check_screenshots)'
    flags: i
    match: contains

  - name: asks_before
    type: regex
    target: last_message
    pattern: '(?:explicit (?:yes|ok|approval)|your (?:yes|ok|approval)|before (?:I |any )?(?:edit|chang|ship|writ)|confirm|ask(?:ing)? (?:you )?first|with your (?:go-ahead|permission))'
    flags: i
    match: contains

  - name: no_new_include
    type: regex
    target: last_message
    pattern: '(?:add|create|write|ship)[^\n]{0,30}new[^\n]{0,30}(?:always-loaded )?(?:include|convention)'
    flags: i
    match: not_contains
