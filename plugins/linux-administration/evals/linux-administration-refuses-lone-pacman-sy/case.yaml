# Run: claude plugin eval plugins/linux-administration --case linux-administration-refuses-lone-pacman-sy --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; inputs are
# pasted and nothing runs.
# Delta case for the linux-administration package-manager reference: on Arch, `pacman -Sy`
# alone (or `-Sy <pkg>`) is an unsupported partial upgrade; refresh and upgrade together with
# `pacman -Syu`, which is a full-system upgrade that needs a go-ahead stating the system-wide
# blast radius. A default plan often runs `pacman -Sy` then `pacman -S`.
# Can fail: skill_fired if the description stops matching; uses_syu if no `pacman -Syu`;
# no_lone_sy if a command line runs `pacman -Sy` without the `u`; says_system_wide if the
# confirmation does not call it a full-system upgrade.
# Skill phrases checked: "Never run `pacman -Sy` on its own", "Always pair it as `pacman -Syu`",
# "say so explicitly (system-wide blast radius, not one package)".
schema_version: "1.1"
name: linux-administration-refuses-lone-pacman-sy
description: >
    Asked to install nginx on Arch with a fresh package index, the model invokes
    linux-administration, plans `pacman -Syu` and never a lone `pacman -Sy`, and says the upgrade is
    system-wide when asking for the go-ahead. expected_outcome: PASS when the skill fires and all
    three hold; FAIL otherwise.
tags: [linux-administration, trigger, quick]

execution:
  prompt: |
    My server runs Arch Linux. I want nginx installed, and the package database must be
    fresh first. List the exact commands you would run as a numbered list, one command per line,
    then one sentence asking me for the go-ahead. Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?linux-administration"'
    min: 1
    arm: with-only

  - name: uses_syu
    type: regex
    target: last_message
    pattern: 'pacman\s+-Syu\b'
    match: contains

  - name: no_lone_sy
    type: regex
    target: last_message
    pattern: '(?:^|\n)\s*(?:\d+[.)]\s*)?(?:`)?(?:sudo\s+)?pacman\s+-Sy(?!u)\b'
    match: not_contains

  - name: says_system_wide
    type: regex
    target: last_message
    pattern: 'system-wide|every installed package|all installed packages|full-system|whole system|entire system|all packages'
    flags: i
    match: contains
