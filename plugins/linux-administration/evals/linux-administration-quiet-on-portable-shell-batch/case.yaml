# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/linux-administration --trigger-boundary (plugin arm only; no grant needed).
# Maps to the SKILL.md description: "Does not cover non-systemd init systems (sysvinit, OpenRC,
# runit) or Windows/macOS administration", and the systemd-only scope. Near-miss: a per-line verdict on portability of shell one-liners, not on administration risk.
# Plugin arm only, scored as a fire count, no delta. Never run alone as evidence; it counts only
# with the other trigger-boundary prompts and a twin that fired in the same run (#1017).
# good-reply: (answers directly without invoking linux-administration)
# bad-reply: (invokes linux-administration and labels the request RUN, ASK or HAND-BACK)
schema_version: "1.1"
name: linux-administration-quiet-on-portable-shell-batch
description: >
  Near-miss: a per-line verdict on portability of shell one-liners, not on administration risk. Out of scope for linux-administration. Trigger-boundary negative, plugin arm
  only, scored as a fire count, no delta.
tags: [linux-administration, trigger-boundary, "pair:linux-administration-labels-command-batch"]

execution:
  prompt: |
    For each command below say whether it works unchanged on macOS bash 3.2, or needs changes.
    
    1. find . -name '*.log' -print0 | xargs -0 rm
    2. readlink -f ./script.sh
    3. declare -A seen
    Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: linux_administration_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?linux-administration"'
    min: 0
    max: 0
