# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --case "agent-writing-affirmative-rewrite" (no grant needed; Skill only).
# Maps to SKILL.md: the affirmative-guidance rule (AW21): state the behaviour wanted, not only the ban.
# good-reply: ## Code style Write one-line comments. Spell out variable names in full words. Keep functions to 40 lines or fewer.
# bad-reply: ## Code style Don't write long comments. Don't abbreviate variable names. Avoid functions over 40 lines.
# First paid run (standard, 3 runs/arm): 1.00 with and 1.00 without. A bare model already rewrites these bans affirmatively, so this is a regression guard with no expected delta.
# EVAL024 on no_bans is intended: the prompt holds the bans, so an echo of them is the failure being graded.
schema_version: "1.1"
name: agent-writing-affirmative-rewrite
description: >
  Writing mode: the pasted section holds only prohibitions with no hard guardrail among them.
  The prompt does not ask for affirmative phrasing. expected_outcome: PASS when the pasted text
  states each target behaviour and carries no don't/never/avoid ban; FAIL when any ban survives.
  A bare model may already convert some bans, so the baseline decides whether the rule adds anything.
tags: [agent-writing, trigger, quick]

execution:
  prompt: |
    Tighten this section of our CLAUDE.md. Reply with only the text to paste in, nothing else.

    ## Code style
    - Don't write long comments.
    - Don't abbreviate variable names.
    - Avoid functions over 40 lines.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-writing"'
    min: 1

  # No prohibition word survives. None of the three bullets is a hard guardrail, so any ban left is the failure.
  - name: no_bans
    type: regex
    target: last_message
    pattern: "\\b(?:don['’]?t|do not|never|avoid|must not|shouldn['’]?t|no)\\b"
    flags: i
    match: not_contains

  # The line limit is restated as a target. "40" is in the prompt, so this only fails a reply that drops the limit
  # or leaves it as a ban.
  - name: states_line_target
    type: regex
    target: last_message
    pattern: '(?:under|below|within|at most|up to|maximum|max)\D{0,25}40|40 lines or (?:fewer|less)'
    flags: i
    match: contains
