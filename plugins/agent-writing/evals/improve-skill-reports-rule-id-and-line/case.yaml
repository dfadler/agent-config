# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --case "improve-skill-reports-rule-id-and-line" (no grant needed).
# Maps to SKILL.md: "a findings table (id, `file:line`, evidence, fix)" (Contract, Output) and "run its checks on every listed file, rule ids as that skill defines them" (Procedure, Audit).
# good-reply: | AW08 | SKILL.md:19 | "currently ignores chore PRs" | delete the time word, state the rule | ... uncovered: none found. Fix all of these, or which subset?
# bad-reply: Line 19 says the tool "currently" ignores chore PRs, which will go stale. You could drop that word. (no rule id)
schema_version: "1.1"
name: improve-skill-reports-rule-id-and-line
description: >
  A skill with one planted history word (line 19) should be reported with its AW id and that
  line number. expected_outcome: PASS when a row or line names AW08 and line 19 together and
  the reply has an "uncovered" entry; FAIL if the id is missing or the line is wrong. The AW
  ids exist only in the plugin, so the id grader separates the arms by construction.
tags: [improve-skill, quick]

execution:
  prompt: |
    Clean up my changelog skill. It lives at plugins/changelog/skills/changelog-writer/SKILL.md
    but is not in this sandbox, so use the text below, exactly as on disk (line 1 is the first
    "---").

    ```
    ---
    name: changelog-writer
    description: |
      Turn a list of merged PRs into a changelog entry. Use when asked to write a changelog entry
      from PR titles. Not for release announcements (use release-notes).
    ---

    # Changelog writer

    ## Contract

    - **Input:** a list of merged PR titles.
    - **Output:** one changelog entry in Keep a Changelog format.
    - **Does not:** edit CHANGELOG.md.

    ## Procedure

    1. Group the PR titles by type (feat, fix, chore).
    2. Write one bullet per PR. The tool currently ignores chore PRs, so skip them.
    3. Output the entry.
    ```
  max_turns: 12
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve-skill"'
    min: 1

  # The id and the line sit in one row or sentence. Neither "AW08" nor "19" is in the prompt.
  - name: aw08_at_line_19
    type: regex
    target: last_message
    pattern: 'AW08[^\n]*\b19\b|\b19\b[^\n]*AW08'
    match: contains

  # The second list the Contract promises. Wording-sensitive, so half weight.
  - name: has_uncovered_entry
    type: regex
    target: last_message
    pattern: 'uncovered'
    flags: i
    match: contains
    weight: 0.5
