# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --case "improve-skill-asks-before-editing" (no grant needed).
# Maps to SKILL.md: "End the turn on one question: fix all findings, or which subset." (Procedure, Ask); the SC1 and SC2 ids come from the Skill conventions section.
# good-reply: | SC1 | SKILL.md:1 | no Contract section | add one | / | SC2 | SKILL.md:3 | description has no "Not for" clause | add one | ... Could not check: SC3 (no evals directory in view). Fix all of these, or only some?
# bad-reply: I tightened it and added a Contract section and a Not-for line. Here is the updated file: ---\nname: pr-title ... (edits made, no ids, no question)
schema_version: "1.1"
name: improve-skill-asks-before-editing
description: >
  A request to tighten a skill at a path should fire improve-skill, report findings that carry
  convention ids, and end on the which-to-fix question without rewriting the file.
  expected_outcome: PASS when the skill is invoked, the reply cites SC1 or SC2, shows no
  rewritten file, and its final paragraph asks which findings to fix; FAIL if it rewrites the
  file or ends on anything but the question. The SC ids exist only in the skill, so the
  id grader separates the arms by construction; the ask-first graders are the behavior check.
  No Edit or Write is granted, so "no edit made" is checked on the reply only.
tags: [improve-skill, trigger, quick]

execution:
  prompt: |
    Can you tighten up my skill at plugins/pr-title/skills/pr-title/SKILL.md? The file is
    not in this sandbox, so work from the text below, which is exactly what is on disk. Line
    numbers are on the left.

     1| ---
     2| name: pr-title
     3| description: Write a PR title from a diff. Use when asked for a PR title.
     4| ---
     5|
     6| # PR title
     7|
     8| 1. Read the diff.
     9| 2. Write a title under 72 characters in the imperative mood.
    10| 3. Output the title.
  max_turns: 12
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  # Indicator only (unscored in a two-arm run): the skill fired on a prompt that never names it.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve-skill"'
    min: 1

  # The findings use this repo's convention ids (a bare model has no SC ids).
  - name: cites_convention_id
    type: regex
    target: last_message
    pattern: '\bSC[12]\b'
    match: contains

  # The turn ends on the choose-what-to-fix question (one "?", last thing in the reply).
  - name: ends_on_which_to_fix
    type: regex
    target: last_message
    pattern: '(?:fix|apply|change|address)[^?]*\?[\s*_)"]*$'
    flags: i
    match: contains

  # No rewritten file is shown before the user chooses. The prompt's lines carry a "N|" prefix,
  # so an echo of the file does not trip this; a rewrite puts the frontmatter at a line start.
  - name: no_rewritten_file
    type: regex
    target: last_message
    pattern: '^---\s*\nname:\s*pr-title'
    flags: m
    match: not_contains
