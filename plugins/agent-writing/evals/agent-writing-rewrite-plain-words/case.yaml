# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --case "agent-writing-rewrite-plain-words" (no grant needed; Skill only).
# Maps to SKILL.md: "Use the concrete word where a metaphor or inflated verb stands in ... Do not squeeze sentences into fragments, arrows or symbols the reader must decode." (AW20)
# good-reply: Run lint, then the tests, then open a pull request that updates the dependencies. The skill stops at the first failure and lists it.
# bad-reply: This skill uses a robust, seamless pipeline: lint -> test -> PR. Fast, with failures triaged.
# EVAL024 on no_banned_words and no_arrows is intended: an echo of the jargon paragraph is the failure being graded.
# A bare model may already avoid these words, so a delta near zero is plausible (inference); the paragraph-only reply is why the not_contains graders can scan the whole reply.
schema_version: "1.1"
name: agent-writing-rewrite-plain-words
description: >
  A rewrite request for a jargon-heavy SKILL.md paragraph should fire agent-writing
  and return text without the banned words or arrows. expected_outcome: PASS when the
  rewritten paragraph has none of them; FAIL otherwise.
tags: [agent-writing, trigger, quick]

execution:
  prompt: |
    Can you rewrite this paragraph from my SKILL.md so the agent that reads it has
    an easier time? Reply with just the rewritten paragraph, nothing else.

    This skill leverages a robust, seamless pipeline to facilitate dependency
    updates. It serves as the single entry point -> lint -> test -> PR. Blazing
    fast; failures get surfaced and triaged.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-writing"'
    min: 1

  - name: no_banned_words
    type: regex
    target: last_message
    pattern: 'leverag|utiliz|facilitat|robust|seamless|serv(?:es|ed|e|ing)\s+as|blazing'
    flags: i
    match: not_contains

  - name: no_arrows
    type: regex
    target: last_message
    pattern: '->|→'
    match: not_contains
