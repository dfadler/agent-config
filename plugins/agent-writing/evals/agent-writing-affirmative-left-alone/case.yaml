# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --case "agent-writing-affirmative-left-alone" (no grant needed; Skill only).
# Maps to SKILL.md: the affirmative-guidance rule (AW21) must not touch an instruction that already names its target.
# good-reply: ## Code style Write one-line comments. Keep functions under 40 lines. Run `pnpm test` before every commit.
# bad-reply: ## Code style Write one-line comments. Don't write long comments. Keep functions under 40 lines. Never commit without running `pnpm test`.
# Guard: no delta expected. The prompt carries all three instructions, so keeps_all is cheap for a bare model; the live signal is no_bans, which fails a reply that adds a ban the user never wrote.
# EVAL024 on keeps_all is intended: it only fails a reply that drops an instruction the user wrote.
schema_version: "1.1"
name: agent-writing-affirmative-left-alone
description: >
  Writing mode guard: every pasted instruction already states its target behaviour. expected_outcome:
  PASS when all three instructions survive and no prohibition is added; FAIL when a ban appears or
  an instruction is dropped. A regression guard against the affirmative rule over-reaching, delta 0 by design.
tags: [agent-writing, trigger, quick]

execution:
  prompt: |
    Tighten this section of our CLAUDE.md. Reply with only the text to paste in, nothing else.

    ## Code style
    - Write one-line comments.
    - Keep functions under 40 lines.
    - Run `pnpm test` before every commit.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-writing"'
    min: 1

  - name: no_bans
    type: regex
    target: last_message
    pattern: "\\b(?:don['’]?t|do not|never|avoid|must not|shouldn['’]?t)\\b"
    flags: i
    match: not_contains

  - name: keeps_all
    type: regex
    target: last_message
    pattern: '^(?=[\s\S]*one[- ]line)(?=[\s\S]*40)(?=[\s\S]*pnpm test)'
    flags: i
    match: contains
