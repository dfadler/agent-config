# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --trigger-boundary (plugin arm only; no grant needed).
# Maps to SKILL.md: "Not for writing a new skill, reviewing a PR, or editing a README or docs page." (description).
# good-reply: Here is a tighter README: "Skills: commit-msg writes a commit message from a diff; pr-title writes a PR title from a diff." (edits the prose, no audit table)
# bad-reply: (invokes improve-skill, then returns a findings table with AW/SC ids for the README)
schema_version: "1.1"
name: improve-skill-quiet-on-readme-edit
description: >
  Trigger-boundary negative. A request to tighten a README that lists skills shares the
  vocabulary (tighten, skills, plugin) but is a docs edit, which the skill excludes.
  Counted by run-evals --trigger-boundary, plugin arm only, so no delta.
tags: [improve-skill, trigger-boundary, "pair:improve-skill-asks-before-editing"]

execution:
  prompt: |
    Tighten the wording of my plugin's README, especially the part that describes its skills.
    Here is the current text:

    # git-helpers

    This plugin is a really useful collection of skills that you can use in order to make
    working with git a lot easier. The commit-msg skill is the skill that is responsible for
    writing a commit message from a diff, and the pr-title skill is the skill that is
    responsible for writing a PR title from a diff.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  # min: 0 is explicit (tool_used defaults min to 1). No arm:, it runs plugin-arm only.
  - name: improve_skill_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?improve-skill"'
    min: 0
    max: 0
