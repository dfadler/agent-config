# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/agent-writing --case "agent-writing-cross-file-audit" (no grant needed; Skill only).
# Maps to SKILL.md: "Each fact, policy or command ... lives in one file; the others link to it." (AW01), and the AW04, AW12 and AW13 sentences in Structure and Consistency.
# good-reply: | AW01 | CLAUDE.md:1, skills/release-check/SKILL.md:1 | lint command pnpm lint --max-warnings 0 repeated | link | / | AW12 | AGENTS.md:2 says 500, CLAUDE.md:2 says 400 | keep one | / | AW13 | CLAUDE.md:3, SKILL.md:7 | changelog entry format fix(scope) restated | keep one | / | AW04 | CLAUDE.md:4, AGENTS.md:1 | ship-it still listed and called | remove |
# bad-reply: The lint command is repeated, the PR size limits disagree, and ship-it is still referenced after you replaced it.
# Every grader needs the rule id on the same line as the defect term, so an echo of the prompt cannot pass. AW01, AW12 and AW13 overlap on a verbatim repeat; a reply that tags the changelog line AW01 only fails aw13_restated_format.
schema_version: "1.1"
name: agent-writing-cross-file-audit
description: >
  Three small instruction files with a duplicated lint command, a conflicting PR size,
  a restated changelog format and a stale skill reference should fire agent-writing and
  produce findings keyed by rule id. expected_outcome: PASS when the reply ties AW01,
  AW12, AW13 and AW04 to the planted defects; FAIL otherwise. The bare model cannot know
  the rule ids, so the regex graders discriminate by construction; the Skill check is an
  indicator.
tags: [agent-writing, trigger, quick]

execution:
  prompt: |
    I replaced our ship-it skill with a new release-check skill and want the
    instruction files looked over before I merge. Can you audit these three and
    tell me what's wrong?

    CLAUDE.md:
    - Lint with `pnpm lint --max-warnings 0` before every commit.
    - Keep PRs under 400 changed lines.
    - Changelog entries look like `- fix(scope): short summary (#123)`.
    - To publish, run the ship-it skill.

    AGENTS.md:
    - Skills: ship-it (publish a release), triage (sort issues).
    - Keep PRs under 500 changed lines.

    skills/release-check/SKILL.md:
    ---
    name: release-check
    description: Check a release is ready and publish it.
    ---
    1. Run `pnpm lint --max-warnings 0` and stop on any warning.
    2. Confirm the PR is under 400 changed lines.
    3. Add a changelog entry shaped like `- fix(scope): short summary (#123)`.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-writing"'
    min: 1

  - name: aw01_duplicate_lint_command
    type: regex
    target: last_message
    pattern: 'AW01[^\n]*max-warnings|max-warnings[^\n]*AW01'
    flags: i
    match: contains

  - name: aw12_conflicting_pr_size
    type: regex
    target: last_message
    pattern: 'AW12[^\n]*(?:400|500)|(?:400|500)[^\n]*AW12'
    flags: i
    match: contains

  - name: aw13_restated_format
    type: regex
    target: last_message
    pattern: 'AW13[^\n]*(?:fix\(scope\)|changelog)|(?:fix\(scope\)|changelog)[^\n]*AW13'
    flags: i
    match: contains

  - name: aw04_stale_replaced_skill
    type: regex
    target: last_message
    pattern: 'AW04[^\n]*(?:ship-it|AGENTS)|(?:ship-it|AGENTS)[^\n]*AW04'
    flags: i
    match: contains
