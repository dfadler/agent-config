# Run (one case at a time, #536/#538): claude plugin eval plugins/second-brain --case lint-stays-quiet-on-eslint --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant needed (Skill only).
# Should-not-fire half of the lint boundary: "lint" in a code context is not a vault check.
# Sabotage map: skill_not_invoked checks lint's description; widen it to "lint anything" and a
# run should fail.
# Can fail: any second-brain skill invoked fails skill_not_invoked. Regression guard: a no-plugin
# arm passes it, so no delta by design.
schema_version: "1.1"
name: lint-stays-quiet-on-eslint
description: >
  A question about ESLint rules must not invoke any second-brain skill. expected_outcome
  (regression guard: the no-plugin arm also passes): PASS when no second-brain skill is invoked
  and the reply mentions ESLint; FAIL otherwise.
tags: [second-brain, lint, trigger, quick]

execution:
  prompt: |
    In one sentence, what does the ESLint no-unused-vars rule lint for? Don't run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:second-brain:)?(?:capture|query|sync|config|lint)"'
    min: 0
    max: 0
    arm: both

  - name: answers_about_unused_vars
    type: regex
    target: last_message
    pattern: 'unused'
    flags: i
    match: contains
    arm: both
