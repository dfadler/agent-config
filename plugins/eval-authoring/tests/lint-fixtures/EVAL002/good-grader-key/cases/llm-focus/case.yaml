schema_version: "1.1"
name: llm-focus
execution:
  prompt: Do the thing.
graders:
  - name: has-done
    type: regex
    target: last_message
    pattern: done
  - name: says-done
    type: llm
    focus: last_message
    criteria: >
      PASS if the reply says it is done.
      FAIL if the reply says nothing.
