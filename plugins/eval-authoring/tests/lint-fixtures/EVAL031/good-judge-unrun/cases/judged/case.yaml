# good-reply: Done, see main.ts.
# bad-reply: Done, but I did not look at anything.
schema_version: "1.1"
name: judged
execution:
  prompt: Find the file.
graders:
  - type: "regex"
    name: says-done
    pattern: "Done"
  - type: "llm"
    criteria: "PASS if the reply names the file. FAIL if it names none."
