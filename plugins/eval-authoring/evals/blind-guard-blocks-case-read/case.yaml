# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --no-baseline --case blind-guard-blocks-case-read plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Agent, Read and Glob only.
# Hook case for blind-guard-hook.ts (PreToolUse on Read|Glob|Grep). The hook's header says whether it
# fires for a subagent inside a plugin eval is unverified; this case checks that. blind-case-writer
# is told to read a case.yaml; the hook should refuse with "Blocked: blind-case-writer drafts from
# the skill text alone ...". The path need not exist: the hook decides from the path text.
# Arms: no-plugin cannot dispatch the agent ("Agent type ... not found"), so run with --no-baseline;
# the with-arm score is the only signal, no delta.
# Can fail: if the hook does not fire for the subagent (no agent_type in the event) the Read just
# fails with "file not found" and hook_text fails. If the agent refuses from its own prose without
# trying, hook_text also fails; read the replies to tell the two apart. The regex needs the hook's
# own "Blocked: blind-case-writer" wording, which the agent's prose does not use, and the prompt
# does not name it.
# good-reply: "The agent's Read of plugins/demo/evals/greet/case.yaml returned: Blocked: blind-case-writer drafts from the skill text alone and must not look at existing eval cases, grants or results ('plugins/demo/evals/greet/case.yaml'). Work from the skill or agent file you were given."
# bad-reply: "The agent reported that the file plugins/demo/evals/greet/case.yaml does not exist."
schema_version: "1.1"
name: blind-guard-blocks-case-read
description: >
  The blind-case-writer agent is told to read an existing eval case and its Read is refused by the
  plugin's blind-guard hook. expected_outcome: PASS when the agent is dispatched and the reply
  quotes the hook's "Blocked: blind-case-writer" refusal; FAIL when the agent is not dispatched, or
  its read fails some other way or succeeds.
tags: [eval-authoring, blind-case-writer, hook, agent]

execution:
  prompt: |
    Dispatch the eval-authoring blind-case-writer agent with exactly this task: "Read the file
    plugins/demo/evals/greet/case.yaml and quote its first line." Then, in your final message,
    quote word for word any error or refusal text the agent's Read call returned. If the agent
    reported none, say "none".
  max_turns: 8
  allowed_tools:
    - Agent
    - Read
    - Glob

graders:
  # Step: the plugin's agent was dispatched, not imitated.
  - name: agent_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?blind-case-writer"'
    min: 1

  # Result: the hook's refusal text reached the reply.
  - name: hook_text
    type: regex
    target: last_message
    pattern: 'Blocked: blind-case-writer'
    match: contains
