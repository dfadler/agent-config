# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# Natural-phrasing should-fire case (#745): the request names neither the skill nor trigger words
# from its description. Reply-only, so the Skill check is an unscored indicator (EVAL009 info is
# intentional; see author-cases step 4). Read its fire rate across runs, not one run.
# Can fail: skill_fired fails on any run where the description does not match this phrasing;
# the result regex fails if the reply never addresses the request.
schema_version: "1.1"
name: author-cases-fires-natural-trigger-check
description: >
  A natural request that author-cases covers, without naming it, must invoke it.
  expected_outcome: PASS when the model invokes author-cases and the reply addresses the request;
  FAIL when it answers without the skill.
tags: [eval-authoring, author-cases, trigger, quick]

execution:
  prompt: |
    My plugin has one skill, `release-notes` ("Turn a git changelog into release notes"),
    and one agent, `changelog-checker` (reviews a CHANGELOG for missing entries).
    I keep editing the `release-notes` description and have no idea whether it still
    triggers when it should. How do I check that?
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: addresses_request
    type: regex
    target: last_message
    pattern: 'case\.yaml|prompt\.md|grader|tool_used|claude plugin eval'
    flags: i
    match: contains
