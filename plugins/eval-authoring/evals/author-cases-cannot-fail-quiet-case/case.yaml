# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case author-cases-cannot-fail-quiet-case plugins/eval-authoring
# No grant; reply-only. Default two arms. Unrun: paid, hand-off only.
# Covers the "Can this case fail?" check in author-cases (PR 789 evidence). Sabotage map: delete that
# block from SKILL.md -> names_construction_pass should drop. skill_fired is with-arm only (indicator).
# The prompt asks keep/rewrite/drop without saying the case is vacuous; the pass-by-construction and
# prompt-cued facts must come from reading the YAML. A plain model may already notice the Skill check: delta unverified.
schema_version: "1.1"
name: author-cases-cannot-fail-quiet-case
description: >
  Shown a should-not-fire case whose only graders are an arm-both "skill not fired" check and a
  regex on text the prompt itself contains, the reply says the case cannot tell plugin from no
  plugin. expected_outcome: PASS when the reply says the no-plugin arm passes by construction or
  the regex is cued by the prompt; FAIL when it approves the case as is.
tags: [eval-authoring, author-cases, can-fail, quick]

execution:
  prompt: |
    I'm authoring `claude plugin eval` cases for my `deploy-helper` skill. Should I keep, rewrite
    or drop this case before I spend money running it?

    ```yaml
    name: deploy-helper-stays-quiet-on-unit-tests
    execution:
      prompt: "Run the unit tests with pnpm vitest and tell me which failed."
      allowed_tools: [Skill]
    graders:
      - type: tool_used
        tool: Skill
        input_match: '"skill"\s*:\s*"(?:[\w-]+:)?deploy-helper"'
        min: 0
        max: 0
        arm: both
      - type: regex
        target: last_message
        pattern: 'pnpm vitest'
        match: contains
    ```

    Don't create files or run any commands.
  max_turns: 4
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: names_construction_pass
    type: regex
    target: last_message
    pattern: 'by construction|cannot (?:ever )?fail|can.?t (?:ever )?fail|never fail|passes (?:in|on) both|(?:no|without the) plugin[^.]{0,40}(?:passes|pass it)|echo(?:es|ed)? the prompt|(?:cued|given away|supplied) by the prompt|prompt (?:already )?(?:contains|gives away|cues|supplies)'
    flags: i
    match: contains

  - name: does_not_approve_as_is
    type: regex
    target: last_message
    pattern: 'keep (?:it|this|the case) (?:as[- ]is|unchanged)|(?:run|use|ship) (?:it|this) as[- ]is|no changes (?:are )?needed'
    flags: i
    match: not_contains
