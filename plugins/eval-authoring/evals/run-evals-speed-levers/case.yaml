# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-speed-levers plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Covers the run-evals "Faster feedback" section (#714). Rewritten for #746: the prompt gives no
# case count, run count or duration, and the graders check the advice (narrow to one case, skip
# the baseline arm, warn the delta is lost) instead of the section's wording on -j or the 3-run
# noise caveat. Sabotage map: delete the `--no-baseline` / `--ablation none` bullet and
# skips_baseline_arm should drop (not re-measured since the bullet named --no-baseline, #855); delete the warning that skipping the baseline loses the delta and
# warns_delta_lost should drop. skill_fired is with-arm only.
# Unknown until a two-arm run: whether the baseline already knows these levers (a high baseline
# would mean the case does not discriminate and the section's benefit is unverified; it is an
# outcome case that should fire, so it is never a regression guard).
# #968: the three reply graders passed a reply that gave the opposite advice (the bad-reply line);
# they now need a recommending form with no negation, checked offline with check-replies.ts --probe.
# good-reply: Narrow the run to the one case you are editing with --case my-case. Add --no-baseline to run the plugin arm only, but skipping the baseline means you lose the delta, so use it only to watch the with score move.
# bad-reply: Don't bother with --case; it won't help here. Never use --no-baseline either, and there is no lost delta to worry about. Just wait the fifteen minutes.
schema_version: "1.1"
name: run-evals-speed-levers
description: >
  Asked how to get faster feedback while iterating on one grader of a slow eval suite, the reply
  narrows the run to the one case, skips the baseline arm, and says that costs the delta.
  expected_outcome: PASS when it covers running one case, the plugin-arm-only option and the
  lost delta; FAIL when it only says "run fewer cases".
tags: [eval-authoring, run-evals, quick]

execution:
  prompt: |
    Our eval suite for a plugin takes a quarter of an hour per full run, and I'm tweaking one
    grader in a single case and re-running constantly. What can I change to get feedback
    faster? Don't create files or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 1
    arm: with-only

  # #968: each recommendation grader needs a recommending form and no negation between the verb and
  # the flag, and no negation just before the verb, so "Don't bother with --case" / "Never use
  # --no-baseline" no longer pass.
  - name: targets_one_case
    type: regex
    target: last_message
    pattern: '(?<!(?:n[''’]t|\bnot\b|\bnever\b|\bavoid\b)[^.;:,\n]{0,20})\b(?:run|use|pass|add|try|target|narrow|limit|restrict|select)\w*\b(?:(?!n[''’]t\b|\bnot\b|\bnever\b|\brather than\b|\binstead of\b)[^.\n]){0,40}(?:--case\b|\bone case\b|\bsingle case\b|case director)'
    flags: i
    match: contains

  - name: skips_baseline_arm
    type: regex
    target: last_message
    pattern: '(?<!(?:n[''’]t|\bnot\b|\bnever\b|\bavoid\b)[^.;:,\n]{0,25})(?:--no-baseline|--ablation\s+none|plugin[ -]arm only|(?:skip|drop|without)[^.\n]{0,30}(?:baseline|without-plugin|no-plugin) arm|\bquick\b[^.\n]{0,40}(?:tier|plugin))'
    flags: i
    match: contains

  # Polarity: skipping the baseline loses the delta; a reply that offers it must say so.
  - name: warns_delta_lost
    type: regex
    target: last_message
    pattern: '(?<!(?:n[''’]t|\bnot\b|\bnever\b|\bno\b)[^.;:,\n]{0,15})\b(?:lose|loses|lost|drops?|dropped)\b[^.\n]{0,30}(?:delta|Δ)|\bno (?:delta|Δ) (?:is|will|can|column|comparison|number|figure|score)|(?:can(?:.t|not)|don.t|do not|never|shouldn.t|should not) (?:claim|quote|report|cite)\b[^.\n]{0,30}(?:delta|Δ)|(?:delta\b|Δ)(?:(?!n[''’]t\b|\bnot\b|\bnever\b)[^.\n]){0,40}\b(?:unavailable|missing|gone|lost|dropped|disappears?)\b|(?:delta|Δ)(?: column| number| figure)?(?: is| are| will be)? (?:not|n[''’]t) (?:available|reported|shown|computed|measured|valid)'
    flags: i
    match: contains
