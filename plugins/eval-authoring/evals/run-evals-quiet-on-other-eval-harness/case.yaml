# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# Near-miss for run-evals (#745): shares "run" and "evals" but is a different harness. Regression guard: a no-plugin arm passes it
# by design (no delta), hence --ablation none via the quick tier.
# Can fail: skill_not_fired fails if the description over-triggers on this vocabulary.
# good-reply: Register a custom completion function under evals/registry/completion_fns that calls your local ollama server, then run oaieval <your_fn> <eval>.
# bad-reply: Clone the repo, pip install -e ., and edit the registry yaml so the endpoint points at your model.
schema_version: "1.1"
name: run-evals-quiet-on-other-eval-harness
description: >
  A request that shares vocabulary with run-evals but is not about `claude plugin eval` cases must
  not invoke it. expected_outcome: PASS when run-evals is not invoked and the reply addresses the
  request; FAIL when it is invoked.
tags: [eval-authoring, run-evals, trigger, quick]

execution:
  prompt: |
    How do I run the openai/evals harness against a model I host locally?
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 0
    max: 0
    arm: both

  - name: addresses_request
    type: regex
    target: last_message
    pattern: '(?=[\s\S]*\boaieval\b)(?=[\s\S]*(?:completion[ _-]?f(?:unction|n)s?|CompletionFn|registry_path|localhost|127\.0\.0\.1|ollama|vllm|self-hosted|local (?:endpoint|model|server)|openai[- ]compatible|llama\.cpp|lm ?studio|base[_ ]?url))'
    flags: i
    match: contains
    arm: both
