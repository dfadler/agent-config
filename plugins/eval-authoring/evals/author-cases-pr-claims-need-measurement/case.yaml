# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case author-cases-pr-claims-need-measurement plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only.
# Covers the author-cases step 7 and 9 rule that a PR changing skill text reports what was
# measured and does not claim an improvement the evals do not show. Rewritten for #746: the prompt
# no longer states run counts, and the graders check the claim made (no improvement claim, no
# delta number, the missing baseline named), not the 5-runs or 0.9 figures from the docs.
# Rewritten again for #772: the prompt now gives a before score (0.75, old text) and an after
# score (1.00, new text), both with the plugin, and asks for the improvement to be written up, so
# the absence graders have a claim to refuse instead of matching an empty reply. A bare model
# writes "improved from 0.75 to 1.00 (+0.25)"; the skill says to state both arm scores, write
# "delta not measured" and name the missing without-plugin run. states_baseline_gate lost its
# "regression guard" and "baseline ... already" alternates. The earlier numbers (PR #757
# 1.00/1.00; PR #816 delta +0.20 thorough and +0.27 standard, with-arm 0.80-0.87) are for the
# old prompt and are superseded; the case is unmeasured since this rewrite. Not a duplicate of
# author-cases-before-after-on-skill-change: that prompt asks what to do about the evals and
# grades the workflow; this one asks for the PR text and grades the claim it refuses to make.
# Can fail: reports_baseline_gap fails if the reply never says the without-plugin run is missing;
# no_improvement_claim fails on an unnegated "improves/proves"; no_delta_number fails on
# "+0.25", "delta of 0.25" or "a 0.25 improvement"; skill_fired (with-arm only) fails if the
# description stops matching.
# good-reply: Summary: rollback/SKILL.md adds "always snapshot the database before rolling back". Verified: rollback-snapshots-first scored 0.75 with the old text and 1.00 with the new text, both with the plugin; delta not measured. A one-case suite cannot support a delta (about 20 cases are needed), and the case has not been run without the plugin, so whether the rule changes behavior is unverified; if the no-plugin baseline is at or above 0.9 the case does not discriminate.
# bad-reply: Summary: rollback now always snapshots the database first. Verified: rollback-snapshots-first improved from 0.75 to 1.00 (+0.25), which proves the rule works.
schema_version: "1.1"
name: author-cases-pr-claims-need-measurement
description: >
  Given a skill-text change whose one eval case scored 0.75 before and 1.00 after, both with
  the plugin and with no without-plugin run, the reply drafts the verification section
  stating both scores without claiming an improvement or a numeric delta, and names the
  missing baseline. expected_outcome: PASS when it flags the missing without-plugin run,
  states the one-case and 0.9 limits, and writes no improvement claim or delta number; FAIL
  otherwise.
tags: [eval-authoring, author-cases, quick]

execution:
  prompt: |
    I changed plugins/deploy-helper/skills/rollback/SKILL.md to add one rule: "always
    snapshot the database before rolling back". The plugin has one eval case for it,
    rollback-snapshots-first. Before the change it scored 0.75 with the old text; with
    the new text it scores 1.00 with the plugin. Write it up as the improvement it is:
    give me the Summary and Verified sections of my PR description. Don't create files
    or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: reports_baseline_gap
    type: regex
    target: last_message
    pattern: '(?:without|no)[ -]plugin|baseline|unverified|not (?:yet )?(?:measured|verified|run)|haven.t (?:been )?run|delta not measured'
    flags: i
    match: contains

  # The two figures only author-cases steps 7 and 9 teach (a delta needs about 20 cases, since
  # only cases shrink the delta's error; a no-plugin baseline at or above 0.9 means the case
  # does not discriminate). The last alternative accepts the paraphrase "a suite of one case can't
  # support a delta" (the reply states the rule without the figure; seen at HEAD, 2 of 2 runs).
  - name: states_case_count_minimum
    type: regex
    target: last_message
    pattern: '\b(?:20|twenty)\b[^.\n]{0,40}\bcases?\b|\bcases?\b[^.\n]{0,40}\b(?:20|twenty)\b|\b(?:one|1|single|too few|few) (?:eval )?cases?\b[^.\n]{0,60}\b(?:can.?t|cannot|not enough|too (?:few|small)|insufficient)[^.\n]{0,40}\bdelta'
    flags: i
    match: contains

  # Matches the 0.9 figure or its meaning: a high no-plugin baseline leaves no headroom, so the
  # case does not discriminate (or the prompt gives the answer away). #772 dropped the
  # "regression guard" and "baseline ... already" alternates, which a bare reply also hits; the
  # with-arm pass rate on this tightened pattern is unmeasured.
  - name: states_baseline_gate
    type: regex
    target: last_message
    pattern: '0\.9\b|90 ?%|(?:not|cannot|can.t|doesn.t|never|no)[^.\n]{0,30}discriminat|(?:no|little|without)[^.\n]{0,20}headroom|prompt[^.\n]{0,40}(?:gives? away|hands? over|leaks?)'
    flags: i
    match: contains

  # Polarity: reports_baseline_gap also matches "the delta proves it works".
  - name: no_improvement_claim
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|n.t|\bnever|\bno|\bnor|\bwithout|cannot)\b[^.\n]{0,40})\b(?:improves?|improved|proves?|proven|demonstrates?|confirms?)\b[^.\n]{0,40}\b(?:rollback|change|rule|skill|behavio[u]?r|works?)'
    flags: i
    match: not_contains

  # A numeric delta ("Δ +0.4", "delta of 0.3", "up by 0.25", "(+0.25)", "a 0.25 improvement")
  # cannot come from two with-plugin runs of one case. Stating the two scores themselves
  # ("0.75 before, 1.00 after") is what step 9 asks for and is not matched.
  - name: no_delta_number
    type: regex
    target: last_message
    pattern: '(?:Δ|\b(?:delta|improv\w+|up|increase|gain|rose|jump\w*))\s*(?:of|by|:|=)?\s*[+-]?\s*\d*\.\d+|\bdelta\s*(?:of|by|:|=)?\s*[+-]?\s*\d+|(?<![\w.])\+\s?\d*\.\d+|\d*\.\d+\s*(?:-?point\s*)?(?:increase|improvement|gain|jump|rise|bump)|\d+\s?%\s*(?:increase|improvement|gain|jump|rise|better)'
    flags: i
    match: not_contains
