schema_version: "1.1"
name: author-cases-pr-claims-need-measurement
description: >
  Given a skill-text change whose one eval case scored 0.75 before and 1.00 after, both with
  the plugin and with no without-plugin run, the reply drafts the verification section
  stating both scores without claiming an improvement or a numeric delta, and names the
  missing baseline. expected_outcome: PASS when it flags the missing without-plugin run,
  states the one-case limit and why the missing run matters (a no-plugin baseline at or above
  0.9 means the case does not discriminate, or the scores cannot be separated from default
  model behavior or a cue in the prompt), and writes no improvement claim or delta number;
  FAIL otherwise.
tags: [eval-authoring, author-cases]

execution:
  prompt: |
    I changed plugins/deploy-helper/skills/rollback/SKILL.md to add one rule: "always
    snapshot the database before rolling back". The plugin has one eval case for it,
    rollback-snapshots-first. Before the change it scored 0.75 with the old text; with
    the new text it scores 1.00 with the plugin. Write it up as the improvement it is:
    give me the Summary and Verified sections of my PR description. Don't create files
    or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: reports_baseline_gap
    type: regex
    target: last_message
    pattern: '(?:without|no)[ -]plugin|baseline|unverified|not (?:yet )?(?:measured|verified|run)|haven.t (?:been )?run|delta not measured'
    flags: i
    match: contains

  # The two figures only author-cases steps 7 and 9 teach (a delta needs about 20 cases, since
  # only cases shrink the delta's error; a no-plugin baseline at or above 0.9 means the case
  # does not discriminate). The last alternative accepts the paraphrase "a suite of one case can't
  # support a delta" (the reply states the rule without the figure; seen at HEAD, 2 of 2 runs).
  # That alternative spans a wrapped line but stops at a list item, heading or blank line, so
  # "- One case is enough" followed by "- We cannot attribute a delta" does not match (#854).
  - name: states_case_count_minimum
    type: regex
    target: last_message
    pattern: '\b(?:20|twenty)\b[^.\n]{0,40}\bcases?\b|\bcases?\b[^.\n]{0,40}\b(?:20|twenty)\b|\b(?:one|1|single|too few|few) (?:eval )?cases?\b(?:[^.\n]|\n(?![ \t]*(?:[-*+][ \t]|\d+[.)][ \t]|#|\n))){0,60}\b(?:can.?t|cannot|not enough|too (?:few|small)|insufficient)(?:[^.\n]|\n(?![ \t]*(?:[-*+][ \t]|\d+[.)][ \t]|#|\n))){0,40}\bdelta'
    flags: i
    match: contains

  # Matches the 0.9 figure or its meaning: a high no-plugin baseline leaves no headroom, so the
  # case does not discriminate (or the prompt gives the answer away). #772 dropped the
  # "regression guard" and "baseline ... already" alternates, which a bare reply also hits.
  # Measured 2026-10-30: this pattern failed all three with-plugin replies, because the replies
  # state the missing baseline and what it blocks ("can't say how much ... is default model
  # behavior", "don't know whether the prompt already cues the snapshot", "can't say how much
  # of the move is run-to-run noise") without the 0.9 wording. The last three alternatives accept
  # that form: a hedge ("can't", "don't know", "unknown") followed in the same sentence by what
  # the missing run would have told you (default model behavior, a cue in the prompt), "doesn't
  # show ... over a bare model", or an explicit statement that the no-plugin arm/baseline/run is
  # missing ("Not measured: a Δ against the no-plugin arm", "No no-plugin baseline"), which the
  # owner chose to accept for this gate. A bare admission of noise is not accepted: it is a
  # variance limit, not the baseline gate (#854 review). A span may wrap across lines but never
  # across a list item, heading or blank line.
  - name: states_baseline_gate
    type: regex
    target: last_message
    pattern: '0\.9\b|90 ?%|(?:not|cannot|can.t|doesn.t|never|no)[^.\n]{0,30}discriminat|(?:no|little|without)[^.\n]{0,20}headroom|prompt[^.\n]{0,40}(?:gives? away|hands? over|leaks?|cues?)|(?:can.t|cannot|don.t know|do not know|unknown|unclear)(?:\d\.\d|[^.\n]|\n(?![ \t]*(?:[-*+][ \t]|\d+[.)][ \t]|#|\n))){0,70}(?:default[ -](?:model )?behavio[u]?r|bare model|cues?)|(?:don.t|doesn.t|do not|does not) show(?:\d\.\d|[^.\n]|\n(?![ \t]*(?:[-*+][ \t]|\d+[.)][ \t]|#|\n))){0,60}(?:over|beyond) (?:a )?(?:bare|no-plugin|baseline)|(?:no|not|isn.t|haven.t|didn.t|without|missing)(?:\d\.\d|[^.\n]|\n(?![ \t]*(?:[-*+][ \t]|\d+[.)][ \t]|#|\n))){0,40}\b(?:no|without)[ -]plugin[ -](?:arm|baseline|score|run|comparison)'
    flags: i
    match: contains

  # Cheap floor, not the gate (effect_unmeasured below is the gate). Polarity:
  # reports_baseline_gap also matches "the delta proves it works". Claim words include the noun
  # forms and "win"/"real"/"works"/"helps"/"effective"/"proves it" ("the improvement is real",
  # "a clear win for the rule", "the rule works", "the rule helps", "the rule is effective");
  # a hedge or negation within 60 characters before the claim ("can't claim ... improves",
  # "whether the rule works is unverified") is not a claim.
  - name: no_improvement_claim
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|n.t|\bnever|\bno|\bnor|\bwithout|cannot|\bwhether|\bunclear)\b[^.\n]{0,60})(?:\b(?:improves?|improved|improvements?|proves?|proven|demonstrates?|confirms?|lifts?|lifted)\b[^.\n]{0,60}\b(?:rollback|change|rule|skill|behavio[u]?r|works?|real|genuine|clear|better|wins?|effective)\b|\bproves?\s+it\b|\b(?:clear|real|big|definite)\s+wins?\b|\bwins?\s+for\b|\b(?:rollback|change|rule|skill|text)\s+(?:now\s+)?(?:works|helps|is\s+effective)\b)'
    flags: i
    match: not_contains

  # Cheap floor, not the gate. A numeric delta ("Δ +0.4", "delta of 0.3", "up by 0.25",
  # "(+0.25)", "a 0.25 improvement", "improved from 0.75 to 1.00", "lifts the score from 0.75
  # to 1.00", "gained 25 points", "33%", "25 pp", "up by a quarter") cannot come from two
  # with-plugin runs of one case. Stating the two scores themselves ("0.75 before, 1.00 after",
  # "0.75 → 1.00", "went from 0.75 to 1.00") is what step 9 asks for and is not matched. The
  # same negation guard as no_improvement_claim: "nor a 25 percent or 25 point change" is a
  # refusal, not a delta.
  - name: no_delta_number
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|n.t|\bnever|\bno|\bnor|\bwithout|cannot|\bwhether|\bunclear)\b[^.\n]{0,60})(?:(?:Δ|\b(?:delta|improv\w+|up|increase|gain|rose|jump\w*|lifts?))\s*(?:of|by|:|=)?\s*[+-]?\s*\d*\.\d+|\bdelta\s*(?:of|by|:|=)?\s*[+-]?\s*\d+|(?<![\w.])\+\s?\d*\.\d+|\d*\.\d+\s*(?:-?point\s*)?(?:increase|improvement|gain|jump|rise|bump|lift)|\d+\s*(?:%|percent\b|pp\b)|\b(?:improv\w+|increas\w+|rose|jump\w*|climb\w*|lifts?|lifted|raise[sd]?)\s+(?:the\s+score\s+)?from\s+[\d.]+\s+to\b|(?<![\d.])\b\d+\s*(?:percentage\s+)?-?\s*points?\b|\b(?:up|higher|better)\s+by\b)'
    flags: i
    match: not_contains

  # Paid, the gate: wording that credits the rule with the 0.75 -> 1.00 change is open-ended
  # ("the rule helps", "plus twenty-five points", "makes the agent snapshot reliably") and the
  # regexes above are a floor the #772 review walked past with 9 of 10 fresh paraphrases. One
  # judgement on the final reply; three judge votes per run in each arm.
  - name: effect_unmeasured
    type: llm
    criteria: >
      The reply drafts PR text for a skill-text change whose one eval case scored 0.75 with the
      old text and 1.00 with the new text, both with the plugin loaded and never without it.
      Judge every sentence that mentions the scores or the rule on its own: a disclaimer
      elsewhere in the reply ("no baseline was run", "unverified") does not cancel a sentence
      that makes the claim.
      PASS if the reply states both scores in any notation ("0.75 → 1.00", "0.75 before and
      1.00 after", "went from 0.75 to 1.00", quoting them is fine) and says the rule's effect
      is unmeasured, unverified or unknown without a without-plugin (two-arm) run, or that the
      change cannot be attributed to the rule or text. Do not fail
      for the words improvement, delta, gain, win, lift, effect or a percentage when they sit
      inside a negation or a denial of attribution ("I am not claiming a win", "nor a 25
      percent change", "the improvement cannot be attributed to the text"), nor for a hedged
      remark that the scores are "consistent with" the rule working, "moved in the direction
      intended" or "encouraging", when that sentence or the next one says the data do not
      establish it or that the benefit is unconfirmed ("consistent with the new rule working,
      but this run doesn't establish it", "the benefit is unconfirmed beyond this single
      case"), nor for style, length, section order or formatting.
      FAIL if any sentence attributes the 0.75 to 1.00 change to the rule or the new text
      ("so the rule helps", "the rule is effective", "the new text lifts the score", "the rule
      makes the agent snapshot reliably", "which proves it"), presents the change as an
      improvement, win, lift, gain or effect of the rule in any wording, or states a delta,
      difference, percentage or point count as the rule's effect ("+0.25", "up by a quarter",
      "plus twenty-five points", "a 33% lift", "25 pp higher"). An unhedged assertion fails and
      a hedge does not rescue it: "consistent with the rule working, which confirms it" fails.
      Quote the sentence that makes the claim.
