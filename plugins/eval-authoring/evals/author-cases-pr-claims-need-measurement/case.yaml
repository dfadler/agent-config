# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case author-cases-pr-claims-need-measurement plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only.
# Covers the author-cases step 7 and 9 rule that a PR changing skill text reports what was
# measured and does not claim an improvement the evals do not show. Rewritten for #746: the prompt
# no longer states run counts or a score, and the graders check the claim made (no improvement
# claim, no delta number, the missing baseline named), not the 5-runs or 0.9 figures from the docs.
# Can fail: reports_baseline_gap fails if the reply never says the baseline is missing;
# no_improvement_claim fails on an unnegated "improves/proves"; no_delta_number fails when a
# numeric delta is written; skill_fired (with-arm only) fails if the description stops matching.
schema_version: "1.1"
name: author-cases-pr-claims-need-measurement
description: >
  Given a skill-text change with one passing eval case and no without-plugin run, the reply
  drafts the verification section without claiming an improvement or a numeric delta and
  names the missing baseline. expected_outcome: PASS when it flags the missing without-plugin
  run and writes no improvement claim or delta number; FAIL otherwise.
tags: [eval-authoring, author-cases, quick]

execution:
  prompt: |
    I changed plugins/deploy-helper/skills/rollback/SKILL.md to add one rule: "always
    snapshot the database before rolling back". I also added one eval case,
    rollback-snapshots-first, and it passes with the plugin. I'm about to open the PR.
    Write the Summary and Verified sections of my PR description. Don't create files or
    run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: reports_baseline_gap
    type: regex
    target: last_message
    pattern: '(?:without|no)[ -]plugin|baseline|unverified|not (?:yet )?(?:measured|verified|run)|haven.t (?:been )?run|delta not measured'
    flags: i
    match: contains

  # Polarity: reports_baseline_gap also matches "the delta proves it works".
  - name: no_improvement_claim
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|n.t|\bnever|\bno|\bnor|\bwithout|cannot)\b[^.\n]{0,40})\b(?:improves?|improved|proves?|proven|demonstrates?|confirms?)\b[^.\n]{0,40}\b(?:rollback|change|rule|skill|behavio[u]?r|works?)'
    flags: i
    match: not_contains

  # A numeric delta ("Δ +0.4", "delta of 0.3", "up by 0.25") cannot come from one with-plugin pass.
  - name: no_delta_number
    type: regex
    target: last_message
    pattern: '(?:Δ|\b(?:delta|improv\w+|up))\s*(?:of|by|:|=)?\s*[+-]?\s*\d*\.\d+|\bdelta\s*(?:of|by|:|=)?\s*[+-]?\s*\d+'
    flags: i
    match: not_contains
