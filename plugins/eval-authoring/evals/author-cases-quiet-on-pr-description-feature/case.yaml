# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --trigger-boundary plugins/eval-authoring
# Trigger-boundary negative, paired with author-cases-fires-natural-edit-check: read as a fire count over many distinct prompts
# (one run, plugin arm only, no delta), not as a score.
# Near-miss for author-cases: shares "PR description" and "test plan" with author-cases but the change is a product feature, not a skill.
# Can fail: skill_not_fired fails on a run where author-cases is invoked.
schema_version: "1.1"
name: author-cases-quiet-on-pr-description-feature
description: >
  A request that shares vocabulary with author-cases but is not its job must not invoke it.
  expected_outcome: PASS when author-cases is not invoked; FAIL when it is invoked.
tags: [eval-authoring, author-cases, trigger, trigger-boundary, pair:author-cases-fires-natural-edit-check]

execution:
  prompt: |
    Draft the pull request description for my change that adds a coupon-code field to the checkout
    form. Include a short test plan. Reply with the description only.
    Don't create files or run any commands.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 0
    max: 0
