# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# Near-miss for author-cases (#745): tests a plugin's script, not a skill or agent, so it shares plugin vocabulary but needs no eval case.
# Regression guard: a no-plugin arm passes it by design (no delta), hence --ablation none via the
# quick tier.
# Can fail: skill_not_fired fails if the description over-triggers on this vocabulary.
schema_version: "1.1"
name: author-cases-quiet-on-script-pytest
description: >
  A request that shares vocabulary with author-cases but is not about `claude plugin eval` cases must
  not invoke it. expected_outcome: PASS when author-cases is not invoked and the reply addresses the
  request; FAIL when it is invoked.
tags: [eval-authoring, author-cases, trigger, quick]

execution:
  prompt: |
    Write a pytest for the `render_notes.py` script in my plugin; it takes a changelog
    file and prints markdown. Show the test in your reply.
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 0
    max: 0
    arm: both

  - name: addresses_request
    type: regex
    target: last_message
    pattern: 'def test_|pytest|assert'
    flags: i
    match: contains
    arm: both
