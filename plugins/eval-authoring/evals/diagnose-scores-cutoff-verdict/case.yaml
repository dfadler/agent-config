# Run: claude plugin eval plugins/eval-authoring --case diagnose-scores-cutoff-verdict
# Not run yet: paid, hand-off only. No grant: Skill only.
# The prompt was Delta -0.03 until #737 dropped the fixed neutral band (that Delta is now
# weak-signal or negative-delta, by run count); the scores quoted below are for the old prompt.
# Sabotage map: delete the "Verdict cutoffs" table in diagnose-scores/SKILL.md; a no-plugin model
# cannot know the verdict names, so names_verdict drops.
# Can fail: names_verdict = 0 unless the reply uses the verdict name no-discrimination.
# Scope (PR 761 review): this tests recall of the documented zero-delta rule (the "Verdict
# cutoffs" table; there is no neutral band by default since #737), not the diagnosis workflow. With no result file the skill's own step 1 says to
# stop and ask for a run, and it forbids guessing a verdict, so this prompt deliberately asks only
# what the cutoff is. It is a vocabulary check. Keep the prompt phrased as a user's own case. Wording that frames it as a recall question
# ("this is a recall question about the documented table", 2026-10-21) made the model refuse to guess
# and ask permission to load the skill instead of loading it: 0.20 with when it named the table,
# 0.00 when it did not (the replies say they cannot recall the label). The original phrasing scored
# 1.00 / 0.00.
# A model without the skill cannot guess the label
# `no-discrimination`; a pass does not show the table helps a user.
# 2026-11-04 (standard run in CI and a local re-run, #648): with "One line, no files, no commands."
# the with arm answered "I can't tell you without reading the diagnose script, and you ruled out
# files and commands" and never called the skill (0.00 in CI, 1 of 3 locally). The clause read as a
# ban on tool use, Skill included; the prompt now only asks for one line.
schema_version: "1.1"
name: diagnose-scores-cutoff-verdict
description: >
  Recall of the documented cutoff, not the diagnosis workflow: asks which diagnose verdict a Delta
  of exactly 0 gets. expected_outcome: PASS when the reply says no-discrimination; FAIL otherwise.
tags: [eval-authoring, diagnose-scores, quick]

execution:
  prompt: |
    The eval-authoring diagnose script gives each case a verdict. My case has a Delta of exactly 0.
    Which verdict does it get? Answer in one line.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: names_verdict
    type: regex
    target: last_message
    pattern: 'no-discrimination'
    flags: i
    match: contains
