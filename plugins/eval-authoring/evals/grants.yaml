# Per-case --allow-tools grants (format: plugins/eval-authoring/docs/grants-format.md).
# Write lets the run create the two case files that the case-reviewer reads. Confirmed
# in a logged-in run on 2026-10-07 (files_created passed, #450).
schema_version: "1"
grants:
  case-reviewer-flags-planted-weak-case:
    - "Write"
  # #747: Bash lets the run-evals refusal cases be graded from the trace. Each entry covers only
  # the free steps (lint, `claude auth status`, the wrapper's --dry-run); a real paid run is not
  # granted, so the model cannot start one even if it tries.
  run-evals-explicit-run-request:
    - "Bash(node plugins/eval-authoring/scripts/ts/lint/cli.ts *)"
    - "Bash(node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts * --dry-run*)"
    - "Bash(claude auth status)"
  run-evals-fires-on-wrapper-command-request:
    - "Bash(node plugins/eval-authoring/scripts/ts/lint/cli.ts *)"
    - "Bash(node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts * --dry-run*)"
    - "Bash(claude auth status)"
  run-evals-not-model-invoked:
    - "Bash(node plugins/eval-authoring/scripts/ts/lint/cli.ts *)"
    - "Bash(claude auth status)"
  case-reviewer-clean-case-control:
    - "Write"
  case-reviewer-flags-leaky-prompt:
    - "Write"
  # Fixed-path probe only (agents/grader-red-team.md); no other command, no paid run.
  grader-red-team-probes-case-on-disk:
    - "Bash(node plugins/eval-authoring/scripts/ts/check-replies.ts --probe *)"
