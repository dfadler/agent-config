# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# (quick tier: one run, plugin arm only, `--ablation none`; the no-plugin arm cannot dispatch a
# plugin agent.) Grant: Write, in grants.yaml.
# Control for case-reviewer-flags-planted-weak-case (#748). That case shows the reviewer reports
# the planted defects (a vague llm criterion, a tautological `.*` regex, no near-miss prompt, no
# sample replies); this one shows it does not report those defects on a suite that lacks them, so
# a reviewer that flags everything cannot pass both. The two files below follow the plugin's own
# guidance: natural prompts, a should-fire and a tagged near-miss, free graders, sabotage notes.
# 2026-10-30: the earlier `says_clean` grader (reviewer must say "clean" / "no findings") failed 3
# of 3 with-arm runs at 0.75 while no_invented_defect passed 3 of 3: the reviewer always finds
# something on a two-case suite (a brittle heading regex, thin coverage), and a suite it calls
# clean is not a fixture this checklist produces. Replaced by no_planted_defect_reported, the
# true-negative mirror of the planted case's graders. Replies: evals/results run-2026-10-30T20-00.
# Can fail: reviewer_dispatched fails if the model reviews the files itself;
# no_planted_defect_reported fails if the reviewer calls a grader tautological or says it matches
# every reply, or reports a missing near-miss prompt that is present; no_invented_defect fails if
# it calls the free graders vague or subjective.
# The reviewer has no Bash grant, so its lint pass reports "not run"; says_clean accepts "no findings" after that preamble.
# Unmeasured: false-positive rate (TNR). Record it from a thorough run, then re-check after a
# model change; paired planted case gives the true-positive side.
# good-reply: Mechanical pass not run. The heading regex is brittle and coverage is thin: add a second trigger prompt. Both cases have a scored grader and a sabotage note.
# bad-reply: The has-text grader is tautological, it matches every reply; the criteria are vague and there is no negative prompt.
schema_version: "1.1"
name: case-reviewer-clean-case-control
description: >
  The case-reviewer agent, given a small suite without the planted-weak-case defects, does not
  report those defects. expected_outcome: PASS when the agent is dispatched and the reply reports
  no tautological or every-reply grader, no missing near-miss prompt and no vague criterion; FAIL
  when it is not dispatched or it reports one of those defects that is not there.
tags: [eval-authoring, case-reviewer, agent, quick]

execution:
  prompt: |
    Please create these two files exactly as written, then run the eval-authoring
    case-reviewer agent on the evals directory and tell me what it found.

    File evals/release-notes-fires/case.yaml:

    ```
    schema_version: "1.1"
    # sabotage: deleting the "Use when" clause of the release-notes description fails this case's Skill grader.
    name: release-notes-fires
    description: >
      A changelog pasted into chat gets release notes that name every breaking change.
      Unmeasured: a no-plugin reply may also head the renamed command as breaking; the Skill
      fire rate is the live signal.
      expected_outcome: PASS when the skill is invoked and the reply names the breaking change;
      FAIL when it is not invoked or the breaking change is missing.
    tags: [release-notes, trigger, quick]
    execution:
      prompt: |
        Here is our changelog, can you turn it into something users can read?
        - fix: login redirect loop
        - rename `export` command to `download`; old scripts that call `export` stop working
      max_turns: 4
      allowed_tools: [Skill]
    graders:
      - name: skill_fired
        type: tool_used
        tool: Skill
        input_match: '"skill"\s*:\s*"(?:[\w-]+:)?release-notes"'
        min: 1
        arm: with-only
      - name: names_breaking_change
        type: regex
        target: last_message
        pattern: '^#{1,4}\s*.*breaking'
        flags: im
        match: contains
    ```

    File evals/release-notes-quiet/case.yaml:

    ```
    schema_version: "1.1"
    # sabotage: deleting the "not for auditing an existing CHANGELOG" exclusion from the release-notes description should make this case fail.
    name: release-notes-quiet
    description: >
      A request to audit a CHANGELOG against merged pull requests, which shares the word changelog, must not invoke the skill.
      Cheap trigger-boundary guard, no expected delta.
      expected_outcome: PASS when release-notes is not invoked; FAIL when it is.
    tags: [release-notes, trigger, quick, smoke]
    execution:
      prompt: |
        Can you check whether my CHANGELOG.md has an entry for every merged pull request?
      max_turns: 4
      allowed_tools: [Skill]
    graders:
      - name: skill_not_fired
        type: tool_used
        tool: Skill
        input_match: '"skill"\s*:\s*"(?:[\w-]+:)?release-notes"'
        min: 0
        max: 0
        arm: both
    ```
  max_turns: 14
  allowed_tools:
    - Agent
    - Write
    - Read
    - Glob
    - Grep

graders:
  - name: reviewer_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?case-reviewer"'
    min: 1

  - name: files_created
    type: file_exists
    path: "evals/release-notes-*/case.yaml"
    exists: true

  # True-negative mirror of case-reviewer-flags-planted-weak-case: none of its planted defects
  # may be reported here. "near-miss" wording about adding MORE near-misses is allowed; claiming
  # there is none is not.
  - name: no_planted_defect_reported
    type: regex
    target: last_message
    pattern: "tautolog\\w*|vacuous|matches (?:any|every) reply|(?:any|every) reply (?:matches|passes)|has_text|no (?:negative|non-firing|non-triggering|should-not)[\\s\\w-]{0,20}prompt"
    flags: i
    match: not_contains

  # Polarity: an invented defect on a clean suite. Negated phrases ("not vague") are tolerated
  # by requiring the finding words to sit right after a word that asserts the problem.
  - name: no_invented_defect
    type: regex
    target: last_message
    pattern: "(?<!\\b(?:no|not|without|nor)[-\\s,]+(?:\\w+[-\\s,]+){0,2})\\b(?:vague|subjective|tautolog\\w+|vacuous)\\s+(?:criteri|grader|pattern)|no (?:negative|non-firing|should-not)[\\s\\w-]{0,20}prompt"
    flags: i
    match: not_contains
