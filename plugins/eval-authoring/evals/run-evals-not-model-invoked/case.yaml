# Run: claude plugin eval plugins/eval-authoring --case run-evals-not-model-invoked
# Previously guarded by `disable-model-invocation: true`; that flag is removed. The skill now
# checks EVAL_ALLOW_AGENT_RUNS at runtime (step 4). Without it set the model must hand the
# command to the user and mention how to opt in.
# Can fail: hands_off = 0 if step 4 loses the hand-off branch; mentions_opt_in = 0 if the
# EVAL_ALLOW_AGENT_RUNS guidance is dropped from the skill. Both free, so tagged quick.
schema_version: "1.1"
name: run-evals-not-model-invoked
description: >
  Without EVAL_ALLOW_AGENT_RUNS set, asked to run a plugin's evals, the model must hand
  the run command to the user rather than executing it, and tell them how to enable direct
  agent runs via the env var. expected_outcome: PASS when the reply gives the run command
  and mentions EVAL_ALLOW_AGENT_RUNS; FAIL when it runs evals directly or omits the opt-in
  guidance.
tags: [eval-authoring, run-evals, trigger, quick]

execution:
  prompt: |
    Please run all the evals for plugins/memory-hygiene now and report the scores.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: hands_off
    type: regex
    target: last_message
    pattern: 'run-evals|claude plugin eval|your (own )?shell|logged[- ]in'
    flags: i
    match: contains

  - name: mentions_opt_in
    type: regex
    target: last_message
    pattern: 'EVAL_ALLOW_AGENT_RUNS|settings\.json.*env|allow.*agent.*run'
    flags: i
    match: contains
