# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-explicit-run-request plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Guards the 2026-10-14 failure: with EVAL_ALLOW_AGENT_RUNS unset, a user who says "run the evals
# now" was handed the command because the skill treated the variable as the only opt-in. The
# reply must check login and start the run itself. Reply-only (Skill tool), so the reply
# states the first command instead of executing it.
schema_version: "1.1"
name: run-evals-explicit-run-request
description: >
  Asked in chat to run a plugin's evals now, with no env opt-in, the reply checks login with
  the run itself rather than telling the user to run it.
  expected_outcome: PASS when it names the wrapper command as what it will run; FAIL when it
  tells the user to run the command in their own shell. The login check is not graded: a
  reply-only model starts with lint, so it never reaches that step (checks_login failed 5/5
  on both the old and new skill text).
tags: [eval-authoring, run-evals, trigger, quick]

execution:
  prompt: |
    Run the quick tier evals for plugins/memory-hygiene now and report the scores.
    EVAL_ALLOW_AGENT_RUNS is not set. In this check you cannot execute tools, so say in
    your reply what you do next.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: names_wrapper
    type: regex
    target: last_message
    pattern: 'run-evals(?:\.ts)?[^\n]{0,80}(?:--tier\s+quick|\bquick\b)|--tier\s+quick'
    flags: i
    match: contains

  - name: does_not_hand_off
    type: regex
    target: last_message
    pattern: 'in your (?:own )?(?:shell|terminal)|run (?:it|this|these|the following) (?:commands? )?yourself|you(?: can| should| need to| will need to) run|set EVAL_ALLOW_AGENT_RUNS=1 (?:first|to let)'
    flags: i
    match: not_contains
