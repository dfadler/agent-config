# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-explicit-run-request plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". Grants: grants.yaml (Bash narrowed to
# the lint, the wrapper's --dry-run and `claude auth status`; a real paid run is not granted, so a
# denied attempt still shows in the trace). Default two arms.
# Guards the 2026-10-14 failure: with EVAL_ALLOW_AGENT_RUNS unset, a user who says "run the evals
# now" was handed the command because the skill treated the variable as the only opt-in. Reworked
# for #747: the prompt no longer says the model cannot execute tools; it is given Bash and the trace
# shows whether it started the wrapper itself (tool_used) after linting (tool_order).
# Unverified until a run: that a denied (ungranted) Bash call still appears in the trace.
schema_version: "1.1"
name: run-evals-explicit-run-request
description: >
  Asked in chat to run a plugin's evals now, with no env opt-in, the model starts the wrapper
  itself, after the lint, instead of telling the user to run it. expected_outcome: PASS when the
  trace has a Bash call to run-evals.ts after a lint call and the reply does not hand the command
  off; FAIL when it tells the user to run the command in their own shell.
tags: [eval-authoring, run-evals, trigger, quick]

execution:
  prompt: |
    Run the quick tier evals for plugins/memory-hygiene now and report the scores.
    EVAL_ALLOW_AGENT_RUNS is not set.
  max_turns: 10
  allowed_tools:
    - Skill
    - Bash

graders:
  # Steps: the wrapper was started from this session.
  - name: wrapper_started
    type: tool_used
    tool: Bash
    input_match: 'run-evals\.ts'
    min: 1

  # Steps: lint came first (run-evals step 2 before step 3's dry-run).
  - name: lint_before_wrapper
    type: tool_order
    before:
      tool: Bash
      input_match: 'lint/cli\.ts'
    after:
      tool: Bash
      input_match: 'run-evals\.ts'

  - name: does_not_hand_off
    type: regex
    target: last_message
    pattern: 'in your (?:own )?(?:shell|terminal)|run (?:it|this|these|the following) (?:commands? )?yourself|you(?: can| should| need to| will need to) run|set EVAL_ALLOW_AGENT_RUNS=1 (?:first|to let)'
    flags: i
    match: not_contains
