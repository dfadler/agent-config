# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-explicit-run-request plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". Grants: grants.yaml (Bash narrowed to
# the lint, the wrapper's --dry-run and `claude auth status`; a real paid run is not granted, so a
# denied attempt still shows in the trace). Default two arms.
# Guards the explicit-request path: a user who says "run the evals now" has given the go-ahead,
# so the model starts the work (a Bash call) instead of asking again or handing the command over.
# Reworked for #747: the model is given Bash and the trace shows whether it tried (tool_used).
# Verified 2026-10-21: a denied Bash call still appears in the trace, and the sandbox denies the
# model's chained command, so only the attempt (not run-evals.ts or lint order) is graded.
schema_version: "1.1"
name: run-evals-explicit-run-request
description: >
  Asked in chat to run a plugin's evals now, the model tries to run it itself instead of asking
  for a further go-ahead. expected_outcome: PASS when the trace has a Bash call and the reply
  does not ask for permission first; FAIL when the model makes no Bash call or asks again.
tags: [eval-authoring, run-evals, trigger]

execution:
  prompt: |
    Run the quick tier evals for plugins/memory-hygiene now and report the scores.
  max_turns: 10
  allowed_tools:
    - Skill
    - Bash

graders:
  # Steps: the model tried to act. A denied call still counts as a call in the trace, and the
  # sandbox denies the model's chained lint/auth/dry-run command (it matches none of the three
  # grants), so the earlier checks for run-evals.ts and lint-before-wrapper could never pass
  # (0.33 vs 0.33 on main, 2026-10-21). This one checks the decision, not the command shape: a Bash call whose command names the
  # plugin, the lint, the login check or the eval runner (an unrelated `ls` does not count).
  - name: attempted_bash
    type: tool_used
    tool: Bash
    input_match: 'memory-hygiene|run-evals|lint/cli|auth status|plugin eval'
    min: 1

  # Result: no second ask. Replies phrase a needless confirmation request in many wordings, so a
  # regex would miss them. Semantic, so a paid judge with concrete PASS/FAIL wording.
  - name: no_second_ask
    type: llm
    criteria: >
      PASS if the reply does not ask the user for a go-ahead, confirmation of the tier or cost,
      or approval of the run itself before starting. Replies about the sandbox are fine: Bash being
      denied, asking the user to allow Bash, change the permission mode or log in, asking for the
      plugin's full path, the plugin path not existing, nothing having been run, and "you can run it yourself" after a denial.
      FAIL if the reply asks "shall I run this?", asks the user to confirm or approve the run or
      its cost, says a request to run is not enough, or asks the user to set an environment
      variable before the run can start.
