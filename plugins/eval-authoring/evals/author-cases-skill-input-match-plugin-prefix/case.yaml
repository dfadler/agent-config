# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier thorough --case author-cases-skill-input-match-plugin-prefix plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Covers the author-cases Gotcha (#713, EVAL022): a Skill input_match allows an optional `plugin:`
# prefix. The prompt says the skill belongs to an installed plugin but never gives the call form.
# skill_fired is with-only. Measured 2026-10-14, 5 runs per arm: with the plugin 1.00 on both
# this branch's author-cases text and main's, no plugin 0.50. So the Gotcha bullet is not what
# makes the plugin arm pass (main's skill already does); this is a regression guard for the
# plugin as a whole, not evidence the bullet helps.
schema_version: "1.1"
name: author-cases-skill-input-match-plugin-prefix
description: >
  Asked for the should-fire grader of a skill in an installed plugin, the reply writes a
  tool_used Skill input_match whose regex allows an optional plugin: prefix before the skill
  name. expected_outcome: PASS when the pattern accepts both rollback and deploy-helper:rollback;
  FAIL when it anchors the bare name right after the opening quote.
tags: [eval-authoring, author-cases, quick]

execution:
  prompt: |
    My plugin deploy-helper has a skill called rollback. I'm writing a claude plugin eval
    case that checks the skill fires when a user says "the release broke prod, undo it".
    Write just the one tool_used grader for that, in YAML, in a code block. Don't create
    files or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: has_skill_grader
    type: regex
    target: last_message
    pattern: 'tool_used'
    flags: i
    match: contains

  # The optional-prefix group, in any spelling: (?:[\w-]+:)? or (?:deploy-helper:)? or (?:\w+:)?
  - name: prefix_optional
    type: regex
    target: last_message
    pattern: '\(\?:[^)]{1,40}:\)\?'
    match: contains
