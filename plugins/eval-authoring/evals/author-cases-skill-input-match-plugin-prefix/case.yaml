# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier thorough --case author-cases-skill-input-match-plugin-prefix plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Covers the author-cases Gotcha (#713, EVAL022): installed plugins are called as `plugin:name`.
# Rewritten for #746: the prompt now presents a failing grader and its symptom instead of asking
# for the answer; it never mentions a prefix. The reply is graded on the grader it hands back
# (the fixed input_match must accept both call forms), not on a doc phrase.
# Regression guard, no expected delta: in traces the skill does not fire here (0 of 6 runs) and the
# no-plugin model already answers with an optional prefix group, so the arms tie. No skill_fired
# grader for that reason. The grader once required a non-capturing `(?:` group and failed correct
# replies that wrote `(deploy-helper:)?`; it now accepts both. Prompt no longer says "installed".
schema_version: "1.1"
name: author-cases-skill-input-match-plugin-prefix
description: >
  Given a should-fire grader that never passes in the with-plugin arm although the trace shows
  the skill being called, the reply hands back a corrected input_match that still matches when
  the call is namespaced. expected_outcome: PASS when the corrected pattern accepts both
  `rollback` and `deploy-helper:rollback`; FAIL when it still anchors the bare name right after
  the opening quote.
tags: [eval-authoring, author-cases, quick]

execution:
  prompt: |
    My claude plugin eval case for the `rollback` skill in my deploy-helper plugin
    fails every run: skill_fired is 0, yet the transcript clearly shows the skill being
    called. This is the grader:

    ```yaml
    - name: skill_fired
      type: tool_used
      tool: Skill
      input_match: '"skill"\s*:\s*"rollback"'
      min: 1
    ```

    Give me the corrected grader in a code block. Don't create files or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  # The fix, in any spelling: an optional group (capturing or not) before the name, e.g.
  # (?:[\w-]+:)?, (?:deploy-helper:)? or (deploy-helper:)? (real replies used the capturing form)
  - name: prefix_optional
    type: regex
    target: last_message
    pattern: '\((?:\?:)?[^)]{1,40}:\)\?\s*rollback'
    match: contains
