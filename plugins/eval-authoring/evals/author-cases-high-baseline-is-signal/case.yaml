# Run: claude plugin eval plugins/eval-authoring --case author-cases-high-baseline-is-signal --runs 5 --trust-plugin --no-publish
# Covers step 7 and the Independence bullet: a without-plugin score of 0.90+ is a signal to inspect
# the prompt, not proof it leaks the answer. Reply-only; EVAL009 info is intentional.
# Sabotage map: restore "means the prompt hands over the answer" in step 7 and
# no_flat_leak_claim should fail in the with arm; delete the inspect-the-prompt clause and
# inspects_prompt should fail.
# The first inspects_prompt regex missed replies that put a period or line break between
# "check" and "prompt"; the pattern above was widened after reading those replies.
# Run 1 note: the first prompt did not read as case authoring, so the skill fired in 1 of 3 runs.
# no_flat_leak_claim passed in every run of that run, so inspects_prompt carries the signal.
# Can fail: a no-plugin reply may call the prompt leaky outright or never say to inspect it.
# Likely delta: uncertain, a plain model may already hedge (#690); unmeasured until a two-arm run.
schema_version: "1.1"
name: author-cases-high-baseline-is-signal
description: >
  Given an eval case that scores 0.92 without the plugin, the reply says to inspect the prompt
  before rewriting or dropping the case and does not assert that the prompt leaks the answer.
  expected_outcome: PASS when the reply tells the user to inspect the prompt and makes no flat
  leakage claim; FAIL otherwise.
tags: [eval-authoring, author-cases, baseline]

execution:
  prompt: |
    I'm writing eval cases for my plugin's `summarize-pr-risk` skill. One case I wrote
    scored 1.00 with the plugin and 0.92 without it, 5 runs per arm. Should I keep, rewrite
    or drop this case?
    Don't create files or run any commands.
  max_turns: 4
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  # PASS if the reply says to look at / inspect / read the prompt before deciding.
  # FAIL if it jumps straight to rewrite or drop.
  - name: inspects_prompt
    type: regex
    target: last_message
    pattern: '(?:inspect|check|read|review|look at|examine)[\s\S]{0,80}\bprompt\b|does the prompt (?:give|hand|leak|reveal)'
    flags: i
    match: contains

  # Polarity: only an unhedged "the prompt leaks/hands over the answer" fails.
  - name: no_flat_leak_claim
    type: regex
    target: last_message
    pattern: '(?<!\b(?:whether|if|may|might|could|not|never|does|n.t)\s+(?:be\s+)?(?:that\s+)?(?:the\s+)?)\b(?:prompt|case)\b[^.\n]{0,30}\b(?:leaks?|hands? over|gives? away|reveals?)\b[^.\n]{0,20}\banswer'
    flags: i
    match: not_contains

  # Paid, because "Drop the case. Inspect the prompt later." matches inspects_prompt; the order
  # of inspecting and deciding is semantic. Narrow: one judgement on the final reply.
  - name: inspects_before_deciding
    type: llm
    criteria: >
      PASS if the reply lists examining the prompt, for example whether it gives away the answer,
      as a step to take before rewriting or dropping the case. FAIL if it tells the user to
      rewrite or drop the case with no such step, or mentions examining the prompt only after
      that recommendation.
