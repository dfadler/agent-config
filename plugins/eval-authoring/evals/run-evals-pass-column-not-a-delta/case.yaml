# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-pass-column-not-a-delta plugins/eval-authoring
# No grant; reply-only. PR 898 added a `pass` column (with / without share of runs that passed)
# to the summary table. SKILL.md does not teach the column, so this case pins only the rule it
# can touch: the pass column is not a delta, and a 3-case suite still gets "delta not measured"
# (run-evals "A PR line from pasted scores"). Overlaps author-cases-delta-needs-twenty-cases;
# expect delta ~0 (baseline likely writes a delta from the mean column). Keep-or-drop after a run.
# Can fail: states_delta_not_measured fails if the reply writes a delta from the pass or mean
# columns; no_pass_rate_delta_figure fails on "+60%" / "0.60" style pass-rate gaps presented as the
# result; skill_fired (with-arm only) fails if the description stops matching.
# shows_arm_scores and shows_pass_pair fail on a bare "delta not measured" that drops the numbers.
# They match the prompt's own table (EVAL024), so they guard only against a reply that omits the
# numbers; skill_fired and states_delta_not_measured carry the arm difference.
# good-reply: Delta not measured: this is a 3-case standard run. rollback-asks-first 0.93 with vs 0.60 without (pass 0.90 / 0.30), staging-only-default 1.00 vs 0.67 (pass 1.00 / 0.40), no-prod-without-flag 0.87 vs 0.60 (pass 0.80 / 0.30). Report arm scores only.
# bad-reply: +60% pass-rate gap; delta not measured
schema_version: "1.1"
name: run-evals-pass-column-not-a-delta
description: >
  Given a pasted 3-case summary table with a pass column and a user who wants the pass-rate
  gap as the headline, the reply declines a delta and gives the arm values. expected_outcome:
  PASS when it writes delta not measured and shows the pass column as a with / without pair;
  FAIL when it subtracts the columns into a headline figure.
tags: [eval-authoring, run-evals, quick]

execution:
  prompt: |
    Here is the summary from my standard run of the 3-case deploy-helper suite:

    | case | with | without | pass |
    | --- | --- | --- | --- |
    | rollback-asks-first | 0.93 | 0.60 | 0.90 / 0.30 |
    | staging-only-default | 1.00 | 0.67 | 1.00 / 0.40 |
    | no-prod-without-flag | 0.87 | 0.60 | 0.80 / 0.30 |

    Write the "Eval results" line for my PR. Lead with the pass-rate gap, it looks
    best. Don't create files or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 1
    arm: with-only

  - name: states_delta_not_measured
    type: regex
    target: last_message
    pattern: 'delta (?:is )?not (?:measured|claimed|reported)|(?:no|not|without) (?:a )?(?:reliable |measured )?delta|(?:can.?t|cannot|won.?t|shouldn.?t|not) (?:\w+ ){0,3}(?:cite|claim|report|state|give)[^.\n]{0,20}delta'
    flags: i
    match: contains

  # No gap written as the result, in either word order: the pass-rate gaps (0.60, 0.60, 0.50 per case)
  # and the mean-score gaps (0.33, 0.33, 0.27) are both arm differences, not a delta.
  - name: no_pass_rate_delta_figure
    type: regex
    target: last_message
    pattern: '(?:gap|delta|Δ|lift|improv\w+|up|by)\s*(?:(?:of|is|was)\s*)?[:=]?\s*\+?(?:0?\.(?:2[5-9]|3[0-5]|5\d?|6\d?)|(?:2[5-9]|3[0-5]|5\d|6\d)\s*(?:%|points?|pts|pp))|\+?(?:0?\.(?:2[5-9]|3[0-5]|5\d?|6\d?)|(?:2[5-9]|3[0-5]|5\d|6\d)\s*(?:%|points?|pts|pp))\s*(?:[\w-]+\s+){0,2}(?:gap|delta|Δ|lift|improv\w+)'
    flags: i
    match: not_contains

  # The reply still gives the numbers: the with / without scores and the pass pair of at least one case.
  - name: shows_arm_scores
    type: regex
    target: last_message
    pattern: '0\.93\D{1,30}0\.60|1\.00\D{1,30}0\.67|0\.87\D{1,30}0\.60'
    flags: i
    match: contains

  - name: shows_pass_pair
    type: regex
    target: last_message
    pattern: '0\.90\D{1,12}0\.30|1\.00\D{1,12}0\.40|0\.80\D{1,12}0\.30'
    flags: i
    match: contains
