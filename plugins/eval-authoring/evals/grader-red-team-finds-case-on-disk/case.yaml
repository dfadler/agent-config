# Run (manual): the wrapper passes --scaffold only when you give it --scaffold; print its command with --dry-run --scaffold:
#   node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --dry-run --tier quick --case grader-red-team-finds-case-on-disk plugins/eval-authoring
# (quick tier: one run, plugin arm only, `--ablation none`; the no-plugin arm cannot dispatch a
# plugin agent.) No grant, no Bash.
# UNMEASURED DRAFT (follow-up to #859), third revision. What it tests: the case is on disk
# (a scaffold_script plants ./planted/evals/release-notes-deprecation) and the prompt names it by
# directory, so the agent must find and read it from the workspace; the sibling
# grader-red-team-flags-planted-weak-grader pastes the case text into the prompt. It grades the
# by-hand finding only.
# OBSERVED, WHY THE PROBE IS NOT GRADED: `check-replies.ts --probe` cannot be exercised by an
# eval. Run 1 (with a Bash grant): the agent's relative-path probe failed because the empty
# workspace has no plugins/eval-authoring/scripts/ts/, and its absolute-path retry was denied by
# the grant. Run 2 (scaffold copied the script to the pinned path): the subagent's Bash was
# denied under `--allow-tools` (Bash called 0x; the agent's report said so), 3 of 3 runs, so it
# traced by hand. The probe is covered by check-replies.test.ts, not by an eval. probe_used and
# probe_ran were removed; Bash, the grant and the scaffold's copy of the script went with them.
# History: first run 0.83 (a bare date as the "sound" control was fooled by "removal planned
# 2028-01-01 (not 2027-01-01)", so the agent flagged both graders); second 0.71 (control and
# names_weak_grader fixed, only the two probe graders failed).
# Planted defect: names_deprecation matches the bare stem "deprecat"; "Nothing is deprecated in
# this release." passes it. names_removal_date is anchored to a removal word and rejects negated
# lines, so names_deprecation is the only planted weakness. A reply that finds another hole in
# the control is a real finding about the control, not a pass.
# Can fail: reviewer_dispatched = 0 if the main model red-teams it itself; names_weak_grader = 0
# if the agent answers Clean or never ties names_deprecation to a wrong reply (it cannot do that
# without reading the case from disk); quotes_wrong_reply = 0 if it gives no negated-deprecation
# wrong reply; not_denial and not_bare_clean reject the opposite verdicts.
# Sabotage note: deleting the "Write the wrong replies" step (recipe step 2) from
# agents/grader-red-team.md should make the agent give generic advice and fail
# quotes_wrong_reply. Not run.
# good-reply: names_deprecation | by hand | wrong reply: "Nothing is deprecated in this release." | passes because the pattern is the bare stem | Fix: anchor it to the command name and the removal
# bad-reply: names_removal_date passes no wrong replies; every weak reply it tried is rejected.
schema_version: "1.1"
name: grader-red-team-finds-case-on-disk
description: >
  Asked to red-team a case that exists on disk by its directory name, the grader-red-team agent
  reads it from the workspace and names the grader a wrong reply fools.
  expected_outcome (unmeasured draft, third revision): PASS when the agent is dispatched and the
  reply ties names_deprecation to a negated wrong reply that passes it; FAIL when it is not
  dispatched, answers Clean, or gives only generic advice. The probe itself is not graded: a
  subagent's Bash is denied under `claude plugin eval --allow-tools`, so an eval cannot exercise
  `check-replies.ts --probe`, and the finding is traced by hand.
tags: [eval-authoring, grader-red-team, agent, quick]

context:
  scaffold_script: scaffold-script

execution:
  prompt: |
    Before I pay for a run, please use the eval-authoring grader-red-team agent to find which
    grader in the case `release-notes-deprecation` can be fooled by a wrong reply. The case is
    in this workspace under `planted/evals/` (plugin root `planted`). Tell me what it found.
  max_turns: 12
  allowed_tools:
    - Agent

graders:
  - name: reviewer_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?grader-red-team"'
    min: 1

  # The grader name and wrong-reply wording within 600 characters, either order, backticked or
  # plain (the agent's row is `<case>:<grader> | by hand | wrong reply: ... | passes because ...`).
  - name: names_weak_grader
    type: regex
    target: last_message
    pattern: "names_deprecation[\\s\\S]{0,600}(?:wrong repl|fooled|would pass|passes|accepts)|(?:wrong repl|fooled|would pass|passes|accepts)[\\s\\S]{0,600}names_deprecation"
    flags: i
    match: contains

  # Affirmative evidence: a quoted reply that negates "deprecated", not just the grader name next
  # to a pass word.
  - name: quotes_wrong_reply
    type: regex
    target: last_message
    pattern: '["“`\x27](?:[^"”`\x27\n]*\s)?(?:no|not|none|nothing|without|never|zero|non)\s+(?:\w+\s+){0,3}deprecat[^"”`\x27\n]*["”`\x27]|["“`\x27][^"”`\x27\n]*\bdeprecat\w*\b[^"”`\x27\n]*\b(?:none|nothing|zero)\b[^"”`\x27\n]*["”`\x27]'
    flags: i
    match: contains

  - name: not_denial
    type: regex
    target: last_message
    pattern: '\b(?:pass|passes|accept|accepts|fool|fools|let|lets)\s+(?:through\s+)?(?:no|zero|none of)\b[^.\n]{0,40}wrong|\b(?:no|none|zero|not one|neither)\b[^.\n]{0,40}wrong repl\w*[^.\n]{0,40}\b(?:pass|passes|passed|accept|accepts|fool|fools|slip|slips)\b'
    flags: i
    match: not_contains

  - name: not_bare_clean
    type: regex
    target: last_message
    pattern: "^\\s*Clean\\s*$"
    flags: im
    match: not_contains
