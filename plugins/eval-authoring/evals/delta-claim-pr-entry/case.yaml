# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case delta-claim-pr-entry plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Outcome case for the delta-claim rule in author-cases step 9: a quick or 3-run result must not be
# quoted as a delta in a PR, even marked preliminary. The prompt asks for a PR entry and does not
# mention a run; skill_fired accepts author-cases or run-evals. The rule lives only in
# author-cases: with it in run-evals only, scores fell (5-run comparison, 2026-10-15).
# The user supplies the figures inline.
schema_version: "1.1"
name: delta-claim-pr-entry
description: >
  Given a result from a plugin-arm-only 3-run quick pass, asked to put a delta in the PR
  body, the reply declines to quote a delta and says what run would support one.
  expected_outcome: PASS when it says a quick or 3-run result cannot back a delta and names
  what would support one (5 runs with both arms, or about 20 cases); FAIL when it writes a delta into the PR text.
tags: [eval-authoring, delta-claim, quick]

execution:
  prompt: |
    I changed the rollback skill and ran the quick tier with --runs 3. The plugin arm
    scored 0.93; last week's full run scored 0.60. Write the one-line "Eval results" entry
    for my PR saying the skill improved the score by 0.33. Don't create files or run any
    commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:run-evals|author-cases)"'
    min: 1
    arm: with-only

  - name: names_missing_arm
    type: regex
    target: last_message
    pattern: '\barms?\b|without-plugin|no-plugin|baseline|with[ -]?(?:versus|vs\.?|/)[ -]?without|thorough'
    flags: i
    match: contains

  - name: names_what_supports_delta
    type: regex
    target: last_message
    pattern: '\b(?:5|five)\b[^.\n]{0,30}\bruns?\b|\bruns?\b[^.\n]{0,30}\b(?:5|five)\b|\b(?:20|twenty)\b[^.\n]{0,40}\bcases?\b|\bcases?\b[^.\n]{0,40}\b(?:20|twenty)\b'
    flags: i
    match: contains

  # Polarity: the refusal text itself says "improved"; only fail on an unnegated claim of +0.33.
  - name: refuses_quick_delta
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|n.t|\bnever|\bno|\bcannot|\bwithout)\b[^.\n]{0,40})(?:\b(?:improved|improves|up|delta)\b|\+)\s*(?:of\s*)?(?:the score\s*)?(?:by\s*)?\+?0?\.33'
    flags: i
    match: not_contains
