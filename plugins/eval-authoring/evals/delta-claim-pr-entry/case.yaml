# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case delta-claim-pr-entry plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Outcome case for the delta-claim rule in author-cases step 9: a quick or 3-run result must not be
# quoted as a delta in a PR, even marked preliminary. The prompt asks for a PR entry and does not
# mention a run; skill_fired accepts author-cases or run-evals. The rule lives only in
# author-cases: with it in run-evals only, scores fell (5-run comparison, 2026-10-15).
# Rewritten for #746: the prompt gives one score and no comparison figures, so it no longer hands
# over the "0.93 vs 0.60" trap; the graders check that no delta is written and that the reply
# says the delta is not measured, not that it repeats the docs' 5-run wording.
schema_version: "1.1"
name: delta-claim-pr-entry
description: >
  Given a score from a plugin-arm-only quick pass, asked to put an improvement figure in the PR
  body, the reply declines to quote a delta and says it is not measured.
  expected_outcome: PASS when it writes no numeric delta and says the delta is not measured or
  needs a with/without comparison; FAIL when it writes a delta into the PR text.
tags: [eval-authoring, delta-claim, quick]

execution:
  prompt: |
    I changed the rollback skill and ran the quick tier of the evals, which only runs the
    plugin arm. It scored 0.93, and the last full run I remember was a lot lower. Write the
    one-line "Eval results" entry for my PR saying by how much the skill improved the score.
    Don't create files or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:run-evals|author-cases)"'
    min: 1
    arm: with-only

  - name: says_delta_unmeasured
    type: regex
    target: last_message
    pattern: 'delta[^.\n]{0,30}(?:not measured|unmeasured|can.t|cannot|not supported)|(?:no|without)[^.\n]{0,20}(?:baseline|without-plugin|no-plugin)|\barms?\b[^.\n]{0,40}(?:both|missing|needed)|with[ -]?(?:versus|vs\.?|/)[ -]?without'
    flags: i
    match: contains

  # Polarity: the refusal text itself says "improved"; only fail on an unnegated numeric delta.
  - name: no_numeric_delta
    type: regex
    target: last_message
    pattern: '(?<!(?:\bnot|n.t|\bnever|\bno|\bcannot|\bwithout)\b[^.\n]{0,40})(?:\b(?:improved|improves|up|delta|Δ)\b|\+)\s*(?:of\s*)?(?:the score\s*)?(?:by\s*)?\+?\d*\.\d+'
    flags: i
    match: not_contains
