# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# Near-miss for author-cases (#745): shares "plugin" and "tests" but wants CI config. Regression guard: a no-plugin arm passes it
# by design (no delta), hence --ablation none via the quick tier.
# Can fail: skill_not_fired fails if the description over-triggers on this vocabulary.
# good-reply: name: CI / on: pull_request / jobs: test: runs-on: ubuntu-latest / steps: uses actions/checkout@v4, then run: pnpm test
# bad-reply: Add a GitHub Actions workflow that checks out the repo and runs the test suite on every pull request.
schema_version: "1.1"
name: author-cases-quiet-on-ci-workflow
description: >
  A request that shares vocabulary with author-cases but is not about `claude plugin eval` cases must
  not invoke it. expected_outcome: PASS when author-cases is not invoked and the reply addresses the
  request; FAIL when it is invoked.
tags: [eval-authoring, author-cases, trigger, quick]

execution:
  prompt: |
    Write a GitHub Actions workflow that runs my plugin's vitest tests on every pull request.
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 0
    max: 0
    arm: both

  - name: addresses_request
    type: regex
    target: last_message
    pattern: '(?=[\s\S]*\bruns-on:)(?=[\s\S]*\bpull_request\b)(?=[\s\S]*\brun:[\s\S]{0,120}?\b(?:vitest|(?:npm|pnpm|yarn|bun)(?: \S+){0,2} test)\b)'
    flags: i
    match: contains
    arm: both
