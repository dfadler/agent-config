# Run (manual): the wrapper never passes --scaffold, so print its command with --dry-run and add
# --scaffold by hand to the `claude plugin eval` line it prints:
#   node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --dry-run --tier quick --case grader-red-team-probes-case-on-disk plugins/eval-authoring
# (quick tier: one run, plugin arm only, `--ablation none`; the no-plugin arm cannot dispatch a
# plugin agent.) Grant: Bash(node plugins/eval-authoring/scripts/ts/check-replies.ts --probe *)
# only (grants.yaml), the fixed-path probe command from agents/grader-red-team.md.
# UNMEASURED DRAFT (follow-up to #859): never run. Why it exists: the probe looks a case up by
# directory name on disk (readSuite), but grader-red-team-flags-planted-weak-grader pastes the
# case text into the prompt, so the agent traces by hand and no eval exercises the probe. Here a
# scaffold_script puts the case on disk at ./planted/evals/release-notes-deprecation and the
# prompt names it by directory.
# First paid run (0.83) found: the relative probe path did not exist in the empty workspace and
# the agent's absolute-path retry was denied by the grant, so probe_used passed on a failed
# attempt; the "sound" control (a bare date) was fooled by "removal planned 2028-01-01 (not
# 2027-01-01)", so the agent flagged both graders; names_weak_grader never matched. Fixed: the
# scaffold-script now copies check-replies.ts and the parser it imports (non-test .ts files) to
# plugins/eval-authoring/scripts/ts/ in the workspace, the path the grant pins; the control is a
# negation-guarded "removed on/removal by <date>" line; probe_ran requires the agent's own
# `| probe |` label (it writes `by hand` when the probe failed); names_weak_grader accepts the
# grader name before or after the wrong-reply wording, backticked or plain.
# Unverified: (1) the scaffold finds the plugin root from the script's own location
# (evals/<case>/ two levels up) or $CLAUDE_PLUGIN_ROOT; if the harness runs a copy elsewhere
# neither resolves, the script warns on stderr, exits 0 and the probe fails in the run (offline
# I ran the scaffold from the case dir into an empty directory and the exact grant-form probe
# worked there); (2) whether the grant rule matches the heredoc form (agents/grader-red-team.md,
# "Unverified"); (3) whether a subagent's Bash call appears in the graded trace.
# probe_used / probe_ran = 0 may mean one of these, not an agent fault: read the --keep-temp
# trace first. If (1) cannot be made to work, drop probe_used and probe_ran and grade only the
# by-hand finding.
# Planted defect: names_deprecation matches the bare stem "deprecat"; "Nothing is deprecated in
# this release." passes it. names_removal_date is anchored to a removal word and rejects negated
# lines (the probe printed FAIL on "removal planned 2028-01-01 (not 2027-01-01)"), so
# names_deprecation is the only planted weakness. A reply that finds another hole in the control
# is a real finding about the control, not a pass.
# Can fail: reviewer_dispatched = 0 if the main model red-teams it itself; probe_used = 0 if the
# agent never tries the probe; probe_ran = 0 if the probe failed and the agent fell back to by
# hand; names_weak_grader = 0 if it answers Clean or never ties names_deprecation to a wrong
# reply; quotes_wrong_reply = 0 if it gives no negated-deprecation wrong reply; not_denial and
# not_bare_clean reject the opposite verdicts.
# Sabotage note: deleting step 3 ("Probe the free graders") from agents/grader-red-team.md
# should fail probe_used.
# good-reply: names_deprecation | probe | wrong reply: "Nothing is deprecated in this release." | passes because the pattern is the bare stem | Fix: anchor it to the command name and the removal
# bad-reply: names_removal_date passes no wrong replies; every weak reply it tried is rejected.
schema_version: "1.1"
name: grader-red-team-probes-case-on-disk
description: >
  Asked to red-team a case that exists on disk by its directory name, the grader-red-team agent
  runs check-replies.ts --probe on it and names the grader a wrong reply fools.
  expected_outcome (unmeasured draft, second revision): PASS when the agent is dispatched, its
  probe runs (the finding is labelled `probe`, not `by hand`), and the reply ties
  names_deprecation to a negated wrong reply that passes it; FAIL when it traces by hand, the
  probe fails, or it answers Clean.
tags: [eval-authoring, grader-red-team, agent, quick]

context:
  scaffold_script: scaffold-script

execution:
  prompt: |
    Before I pay for a run, please use the eval-authoring grader-red-team agent to find which
    grader in the case `release-notes-deprecation` can be fooled by a wrong reply. The case is
    in this workspace under `planted/evals/` (plugin root `planted`), and the plugin's probe
    script is `plugins/eval-authoring/scripts/ts/check-replies.ts`. Tell me what it found.
  max_turns: 12
  allowed_tools:
    - Agent
    - Bash

graders:
  - name: reviewer_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?grader-red-team"'
    min: 1

  # The probe was attempted, by directory name (the case is on disk, so no hand trace is needed).
  # An attempt only: it passes on a failed call, so probe_ran below checks it worked.
  - name: probe_used
    type: tool_used
    tool: Bash
    input_match: 'check-replies\.ts --probe release-notes-deprecation'
    min: 1

  # The agent's output format labels each finding `probe` or `by hand`; it writes `by hand` when
  # the probe did not run. Wording regex: a relay that drops the table row can miss it.
  - name: probe_ran
    type: regex
    target: last_message
    pattern: 'names_deprecation[`*\s]*\|\s*probe\b'
    flags: i
    match: contains

  # The grader name and wrong-reply wording within 600 characters, either order, backticked or
  # plain (the agent's row is `<case>:<grader> | probe | wrong reply: ... | passes because ...`).
  - name: names_weak_grader
    type: regex
    target: last_message
    pattern: "names_deprecation[\\s\\S]{0,600}(?:wrong repl|fooled|would pass|passes|accepts)|(?:wrong repl|fooled|would pass|passes|accepts)[\\s\\S]{0,600}names_deprecation"
    flags: i
    match: contains

  # Affirmative evidence: a quoted reply that negates "deprecated", not just the grader name next
  # to a pass word.
  - name: quotes_wrong_reply
    type: regex
    target: last_message
    pattern: '["“`\x27](?:[^"”`\x27\n]*\s)?(?:no|not|none|nothing|without|never|zero|non)\s+(?:\w+\s+){0,3}deprecat[^"”`\x27\n]*["”`\x27]|["“`\x27][^"”`\x27\n]*\bdeprecat\w*\b[^"”`\x27\n]*\b(?:none|nothing|zero)\b[^"”`\x27\n]*["”`\x27]'
    flags: i
    match: contains

  - name: not_denial
    type: regex
    target: last_message
    pattern: '\b(?:pass|passes|accept|accepts|fool|fools|let|lets)\s+(?:through\s+)?(?:no|zero|none of)\b[^.\n]{0,40}wrong|\b(?:no|none|zero|not one|neither)\b[^.\n]{0,40}wrong repl\w*[^.\n]{0,40}\b(?:pass|passes|passed|accept|accepts|fool|fools|slip|slips)\b'
    flags: i
    match: not_contains

  - name: not_bare_clean
    type: regex
    target: last_message
    pattern: "^\\s*Clean\\s*$"
    flags: im
    match: not_contains
