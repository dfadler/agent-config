# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case author-cases-baseline-threshold-rule-of-thumb plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Covers PR 760's wording in author-cases: the 0.90 baseline signal and the 20% over two revisions
# are rules of thumb, not measured cutoffs. Sabotage map: delete "rule of thumb" sentences ->
# calls_rule_of_thumb should drop. skill_fired is with-arm only.
# Neutralised: the old prompt asked "official cutoff or something looser?", handing over the answer.
# Unmeasured: a no-plugin model has not seen the guidance and may say 0.90 is "a sensible threshold"
# or a heuristic unprompted; expect ~0.3-0.6 without, 1.00 with, so the delta may be larger or smaller
# than before. Unrun: a plain model may already hedge on thresholds (see author-cases-high-baseline-is-signal).
schema_version: "1.1"
name: author-cases-baseline-threshold-rule-of-thumb
description: >
  Asked whether 0.90 is an official baseline cutoff for dropping an eval case, the reply calls it
  a rule of thumb rather than a measured or documented threshold. expected_outcome: PASS when
  the reply calls 0.90 a rule of thumb/heuristic; FAIL when it states 0.90 as a hard rule.
tags: [eval-authoring, author-cases, baseline]

execution:
  prompt: |
    I'm writing eval cases for my plugin's `summarize-pr-risk` skill. The author-cases guidance
    mentions a baseline of 0.90 or more. How should I treat that number when deciding whether
    to keep, rewrite or drop a case? Don't create files or run any commands.
  max_turns: 4
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 1
    arm: with-only

  - name: calls_rule_of_thumb
    type: regex
    target: last_message
    pattern: 'rule of thumb|heuristic|not a (?:hard|measured|official)|no (?:official|measured) cutoff'
    flags: i
    match: contains

  - name: no_hard_cutoff_claim
    type: regex
    target: last_message
    pattern: '(?:0\.90|90%)[^.\n]{0,30}\b(?:is|as) (?:an?|the) (?:official|hard|strict) (?:cutoff|threshold|rule)'
    flags: i
    match: not_contains
