# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# No grant: Skill only; the prompt says do not run anything.
# Sibling confusion (diagnose-scores vs run-evals): "why did my score drop" is an explanation
# request; a re-run would be the wrong move.
# Can fail: diagnose_fired = 0 when the model answers without the skill; run_evals_not_fired = 0
# when run-evals takes it as a request to re-run.
# Unmeasured: a no-plugin model passes run_evals_not_fired trivially and cannot fire the skill,
# so this has no Delta; the signal is the with-arm fire rate over several runs.
schema_version: "1.1"
name: diagnose-scores-fires-on-score-drop
description: >
  "Why did my score drop" must invoke diagnose-scores and not run-evals. expected_outcome: PASS
  when diagnose-scores fires and run-evals does not; FAIL otherwise.
tags: [eval-authoring, diagnose-scores, run-evals, trigger, quick]

execution:
  prompt: |
    why did my eval score drop from 0.9 to 0.6 after I edited the skill? Answer in your reply; do
    not run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: diagnose_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose-scores"'
    min: 1
    arm: with-only

  - name: run_evals_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 0
    max: 0
    arm: both
