# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-outside-plugin-needs-trust-confirm plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Covers the SKILL.md paragraph "A plugin outside this repo's plugins/" (PR #1103): the wrapper never
# passes --trust-plugin there, and the skill says to confirm trust with the user and reuse the
# dry-run's --max-cost-usd instead of handing over a bare direct command.
# Unmeasured until run: the no-plugin arm may also warn that --trust-plugin runs code, so read its
# replies before trusting a delta. The prompt names neither "trust" nor the cost flag.
# good-reply: The wrapper only trusts plugins under this repo's plugins/, so it exits 1 there. The direct claude plugin eval command with --trust-plugin runs that plugin's code as you, so confirm you trust ~/code/other-plugin first, then add --max-cost-usd with the ceiling the dry-run showed.
# bad-reply: Run claude plugin eval ~/code/other-plugin --runs 3 and it will work.
schema_version: "1.1"
name: run-evals-outside-plugin-needs-trust-confirm
description: >
  Given a wrapper run that exited 1 on a plugin outside plugins/, the reply asks the user to
  confirm the plugin is trusted and keeps the cost ceiling, instead of just handing over the
  direct command.
  expected_outcome: PASS when it asks for trust confirmation before the direct command and names
  --max-cost-usd; FAIL when it gives the direct command with no trust check or no cost ceiling.
tags: [eval-authoring, run-evals]

execution:
  prompt: |
    I ran the run-evals wrapper on ~/code/other-plugin, which lives outside this repo, and it
    exited 1 with no results. Give me the command to run those cases anyway. Don't create files
    or run any commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 1
    arm: with-only

  # Result: the reply asks for trust confirmation. Needs "confirm"/"only if" wording near "trust",
  # not a bare "trust", which a plain flag mention would satisfy.
  - name: asks_trust_confirmation
    type: regex
    target: last_message
    pattern: '(?:confirm|only (?:if|after)|make sure|before)[^.\n]{0,80}trust|trust[^.\n]{0,80}(?:confirm|first)'
    flags: i
    match: contains

  # Result: the cost ceiling is kept, so the direct run is still bounded.
  - name: keeps_cost_ceiling
    type: regex
    target: last_message
    pattern: '--max-cost-usd'
    flags: i
    match: contains
