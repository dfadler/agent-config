# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case author-cases-delta-needs-twenty-cases plugins/eval-authoring
# No grant; reply-only. Covers the 20-case rule (#739), taught in author-cases step 9 and in
# run-evals "A PR line from pasted scores"; a PR-line prompt routes to run-evals (observed in
# traces), so skill_fired accepts either skill. No arm-score grader: any reply restating the
# prompt's scores would match it (EVAL024). A delta is claimed only for a plugin
# with about 20 or more cases, because runs shrink within-case noise but only cases shrink the
# standard error of a delta. A 3-case suite reports arm scores and "delta not measured".
# Can fail: states_delta_not_measured fails if the reply writes a delta figure as a result
# (or "delta +0.33" with a "not significant" footer) instead of declining it; states_case_count_reason fails if the reply gives the old
# "more runs" fix instead of the case count; skill_fired (with-arm only) fails if the
# description stops matching.
# Unmeasured: no_unqualified_delta_figure now also blocks 33%, 33 points and "improvement of 0.33";
# a no-plugin model usually writes a delta, so it should fail the guard in the without arm (expect
# ~0.3-0.5 overall without). A with-arm reply saying "a 0.33 delta is not claimed" would be a false fail.
schema_version: "1.1"
name: author-cases-delta-needs-twenty-cases
description: >
  Given a 3-case suite with 10 runs per arm and a user who wants a delta in the PR body, the
  reply declines to cite a delta and says a delta needs about 20 cases. expected_outcome:
  PASS when it writes delta not measured and names the case count; FAIL when it presents a
  delta as the result or says more runs would fix it. Whether the reply restates the arm scores
  is not graded (a grader for it would match the prompt itself, EVAL024).
tags: [eval-authoring, author-cases, quick]

execution:
  prompt: |
    My plugin deploy-helper has 3 eval cases. I ran them 10 times per arm: with the plugin
    they score 0.93, without it 0.60. Write the "Eval results" line for my PR description
    and include the delta so reviewers see the improvement. Don't create files or run any
    commands.
  max_turns: 8
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:author-cases|run-evals)"'
    min: 1
    arm: with-only

  # Declines the Δ: "delta not measured" or an equivalent refusal to cite one.
  - name: states_delta_not_measured
    type: regex
    target: last_message
    pattern: 'delta (?:is )?not (?:measured|claimed|reported)|(?:no|not|without) (?:a )?(?:reliable |measured )?delta|(?:can.?t|cannot|won.?t|shouldn.?t|not) (?:\w+ ){0,3}(?:cite|claim|report|state|give)[^.\n]{0,20}delta'
    flags: i
    match: contains

  # The reason only #739 teaches: case count, about 20.
  - name: states_case_count_reason
    type: regex
    target: last_message
    pattern: '\b(?:20|twenty)\b[^.\n]{0,40}\bcases?\b|\bcases?\b[^.\n]{0,40}\b(?:20|twenty)\b'
    flags: i
    match: contains

  - name: no_unqualified_delta_figure
    type: regex
    target: last_message
    pattern: '(?:Δ|delta|improv\w+|gain|lift|up|by)\s*(?:of\s*)?[:=]?\s*\+?(?:0?\.33|33\s*(?:%|percent|points?|pts|pp))|\+?(?:0?\.33|33\s*(?:%|points?|pts|pp))\s*(?:Δ|delta|improvement|gain|lift)'
    flags: i
    match: not_contains
