# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# No grant: Skill only; the prompt forbids running anything.
# Should-fire for "exit 1 or 2 with fine-looking results". Sibling risk: run-evals also covers
# exit codes, so the prompt could pull it instead; run-evals is deliberately not graded here.
# Can fail: skill_fired = 0 when run-evals or nothing fires instead; names_skill_artifact = 0 on
# generic advice.
# Unmeasured: a no-plugin model likely fails names_skill_artifact (no reason to name the result
# file or script). If the with-arm fire rate for diagnose-scores is low, that is a real
# description overlap to fix in the skills, not a grader to loosen.
schema_version: "1.1"
name: diagnose-scores-fires-on-exit-2-fine-results
description: >
  An eval run that exited 2 with fine-looking results must invoke diagnose-scores.
  expected_outcome: PASS when the skill fires and the reply names aggregate-result.json or
  diagnose.ts; FAIL otherwise.
tags: [eval-authoring, diagnose-scores, trigger, quick]

execution:
  prompt: |
    My eval run exited with code 2 but the scores in the report look fine. What went wrong?
    Answer in your reply; do not run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose-scores"'
    min: 1
    arm: with-only

  - name: names_skill_artifact
    type: regex
    target: last_message
    pattern: 'aggregate-result\.json|diagnose\.ts'
    flags: i
    match: contains
