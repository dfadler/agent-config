# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case run-evals-ci-entry-point plugins/eval-authoring
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only. Default two arms.
# Covers the run-evals "Run in your repo (CI)" section (#752). The facts are repo-specific
# (workflow file, secret name, trigger), so a no-plugin reply cannot know them: expected delta > 0.
# Sabotage map (delete the bullet, grader drops): Workflow bullet -> names_workflow and
# not_pull_request; Secret bullet -> names_secret. skill_fired is with-arm only.
# Unrun: needs a paid two-arm run before the delta is quoted.
schema_version: "1.1"
name: run-evals-ci-entry-point
description: >
  Asked how to run the plugin's evals in CI, the reply names the plugin-evals.yml workflow
  and the CLAUDE_CODE_OAUTH_TOKEN secret and does not suggest a pull_request trigger.
  expected_outcome: PASS when it names the workflow file and the secret; FAIL when it gives
  a generic Actions recipe.
tags: [eval-authoring, run-evals, ci]

execution:
  prompt: |
    How do I run this plugin's evals in CI instead of on my laptop? Which workflow and
    secret does it use? Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob
    - Grep

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 1
    arm: with-only

  - name: names_workflow
    type: regex
    target: last_message
    pattern: 'plugin-evals\.yml'
    match: contains

  - name: names_secret
    type: regex
    target: last_message
    pattern: 'CLAUDE_CODE_OAUTH_TOKEN'
    match: contains

  # Polarity: the workflow is manual + weekly; a reply that says to trigger it on PRs is wrong.
  - name: not_pull_request
    type: regex
    target: last_message
    pattern: '(?:run|trigger|add|use)[^.\n]{0,30}\bon\s+(?:every\s+)?(?:pull_request|PR)\b|on:\s*\n?\s*pull_request'
    flags: i
    match: not_contains
