# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# No grant: Skill, Read, Glob; the prompt says do not run anything (a run is paid).
# Sibling confusion (run-evals vs author-cases): the plainest "run my evals" must pick run-evals.
# Can fail: run_evals_fired = 0 when the model answers without the skill; author_cases_not_fired
# = 0 when the authoring skill takes it.
# Unmeasured: a no-plugin model passes author_cases_not_fired trivially (the skill does not
# exist there) and run_evals_fired is with-only, so this has no Delta; read the with-arm fire
# rates over several runs.
schema_version: "1.1"
name: run-evals-fires-natural-run-my-evals
description: >
  "Run my evals" must invoke run-evals and not author-cases. expected_outcome: PASS when run-evals
  fires and author-cases does not; FAIL otherwise.
tags: [eval-authoring, run-evals, author-cases, trigger, quick]

execution:
  prompt: |
    run my evals for plugins/release-notes. Say what you would do first; do not run anything.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: run_evals_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 1
    arm: with-only

  - name: author_cases_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 0
    max: 0
    arm: both
