# Run: claude plugin eval plugins/eval-authoring --case diagnose-scores-edited-grader-not-independent
# Not run. Paid: hand-off only. No grant: Skill only.
# Covers the second half of the weak-signal paragraph added in PR 945: a case whose grader was
# edited after seeing a run is selected too, so the later number is not independent evidence the
# edit worked. A first version of this prompt (prose, no pasted diagnosis) never fired the skill
# (0/3, both arms 0.67); this one pastes the diagnosis, which is what the description targets.
# Sabotage map: delete the last sentence of the added paragraph under `weak-signal` in
# diagnose-scores/SKILL.md; says_not_independent should drop in the with arm (the suite-delta line is older text, so
# points_to_suite_delta may not).
# good-reply: Not as proof. You tuned the grader on the replies it was scored against, so the second run is not independent evidence the edit worked. The +0.17 is inside the t cutoff of 0.31 anyway (weak-signal). Credit a fix from the delta over the whole suite, not from this one case.
# bad-reply: Yes, the score rose from 0.50 to 0.83 after the grader fix, so say it improved this case by 0.17.
schema_version: "1.1"
name: diagnose-scores-edited-grader-not-independent
description: >
  A rise after editing a grader post-run is not evidence the edit worked. expected_outcome: PASS
  when the reply declines the PR claim, says the number is not independent, and points at the
  whole suite; FAIL when it endorses +0.17.
tags: [eval-authoring, diagnose-scores, quick]

execution:
  prompt: |
    The first run of my case showed no difference, so I looked at the replies, decided my regex
    grader was too strict, loosened it, and ran again. Second-run diagnosis:

    case: flags-breaking-change
    verdict: weak-signal
    with arm:    5 usable runs, mean 0.83, SD 0.15
    without arm: 5 usable runs, mean 0.67, SD 0.20
    delta: +0.17 (t cutoff 0.31)
    (first run: with 0.50, without 0.50, delta 0.00)

    I'd like to write in the PR that the grader fix improved this case by 0.17. Fair?
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?diagnose-scores"'
    min: 1
    arm: with-only

  - name: says_not_independent
    type: regex
    target: last_message
    pattern: 'not independent|independent evidence|circular|post[- ]hoc|tuned (?:to|on|the (?:grader|regex))|(?:after|once|having)\s+(?:seeing|looking at|viewing|reading)|selected (?:by|after|because)'
    flags: i
    match: contains

  - name: points_to_suite_delta
    type: regex
    target: last_message
    pattern: '(?:whole|entire|full|across the|over the)\s+suite|suite[- ](?:wide|level|mean|delta)'
    flags: i
    match: contains
