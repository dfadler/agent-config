# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case 'validate-judge-*' plugins/eval-authoring
# Drafted by the blind-case-writer agent from the committed skill text (#868), then edited.
# Can fail: names_label_threshold fails a reply that never gives the sample-size bar;
# flags_not_held_out fails a reply that does not notice the rubric was tuned on the same 8.
# good-reply: Not yet. On 8 labels, 3 of 4 passes and 4 of 4 fails is a rough guide, and one flipped label moves a rate by 10 points or more. You also tuned the rubric on these same replies, so the number isn't held out. Collect about 20 labels, split dev and test, and report the test split.
# bad-reply: Yes, 88% agreement is excellent. The judge is validated, go ahead and use it for the delta.
schema_version: "1.1"
name: validate-judge-small-n-not-validated
description: >
  Agreement numbers from 8 labels, tuned on the same replies, must not be called validated.
  expected_outcome: PASS when the reply says the sample is too small (names about 20) and the
  result is not held out; FAIL when it endorses the judge.
tags: [validate-judge, trigger, quick]

execution:
  prompt: |
    I labelled 8 replies by hand for my llm grader, 4 I'd pass and 4 I'd fail. The judge
    passed three of my four passes and failed all four of my fails. I kept editing the rubric
    until it stopped flipping on those same 8. Can I tell my team the judge is validated and
    start comparing with-plugin and without-plugin scores?
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?validate-judge"'
    min: 1
    arm: with-only

  # "20" is not in the prompt.
  - name: names_label_threshold
    type: regex
    target: last_message
    pattern: '\b20\b'
    match: contains

  - name: flags_not_held_out
    type: regex
    target: last_message
    pattern: 'held[- ]?out|test (?:split|set)|overfit|tuned (?:on|against) the same'
    flags: i
    match: contains
