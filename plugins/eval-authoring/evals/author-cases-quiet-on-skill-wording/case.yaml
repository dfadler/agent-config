# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --trigger-boundary plugins/eval-authoring
# Trigger-boundary negative, paired with author-cases-fires-natural-trigger-check: read as a fire count over many distinct prompts
# (one run, plugin arm only, no delta), not as a score.
# Near-miss for author-cases (#745): shares the skill name but wants prose editing, not cases. Regression guard: a no-plugin arm passes it
# by design (no delta), hence the single-arm trigger-boundary run.
# Can fail: skill_not_fired fails if the description over-triggers on this vocabulary.
# good-reply: Tighter: Converts a changelog into release notes that name every breaking change.
# bad-reply: Here is a more concise version with the redundancy and filler removed.
schema_version: "1.1"
name: author-cases-quiet-on-skill-wording
description: >
  A request that shares vocabulary with author-cases but is not about `claude plugin eval` cases must
  not invoke it. expected_outcome: PASS when author-cases is not invoked and the reply addresses the
  request; FAIL when it is invoked.
tags: [eval-authoring, author-cases, trigger, trigger-boundary, pair:author-cases-fires-natural-trigger-check]

execution:
  prompt: |
    My `release-notes` skill's SKILL.md feels wordy. Tighten this opening paragraph: "This skill is used in order to be able to turn a git changelog into release notes for users."
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?author-cases"'
    min: 0
    max: 0

  - name: addresses_request
    type: regex
    target: last_message
    pattern: '(?<!able to )\b(?:turns?|converts?|transforms?|generates?|drafts?|produces?|writes?|rewrites?)\b[^.\n]{0,40}\bchangelogs?\b[^.\n]{0,30}\brelease notes\b|\brelease notes\b[^.\n]{0,40}\bchangelogs?\b'
    flags: i
    match: contains
