# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --trigger-boundary plugins/eval-authoring
# Trigger-boundary negative, paired with run-evals-fires-natural-go-ahead: read as a fire count over many distinct prompts
# (one run, plugin arm only, no delta), not as a score.
# Near-miss for run-evals (#745): shares "cost" but is pricing, not a run. Regression guard: a no-plugin arm passes it
# by design (no delta), hence the single-arm trigger-boundary run.
# Can fail: skill_not_fired fails if the description over-triggers on this vocabulary.
schema_version: "1.1"
name: run-evals-quiet-on-eval-cost-question
description: >
  A request that shares vocabulary with run-evals but is not about `claude plugin eval` cases must
  not invoke it. expected_outcome: PASS when run-evals is not invoked and the reply addresses the
  request; FAIL when it is invoked.
tags: [eval-authoring, run-evals, trigger, trigger-boundary, pair:run-evals-fires-natural-go-ahead]

execution:
  prompt: |
    Roughly what does Claude Code usage cost for a developer in a month?
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 0
    max: 0

  - name: addresses_request
    type: regex
    target: last_message
    pattern: '\$\s?\d|per (?:month|developer|user|seat)|/month|subscription|pay-as-you-go|rate limits?|depends|varies|average'
    flags: i
    match: contains
