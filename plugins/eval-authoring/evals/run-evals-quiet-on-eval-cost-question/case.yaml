# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# Near-miss for run-evals (#745): shares "cost" but is pricing, not a run. Regression guard: a no-plugin arm passes it
# by design (no delta), hence --ablation none via the quick tier.
# Can fail: skill_not_fired fails if the description over-triggers on this vocabulary.
# good-reply: Roughly $6 per developer per day on a typical workload; the breakdown is at code.claude.com/docs/en/costs.
# bad-reply: It depends on usage; costs vary a lot and rate limits apply, so the average is hard to state.
schema_version: "1.1"
name: run-evals-quiet-on-eval-cost-question
description: >
  A request that shares vocabulary with run-evals but is not about `claude plugin eval` cases must
  not invoke it. expected_outcome: PASS when run-evals is not invoked and the reply addresses the
  request; FAIL when it is invoked.
tags: [eval-authoring, run-evals, trigger, quick]

execution:
  prompt: |
    Roughly what does Claude Code usage cost for a developer in a month?
    Don't create files or run any commands.
  max_turns: 6
  allowed_tools:
    - Skill
    - Read
    - Glob

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?run-evals"'
    min: 0
    max: 0
    arm: both

  - name: addresses_request
    type: regex
    target: last_message
    pattern: '\$\s?\d[\d,]*(?:\.\d+)?[^.\n]{0,60}\b(?:per|a|each|/)\s*(?:developer|dev|user|month|day|seat)\b|\b(?:per|a|each)\s*(?:developer|dev|month|day)\b[^.\n]{0,40}\$\s?\d|\$\s?\d[\d,]*(?:\.\d+)?[^.\n]{0,20}\b(?:monthly|daily|weekly|/mo)\b|code\.claude\.com/docs/\S*cost'
    flags: i
    match: contains
    arm: both
