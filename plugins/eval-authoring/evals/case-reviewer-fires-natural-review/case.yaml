# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/eval-authoring
# (quick tier is plugin arm only. The no-plugin arm cannot dispatch a plugin agent, as noted in
# case-reviewer-flags-planted-weak-case; here the grader is arm: both so a standard run scores
# that arm 0 by construction, which keeps the case free of EVAL008.)
# No grant: Agent, Read, Glob only; the reviewer is not asked to run the lint or write anything.
# Natural-phrasing should-fire case: neither "case-reviewer" nor "agent" is in the prompt. The
# dispatch check matches the "subagent_type" field, not the bare word, so an echo of the prompt
# or a mention in the reply cannot pass it.
# Can fail: reviewer_dispatched = 0 when the main model reviews the files itself, or answers
# without a dispatch (only the author-cases skill firing is not graded).
# Unmeasured: the no-plugin arm cannot pass (the agent type does not exist there), so Delta is by
# construction; the open question is the with-arm fire rate, which needs several runs.
schema_version: "1.1"
name: case-reviewer-fires-natural-review
description: >
  A natural request to review eval cases before running them must dispatch
  eval-authoring:case-reviewer. expected_outcome: PASS when the agent is dispatched; FAIL when the
  model reviews the cases itself or answers without dispatching.
tags: [eval-authoring, case-reviewer, agent, trigger, quick]

execution:
  prompt: |
    I just wrote the eval cases for my release-notes plugin, they are under
    plugins/release-notes/evals/. Can you review them before I run them?
  max_turns: 8
  allowed_tools:
    - Agent
    - Read
    - Glob
    - Skill

graders:
  - name: reviewer_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?case-reviewer"'
    min: 1
    arm: both
