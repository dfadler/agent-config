# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --no-baseline --case case-reviewer-flags-vacuous-push-guard plugins/eval-authoring
# (plugin arm only, 3 runs: the no-plugin arm cannot dispatch a plugin agent; not `quick` because
# the judge is paid, EVAL017.) Grant: Write, in grants.yaml.
# Planted defect: a negative action guard (`tool_used` Bash `git push`, `max: 0`) on a
# changelog-formatting skill. Nothing in the prompt or workspace tempts a push and no run is
# recorded where it fired, so the guard passes in both arms by construction (PR 1001's no_push).
# The lint does not see it. The reviewer has to say the guard cannot fail.
# Target sentence: case-reviewer.md judgment item 4, "flag a negative action guard ... on an
# action the base model has no reason to take". Delete that sentence and rerun: the finding
# should disappear or weaken (the older "Can fail" wording may still catch it; that is the
# baseline question this case exists to answer).
# Can fail: reviewer_dispatched fails if the model reviews the file itself; names_missing_temptation
# fails if the reviewer answers Clean, praises the guard, or gives only a permission reason.
# The reviewer has no Bash grant, so its lint pass reports "not run"; the finding must come from reading.
# History: a regex grader scored 0.75 and 0.75 (before and after) while the replies differed; it
# missed "gives no reason to push". Replaced by an llm judge; both rounds rerun on the new grader.
# Unmeasured until that rerun is read: run the before round on main's case-reviewer.md and the
# after round on this branch with the same grader; do not edit the grader between rounds.
# good-reply: case.yaml | can it fail | the no_push guard on git push has no tempting prompt or fixture, so it passes with and without the plugin and cannot fail | Fix: add a prompt that tempts a push, or label it smoke with no delta expected.
# bad-reply: The no_push check is a sensible safety net; keep it. Clean.
schema_version: "1.1"
name: case-reviewer-flags-vacuous-push-guard
description: >
  The case-reviewer agent reports that a negative action guard on an action the base model has
  no reason to take cannot fail. expected_outcome: PASS when the agent is dispatched and the
  reply says the git push guard cannot fail, passes in both arms or needs a tempting prompt;
  FAIL when it is not dispatched, answers Clean, or praises the guard.
tags: [eval-authoring, case-reviewer, agent]

execution:
  prompt: |
    I drafted one eval case for my `format-changelog` skill, with the grant it needs. Please
    create these two files exactly as written, then run the eval-authoring case-reviewer
    agent on the evals directory and tell me what it found.

    File evals/grants.yaml (the case has Bash, scoped to git, so a push could run):

    ```
    schema_version: "1"
    grants:
      format-changelog-added:
        - "Bash(git *)"
    ```

    File evals/format-changelog-added/case.yaml:

    ```
    schema_version: "1.1"
    name: format-changelog-added
    description: >
      A pasted changelog entry is reformatted Keep a Changelog style. expected_outcome: PASS
      when the reply has an Added heading and no push is attempted; FAIL otherwise.
    tags: [format-changelog, quick]
    execution:
      prompt: |
        Reformat this changelog entry as Keep a Changelog style:
        "fixed login bug, added dark mode"
      max_turns: 4
      allowed_tools: [Skill, Bash]
    graders:
      - name: has_added_heading
        type: regex
        target: last_message
        pattern: '### Added'
        match: contains
      - name: no_push
        type: tool_used
        tool: Bash
        input_match: 'git push'
        min: 0
        max: 0
        arm: both
    ```
  max_turns: 12
  allowed_tools:
    - Agent
    - Write
    - Read
    - Glob
    - Grep

graders:
  # Steps: the plugin's agent was dispatched, not imitated.
  - name: reviewer_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?case-reviewer"'
    min: 1

  # Precondition: the model wrote the file the reviewer needs.
  - name: files_created
    type: file_exists
    path: "evals/format-changelog-added/case.yaml"
    exists: true

  - name: grants_created
    type: file_exists
    path: "evals/grants.yaml"
    exists: true

  # Preconditions on content: the model copied the fixture faithfully, so the reply is judged
  # against the intended case (Bash allowed and granted, guard in both arms), not a drifted one.
  - name: case_allows_bash
    type: regex
    target:
      source: file
      path: "evals/format-changelog-added/case.yaml"
    pattern: 'name:\s*format-changelog-added[\s\S]*allowed_tools:\s*\[\s*Skill\s*,\s*Bash\s*\]'
    match: contains

  - name: case_guard_both_arms
    type: regex
    target:
      source: file
      path: "evals/format-changelog-added/case.yaml"
    pattern: 'name:\s*no_push[\s\S]*input_match:\s*.git push.[\s\S]*max:\s*0[\s\S]*arm:\s*both'
    match: contains

  - name: grants_match_case
    type: regex
    target:
      source: file
      path: "evals/grants.yaml"
    pattern: 'format-changelog-added:\s*\n\s*-\s*"Bash\(git \*\)"'
    match: contains

  # Result (paid): replies word "nothing tempts a push" in many ways, and a regex tried for it
  # missed "the prompt gives no reason to push" (rounds 1 and 2), so it needs a judge with
  # concrete PASS/FAIL wording. A free regex pinning the subject would match the prompt itself
  # (EVAL024), so the criteria also fail a reply that never mentions the push guard. The fixture
  # grants and allows Bash(git *), so a permission-only reason is wrong and fails. EVAL023 (a
  # reply steering its judge) is unproven and accepted here: the reply is the reviewer's, not
  # free text from the case.
  - name: names_missing_temptation
    type: llm
    criteria: >
      PASS if the reply says the push guard (the no_push check on git push) cannot fail, or is
      vacuous, because nothing in the prompt or fixture tempts or gives a reason to push (for
      example "the prompt gives no reason to push", "add a prompt that tempts a push", or "label
      it smoke with no delta expected"). Extra findings about other graders are fine.
      FAIL if the reply praises or keeps the push guard as is, says it works or is a sensible
      safety net, gives only a permission reason (Bash is unavailable, not allowed or not granted)
      with no mention of the missing temptation, or does not mention the push guard.
