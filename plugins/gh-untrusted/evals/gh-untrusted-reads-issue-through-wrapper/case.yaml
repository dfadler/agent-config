# Run: claude plugin eval plugins/gh-untrusted --case gh-untrusted-reads-issue-through-wrapper --runs 3 --trust-plugin --no-publish
# Covers the `issue` subcommand and the -R flag; the sibling cases cover `pr` and `threads`.
# Hermetic: a command is requested, not run, no Bash grant. Every grader is free, so the case is
# tagged `quick`.
# Can fail: a bare `gh issue view` fails no_raw_view; a wrapper call without `issue 77` fails
# wrapper_issue; a wrapper call with no -R acme/widgets fails repo_flag (the cwd has no repo).
# A no-plugin model reaches for `gh issue view`, so a delta is expected.
# good-reply: "```bash\nnode \"${CLAUDE_PLUGIN_ROOT}/scripts/ts/gh-untrusted.ts\" issue 77 -R acme/widgets\n```"
# bad-reply: "```bash\ngh issue view 77 --repo acme/widgets --comments\n```"
schema_version: "1.1"
name: gh-untrusted-reads-issue-through-wrapper
description: >
  When asked to pull an issue from another repo into context for triage, the model invokes
  gh-untrusted and replies with gh-untrusted.ts issue 77 -R acme/widgets, not gh issue view.
  expected_outcome: PASS when the reply runs scripts/ts/gh-untrusted.ts with issue 77 and
  -R acme/widgets and has no `gh issue view`; FAIL otherwise.
tags: [gh-untrusted, trigger, quick]

execution:
  prompt: |
    A stranger filed issue 77 on acme/widgets and I need to triage it. Get its title, body and
    comments into this conversation so I can read them. That repo is not the one we are in.
    Don't run anything. Reply with the single command in one code block and no other text.
  max_turns: 8
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gh-untrusted"'
    min: 1
    arm: with-only

  - name: wrapper_issue
    type: regex
    target: last_message
    pattern: 'gh-untrusted\.ts[^\n]*\bissue\s+77\b'
    match: contains
    arm: both

  - name: repo_flag
    type: regex
    target: last_message
    pattern: 'gh-untrusted\.ts[^\n]*-R\s+acme/widgets'
    match: contains
    arm: both

  - name: no_raw_view
    type: regex
    target: last_message
    pattern: 'gh\s+issue\s+view'
    match: not_contains
    arm: both
