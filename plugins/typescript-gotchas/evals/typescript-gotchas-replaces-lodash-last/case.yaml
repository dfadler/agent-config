# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/typescript-gotchas
# Should-fire half, edit form: existing source uses every pattern in the skill's "Patterns to
# avoid" table and the user asks for a lodash-free rewrite. Tests the replacement table, not
# just the headline rule. Every grader is free, so the case is tagged `quick`.
# Sabotage map: uses_at_three_times and no_old_idioms check the table rows for `_.last(arr)`,
# `arr.slice(-1)[0]` and `str.charAt(str.length - 5)`; remove them and a run keeps the old forms.
# Can fail: a reply that keeps `slice(-1)[0]`, `charAt(`, or `_.last`/lodash, or that swaps
# in `[x.length - 1]`, fails no_old_idioms; fewer than three `.at(-1)` calls fails
# uses_at_three_times. Models often modernize this unprompted, so the delta may be small.
schema_version: "1.1"
name: typescript-gotchas-replaces-lodash-last
description: >
  When asked to drop lodash from a TypeScript module that reads last elements in
  three older ways, the model invokes typescript-gotchas and rewrites all three
  reads with `.at(-1)`. expected_outcome: PASS when the rewrite holds at least
  three `.at(-1)` calls and none of lodash, `slice(-1)[0]`, `charAt(` or a
  length-minus-one bracket read; FAIL otherwise.
tags: [typescript-gotchas, trigger, quick]

execution:
  prompt: |
    I'm removing lodash from src/paths.ts. Rewrite the file without it and
    show the complete result in your reply.

    ```ts
    import _ from "lodash";

    export const newest = (items: string[]): string | undefined => _.last(items);

    export const lastSegment = (path: string): string | undefined =>
      path.split("/").slice(-1)[0];

    export const lastChar = (s: string): string => s.charAt(s.length - 1);
    ```
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Steps. Indicator in a two-arm run, scored only with the plugin.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?typescript-gotchas"'
    min: 1
    arm: with-only

  # Result.
  - name: uses_at_three_times
    type: regex
    target: last_message
    pattern: '(\.at\(\s*-1\s*\)[\s\S]*){3}'
    match: contains
    arm: both

  - name: no_old_idioms
    type: regex
    target: last_message
    pattern: 'from\s+["'']lodash|\b_\.last|slice\(\s*-1\s*\)\s*\[\s*0\s*\]|charAt\(|\[\s*[\w.]+\.length\s*-\s*1\s*\]'
    match: not_contains
    arm: both
