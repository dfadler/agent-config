# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/typescript-gotchas
# Boundary case inside the skill's own scope: non-test TypeScript that reads the last string of
# an array (the skill's rule: `.at(-1)`) and the last element of a DOM collection in the same
# reply. The skill lists DOM collections under "What is NOT flagged" because `.children`
# lacks `.at()`; it must not push the model into `children.at(-1)` while it rewrites the
# array read next to it.
# Rewritten for #772. The old prompt had only the DOM read and said "use `list.children`", so
# nothing in it exercised the rule and a bare model never wrote `.at()`: the case passed in both
# arms. The 2026-10-05 sabotage result (PR #531: with the DOM exception removed the case still
# passed 3 of 3) is for that old prompt and is superseded; the case is unmeasured since this
# rewrite. The prompt still names `list.children` on purpose: a reply that reaches for
# `lastElementChild` never touches the exception, and the leak the old prompt had was the
# missing rule half, not the DOM nudge.
# Sabotage map: no_at_on_dom_collection checks the "DOM collections" exception (delete that
# bullet and expect `children.at(-1)` in some with-arm runs; if it still passes 3 of 3, drop
# the case). names_read_with_at separates the arms (the no-plugin default is
# `names[names.length - 1]`) but does not test the rule's text: typescript-gotchas-reads-index-with-at
# records (PR #531) that the model writes `.at(-1)` for a last-element read once any skill
# fires, even with the body emptied. So a with/without delta here comes from the skill firing,
# not from the read rule, and the case can only prove the exception is kept next to the rule,
# not the rule itself (that is reads-index-with-at's job). The read stays `.at(-1)` because the
# exception is about the last child; a variable index would not exercise it.
# Can fail: `names[names.length - 1]` fails names_read_with_at; `list.children.at(-1)` (a type
# error, since HTMLCollection has no `.at`) or an alias of it (`const k = list.children;
# k.at(-1)`) fails no_at_on_dom_collection; a reply that never assigns `textContent` fails
# sets_text. `Array.from(list.children).at(-1)` is a real array and passes.
# good-reply: export function labelLast(names: string[], list: HTMLUListElement): void { list.children[list.children.length - 1].textContent = names.at(-1)!; }
# bad-reply: export function labelLast(names: string[], list: HTMLUListElement): void { list.children.at(-1)!.textContent = names[names.length - 1]; }
#   export function labelLast(names: string[], list: HTMLUListElement): void { const k = list.children; k.at(-1)!.textContent = names.at(-1)!; }
schema_version: "1.1"
name: typescript-gotchas-keeps-dom-brackets
description: >
  When asked for a TypeScript helper that writes the last string of an array into the last
  child of a DOM list, the model reads the array with `.at(-1)` but never calls `.at()` on
  `children`, which has no such method. expected_outcome: PASS when the reply reads
  `names.at(-1)`, assigns `textContent`, and never calls `.at(` on `children` or
  `childNodes`; FAIL otherwise.
tags: [typescript-gotchas, boundary, quick]

execution:
  prompt: |
    In src/ui/list.ts of my TypeScript project, write
    `labelLast(names: string[], list: HTMLUListElement): void`, which sets the
    textContent of the last element of `list.children` to the last string in
    `names` (neither is ever empty). Reply with the complete file in one code
    block and no other text.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Steps. Unscored with-arm indicator in a two-arm run; names_read_with_at depends on it firing.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?typescript-gotchas"'
    min: 1
    arm: with-only

  # Result: the array read uses `.at(-1)` (the skill's rule; no-plugin default is a bracket read).
  - name: names_read_with_at
    type: regex
    target: last_message
    pattern: '\bnames\.at\(\s*-1\s*\)'
    match: contains
    arm: both

  # Result: no `.at()` on a DOM collection (the skill's exception), directly or through an alias
  # assigned a bare `.children`/`.childNodes` member chain (`const k = list.children; k.at(-1)`).
  # `Array.from(list.children).at(-1)` and `[...list.children].at(-1)` are real arrays and pass.
  - name: no_at_on_dom_collection
    type: regex
    target: last_message
    pattern: '\b(?:children|childNodes)\.at\(|querySelectorAll\([^)]*\)\.at\(|\b(\w+)\s*=\s*[\w.]+\.(?:children|childNodes)\b[\s\S]*?\b\1\.at\('
    match: not_contains
    arm: both

  # Result: the text is written.
  - name: sets_text
    type: regex
    target: last_message
    pattern: 'textContent\s*=(?!=)'
    match: contains
    arm: both
