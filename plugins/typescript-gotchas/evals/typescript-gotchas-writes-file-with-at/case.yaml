# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/typescript-gotchas
# (grant "Write" is read from evals/grants.yaml; equivalent: claude plugin eval plugins/typescript-gotchas --case typescript-gotchas-writes-file-with-at --allow-tools "Write")
# Should-fire half of the trigger boundary, through a written file rather than a reply: the
# skill triggers on "writing or editing" source files, so this checks the file contents.
# Every grader is free, so the case is tagged `quick`.
# Sabotage map: file_uses_at and file_no_bracket_idiom check the "Prefer `.at()` for array and
# string indexed reads" rule and the `str.charAt(str.length - 5)` row of its table.
# Can fail: a file with `s[s.length - 1]` or `s.charAt(s.length - 1)` fails file_no_bracket_idiom
# and file_uses_at; no file at all fails file_written and the regexes; skill_fired fails if the
# skill never triggers on a file write. Any Write path other than src/trailing.ts also fails.
schema_version: "1.1"
name: typescript-gotchas-writes-file-with-at
description: >
  When asked to create a TypeScript source file that reads the last character of
  a string, the model invokes typescript-gotchas and writes src/trailing.ts using
  `.at(-1)`. expected_outcome: PASS when the file exists and uses `.at(-1)` with
  no `s[s.length - 1]` or `charAt(... length - 1)`; FAIL otherwise.
tags: [typescript-gotchas, trigger, quick]

execution:
  prompt: |
    Create src/trailing.ts in this empty project. It should export
    `trailingChar(s: string): string | undefined`, which returns the final
    character of the string, or undefined for an empty string. Just write the
    file.
  max_turns: 8
  allowed_tools:
    - Skill
    - Write

graders:
  # Steps. Indicator in a two-arm run, scored only with the plugin.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?typescript-gotchas"'
    min: 1
    arm: with-only

  - name: wrote_the_file
    type: tool_used
    tool: Write
    input_match: 'src/trailing\.ts'
    min: 1
    arm: both

  # Result.
  - name: file_written
    type: file_exists
    path: src/trailing.ts
    arm: both

  - name: file_uses_at
    type: regex
    target: { source: file, path: src/trailing.ts }
    pattern: '\.at\(\s*-1\s*\)'
    match: contains
    arm: both

  - name: file_no_bracket_idiom
    type: regex
    target: { source: file, path: src/trailing.ts }
    pattern: '\[\s*[\w.]+\.length\s*-\s*1\s*\]|charAt\('
    match: not_contains
    arm: both
