# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/typescript-gotchas
# Should-fire half of the trigger boundary: new non-test TypeScript that needs the final
# array element. The should-not-fire halves are typescript-gotchas-stays-quiet-on-test-file
# and typescript-gotchas-keeps-dom-brackets. Every grader is free, so the case is tagged `quick`.
# Sabotage map: uses_at checks the skill's "Prefer `.at()` for array and string indexed reads";
# no_bracket_length_idiom checks its "Patterns to avoid" table (`arr[arr.length - 1]`,
# `arr.slice(-1)[0]`, lodash `last`). Breaking those lines should fail both.
# Can fail: a reply that writes `urls[urls.length - 1]` fails both result checks;
# skill_fired fails if the description stops matching the prompt. Models often write `.at(-1)`
# unprompted, so the delta may be small; the case still guards against the skill pushing the
# wrong form.
schema_version: "1.1"
name: typescript-gotchas-last-element-uses-at
description: >
  When asked to write a new TypeScript helper that returns the last element of an
  array, the model invokes typescript-gotchas and reads the element with
  `.at(-1)` instead of `urls[urls.length - 1]`. expected_outcome: PASS when the
  skill is invoked and the code uses `.at(-1)` with no length-minus-one bracket
  read, `slice(-1)[0]` or lodash `last`; FAIL otherwise.
tags: [typescript-gotchas, trigger, quick]

execution:
  prompt: |
    I'm adding a helper to src/utils/history.ts in my TypeScript project. Write
    `lastVisited(urls: string[]): string | undefined`, which returns the most
    recently visited URL (the final entry in the list). Show the complete file
    in your reply.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Steps. Indicator in a two-arm run, scored only with the plugin.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?typescript-gotchas"'
    min: 1
    arm: with-only

  # Result.
  - name: uses_at
    type: regex
    target: last_message
    pattern: '\.at\(\s*-1\s*\)'
    match: contains
    arm: both

  - name: no_bracket_length_idiom
    type: regex
    target: last_message
    pattern: '\[\s*[\w.]+\.length\s*-\s*1\s*\]|slice\(\s*-1\s*\)\s*\[\s*0\s*\]|\blast\('
    match: not_contains
    arm: both
