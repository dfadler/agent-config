# Run: claude plugin eval plugins/gh-attach-image --case gh-attach-image-stays-quiet-on-pr-create --runs 3 --trust-plugin --no-publish
# Should-not-fire half: shares the skill's vocabulary (a GitHub PR description, `gh`, a body
# file) but has no image or video. Hermetic: a command is requested, not run, no Bash grant.
# Every grader is free, so the case is tagged `quick`.
# Sabotage map: skill_not_invoked checks the description's scope ("Upload local image or video
# files ... so they render inline in a GitHub PR description"); change it to "anything about a
# PR description" and a run should invoke the skill and fail.
# Can fail: the skill is invoked fails skill_not_invoked; a reply with upload.sh fails
# no_upload_script; a reply without `gh pr create` fails uses_pr_create. A regression guard:
# a no-plugin arm passes it by default, so expect no delta.
schema_version: "1.1"
name: gh-attach-image-stays-quiet-on-pr-create
description: >
  A request to open a PR with its description from a text file must not invoke gh-attach-image,
  which is only about images and video. expected_outcome: PASS when the skill is not invoked
  and the reply is a `gh pr create` using a body file with no upload.sh; FAIL otherwise. A
  regression guard with no expected delta.
tags: [gh-attach-image, trigger, quick]

execution:
  prompt: |
    Open a PR on acme/widgets titled "Fix retry backoff" from the current branch, using the text
    in body.md as the description. Don't run anything. Reply with the single command in one code
    block and no other text.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Steps. min 0 is explicit: tool_used defaults min to 1. arm both so the "never called"
  # check is scored in a two-arm run too.
  - name: skill_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gh-attach-image"'
    min: 0
    max: 0
    arm: both

  # Result: task-completion checks, not skill properties.
  - name: uses_pr_create
    type: regex
    target: last_message
    pattern: 'gh\s+pr\s+create[\s\S]*(?:--body-file|\s-F\s)'
    match: contains
    arm: both

  - name: no_upload_script
    type: regex
    target: last_message
    pattern: 'upload\.sh'
    match: not_contains
    arm: both
