# Run: claude plugin eval plugins/vitest --case test-conventions-sabotage-check --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; nothing runs.
# Should-fire half of the test-conventions boundary. The skill's procedure is break the
# code, expect the test to fail, revert; a no-plugin answer often recommends a mutation-testing
# tool (Stryker, mutmut) instead, which the skill says is unnecessary.
# Can fail: skill_fired if the description stops matching "will this test catch a regression";
# reverts if no revert step is given; no_tool if the reply sends the user to a mutation tool.
schema_version: "1.1"
name: test-conventions-sabotage-check
description: >
  Asked how to confirm a new test would catch a regression, the model invokes
  test-conventions and describes breaking the code, expecting a failure and reverting.
  expected_outcome: PASS when the skill fires, a revert step is present and no mutation tool is
  recommended; FAIL otherwise.
tags: [vitest, test-conventions]

execution:
  prompt: |
    I just wrote a Vitest test for my `slugify(text)` function and it passes. I do not trust that
    it would actually catch a regression. How do I confirm that, without installing anything new?
    Reply with a short numbered list. Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-conventions"'
    min: 1
    arm: with-only

  - name: reverts
    type: regex
    target: last_message
    pattern: 'revert|restore|undo|put (?:it|the code) back'
    flags: i
    match: contains

  - name: no_tool
    type: regex
    target: last_message
    pattern: 'stryker|mutmut|pitest|mutation[- ]testing (?:tool|framework)'
    flags: i
    match: not_contains
