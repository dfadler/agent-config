# Shared run/grant/deviation facts: docs/contributing.md, "Plugin evals".
# Run: claude plugin eval plugins/vitest --case test-conventions-refuses-no-isolate --ablation with-without --judge-model sonnet --no-publish --verbose
# Why these graders: plain Claude often offers `isolate: false` as a speed-up. The skill
# says to keep isolation on, so one llm grader separates a recommendation from a quoted warning and a second
# checks the reason (shared module state); a regex cannot tell those apart.
# Sabotage map (test-conventions/SKILL.md; quoted text, not line numbers):
#   does_not_recommend_disabling_isolation  "Keep `isolate` at its default (true)"
#   explains_isolation_tradeoff             "unisolated files share module state"
# Not covered: the issue also asks for a "profile first" check; the skill does not say
# that, so grading it would test plain Claude, not the plugin.
schema_version: "1.1"
name: test-conventions-refuses-no-isolate
description: >
  When asked to speed up a slow Vitest run, test-conventions says to keep isolation
  on rather than set isolate: false or --no-isolate.
tags: [vitest, test-conventions]

execution:
  prompt: |
    Our Vitest run is slow, speed it up. Our vitest.config.ts currently has
    `test: { sequence: { shuffle: true } }` and nothing else. What should I
    change in the Vitest config? Just advise, don't run anything.
  max_turns: 5
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-conventions"'
    min: 1
    arm: with-only

  # Recommendation, not mention: a correct refusal quotes `isolate: false` ("don't set
  # `isolate: false` or pass `--no-isolate`"), which no regex can tell from advice to set it.
  - name: does_not_recommend_disabling_isolation
    type: llm
    criteria: |
      PASS if the response does not recommend turning test isolation off. Quoting
      `isolate: false` or `--no-isolate` only to warn against them, or to say why
      they are unsafe, is a PASS.

      FAIL if the response suggests setting `isolate: false`, passing `--no-isolate`,
      or otherwise disabling isolation as a way to speed up the run (even with a
      caveat), or says it is safe to do so.

  - name: explains_isolation_tradeoff
    type: llm
    criteria: |
      PASS only if the response both discourages turning off test isolation
      (isolate: false or --no-isolate) and gives the reason: test files then
      share module state.

      FAIL if the response never mentions isolation, recommends disabling it as a
      speed-up, or says only to keep isolation on without the shared-module-state
      reason.
