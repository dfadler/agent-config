schema_version: "1.1"
name: test-conventions-ignores-unrelated-ts
description: >
  An ordinary TypeScript question with no tests involved should not trigger
  test-conventions or flaky-tests.
tags: [vitest, negative]

execution:
  prompt: |
    In TypeScript, what is the difference between `Array.prototype.map` and
    `Array.prototype.flatMap`? Give one short example of each.
  max_turns: 3
  allowed_tools:
    - Skill

graders:
  - name: vitest_skills_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(test-conventions|flaky-tests)"'
    min: 0
    max: 0
    arm: both

  - name: answers_directly
    type: llm
    criteria: |
      PASS only if the response explains that flatMap maps and then flattens
      one level, with a short example of each method, and does not mention
      Vitest, tests, or flaky behavior.
      FAIL if the example for either method is missing or the response drifts
      into testing advice.
