# Needs no Bash grant (Skill tool only). Run this case with:
#   claude plugin eval plugins/vitest --case test-conventions-ignores-unrelated-ts
# Graders are free regexes over the final message (required term present,
# testing terms absent), so no judge is needed. This deviates from #411's
# "one tool_used + one llm" rule to avoid judge cost and variance where a
# pattern is sufficient.
schema_version: "1.1"
name: test-conventions-ignores-unrelated-ts
description: >
  An ordinary TypeScript question with no tests involved should not trigger
  test-conventions or flaky-tests.
tags: [vitest, negative]

execution:
  prompt: |
    In TypeScript, what is the difference between `Array.prototype.map` and
    `Array.prototype.flatMap`? Give one short example of each.
  max_turns: 3
  allowed_tools:
    - Skill

graders:
  - name: vitest_skills_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(test-conventions|flaky-tests)"'
    min: 0
    max: 0
    arm: both

  - name: answers_about_flatmap
    type: regex
    target: last_message
    pattern: "flatMap"
    match: contains

  - name: no_testing_drift
    type: regex
    target: last_message
    pattern: "vitest|flaky"
    flags: i
    match: not_contains
