# Shared run/grant/deviation facts: docs/contributing.md, "Plugin evals".
# Run: claude plugin eval plugins/vitest --case flaky-tests-v4-max-workers --ablation with-without --judge-model sonnet --no-publish --verbose --keep-temp -j 2
# Why these graders: a v3-flavoured prompt invites `poolOptions`, which Vitest 4 removed.
# The skill says to use --maxWorkers, so a regex requires an explicit 2-worker form and an llm grader requires the
# recommendation to set exactly 2 workers without poolOptions (a regex cannot tell the recommended config from a
# warning, a quote, or a non-recommended example).
# Trigger-only: plain Claude also uses maxWorkers once told the version is 4.0 (Delta 0
# on 2026-10-07), so this guards the skill firing, not the skill's content. Without
# the version in the prompt both arms recommend poolOptions (a fair reading of a v3 config).
# The issue's seed-plus-shuffle case is not added: flaky-tests-repro-ladder already
# checks --sequence.shuffle.tests and seed_needs_shuffle.
# Sabotage map (flaky-tests/SKILL.md; quoted text, not line numbers):
#   uses_max_workers      "`--maxWorkers=2` or `VITEST_MAX_WORKERS=2`" (regex accepts only explicit 2-worker forms)
#   no_pool_options       "In Vitest 4+, `poolOptions` was removed"
schema_version: "1.1"
name: flaky-tests-v4-max-workers
description: >
  flaky-tests should fire when asked to limit Vitest to 2 workers while chasing a
  flake, and use --maxWorkers rather than the removed poolOptions.
tags: [vitest, flaky-tests]

execution:
  prompt: |
    One Vitest test only fails on our 2-core CI runner. We're on Vitest 4.0, and
    our vitest.config.ts (carried over from an older setup) has
    `test: { pool: 'threads', poolOptions: { threads: { maxThreads: 4 } } }`.
    I want to reproduce the failure locally with 2 workers. Show the exact change
    or command. Just advise, don't run anything.
  max_turns: 5
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flaky-tests"'
    min: 1
    arm: with-only

  - name: uses_max_workers
    type: regex
    target: last_message
    pattern: "--maxWorkers[= ]2\\b|VITEST_MAX_WORKERS=2\\b|maxWorkers\\s*:\\s*['\"]?2\\b"
    match: contains

  - name: no_pool_options
    type: llm
    criteria: |
      PASS only if the command or config the response RECOMMENDS sets exactly 2
      workers through a form Vitest 4 supports (`--maxWorkers=2` or
      `--maxWorkers 2`, `VITEST_MAX_WORKERS=2`, or `maxWorkers: 2` in the config)
      and does not rely on `poolOptions`. Count a form only when it is part of
      the recommendation: a warning, a quote of the old config, or a
      non-recommended example does not count. Saying that `poolOptions` was
      removed, or showing it only as the old form to replace, is not a failure.

      FAIL if the recommended change sets a number other than 2, never sets the
      worker count, or keeps or adds `poolOptions` (such as
      `poolOptions.threads.maxThreads: 2`) as the way to set 2 workers.
