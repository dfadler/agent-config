# Needs no Bash grant (Skill tool only). Run this case with:
#   claude plugin eval plugins/vitest --case test-conventions-isolated-tests --ablation with-without
# Graders check rules specific to the test-conventions skill that plain Claude does
# not reliably apply (ephemeral port 0, vi.unstubAllEnvs / config unstubEnvs for env
# vars, no direct process.env assignment, no hard-coded port), as free regexes; no
# judge needed. Deviates from #411's "one tool_used + one llm" rule for that reason.
# Sabotage map (test-conventions/SKILL.md lines): uses_ephemeral_port 24-25,
# no_hardcoded_port 24-25, unstubs_env 19-20, no_direct_env_assignment 20-21.
schema_version: "1.1"
name: test-conventions-isolated-tests
description: >
  test-conventions should fire when asked to write Vitest tests for code that reads
  environment variables and listens on a port, and the tests should be safe under
  shuffled, parallel execution.
tags: [vitest, test-conventions]

execution:
  prompt: |
    Write Vitest tests for this module and show me the full test file. Our CI
    runs the suite in random order across several parallel workers, and we have
    been burned by tests interfering with each other.

        import { createServer, type Server } from "node:http";

        export function startGreeter(port = 3000): Promise<Server> {
          const prefix = process.env.GREETING_PREFIX ?? "Hello";
          const server = createServer((_req, res) => {
            res.end(`${prefix}, world`);
          });
          return new Promise((resolve) => server.listen(port, () => resolve(server)));
        }

    Cover the default prefix, a custom GREETING_PREFIX, and that a request to the
    server returns the greeting.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-conventions"'
    min: 1
    arm: with-only

  - name: uses_ephemeral_port
    type: regex
    target: last_message
    pattern: "startGreeter\\(\\s*0\\s*\\)|listen\\(\\s*0\\b"
    match: contains

  - name: no_hardcoded_port
    type: regex
    target: last_message
    pattern: "startGreeter\\(\\s*[1-9]\\d{3,4}\\s*\\)|:3000"
    match: not_contains

  - name: unstubs_env
    type: regex
    target: last_message
    pattern: "unstubAllEnvs|unstubEnvs"
    match: contains

  - name: no_direct_env_assignment
    type: regex
    target: last_message
    pattern: "process\\.env\\.\\w+\\s*=[^=]|delete process\\.env"
    match: not_contains
