# Needs no Bash grant (Skill tool only). Run this case with:
#   claude plugin eval plugins/vitest --case test-conventions-isolated-tests
# The required API names are literal strings, so they are free regex graders.
# One short llm grader remains only for the absence conditions (no real sleep,
# no shared fixed path), which a regex cannot judge. This deviates from #411's
# "one tool_used + one llm" rule: cheap regexes plus one narrow judge are more
# stable than one judge checking everything.
schema_version: "1.1"
name: test-conventions-isolated-tests
description: >
  test-conventions should fire when asked to write Vitest tests for time- and
  filesystem-dependent code, and the tests should be isolation-safe under shuffled,
  parallel execution.
tags: [vitest, test-conventions]

execution:
  prompt: |
    Write Vitest tests for this function. Show me the full test file.

        import { readFileSync, writeFileSync } from "node:fs";

        export function cacheValue(path: string, compute: () => string): string {
          try {
            const entry = JSON.parse(readFileSync(path, "utf8"));
            if (Date.now() - entry.at < 60_000) return entry.value;
          } catch {}
          const value = compute();
          writeFileSync(path, JSON.stringify({ value, at: Date.now() }));
          return value;
        }

    Cover a cache hit, a miss, and expiry after 60 seconds.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test-conventions"'
    min: 1
    arm: with-only

  - name: uses_fake_time
    type: regex
    target: last_message
    pattern: "useFakeTimers|setSystemTime|spyOn\\(Date"
    match: contains

  - name: uses_per_test_temp_path
    type: regex
    target: last_message
    pattern: "mkdtemp"
    match: contains

  - name: restores_time_and_mocks
    type: regex
    target: last_message
    pattern: "useRealTimers|restoreAllMocks"
    match: contains

  - name: no_real_sleep_or_shared_path
    type: llm
    criteria: |
      PASS if the test file in the response tests expiry without really
      sleeping or waiting 60 seconds, and its tests do not share one fixed
      file path.

      FAIL if any of these hold:
      - The response shows no test file.
      - Expiry is tested by a real sleep or a real 60 second wait.
      - Several tests read or write the same fixed file path.
