# Needs no Bash grant (Skill tool only). Run this case with:
#   claude plugin eval plugins/vitest --case flaky-tests-repro-ladder
# The three required flags are literal strings, so they are free regex graders.
# One short llm grader remains only for "does not recommend retry/longer timeout",
# because a good answer may mention those words to warn against them. This
# deviates from #411's "one tool_used + one llm" rule: several cheap regexes
# plus one narrow judge are more stable than one judge checking everything.
schema_version: "1.1"
name: flaky-tests-repro-ladder
description: >
  flaky-tests should fire when a Vitest test fails intermittently in CI only, and
  the answer should give the concrete reproduction ladder (seed replay, repeats,
  worker throttling) rather than suggesting retries.
tags: [vitest, flaky-tests]

execution:
  prompt: |
    One of our Vitest tests, src/queue.test.ts, passes every time on my laptop but
    fails roughly 1 run in 10 on CI. The CI runner has 2 cores and I have 10. How
    do I reproduce it locally so I can find out why? Just give me the plan, don't
    run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flaky-tests"'
    min: 1
    arm: with-only

  - name: mentions_repeats
    type: regex
    target: last_message
    pattern: "--repeats"
    match: contains

  - name: mentions_seed_or_shuffle
    type: regex
    target: last_message
    pattern: "--sequence\\.(seed|shuffle)"
    match: contains

  - name: mentions_maxworkers
    type: regex
    target: last_message
    pattern: "--maxWorkers"
    match: contains

  - name: no_retry_as_fix
    type: llm
    criteria: |
      PASS if the response does not present adding retry (the Vitest retry
      option) or raising a test timeout as the way to fix or hide the flake.
      Warning against retry or a longer timeout is a PASS.

      FAIL if the response recommends adding retry or raising a timeout as
      the way to deal with the flake.
