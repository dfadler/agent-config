# Needs no Bash grant (Skill tool only). Run this case with:
#   claude plugin eval plugins/vitest --case flaky-tests-repro-ladder
schema_version: "1.1"
name: flaky-tests-repro-ladder
description: >
  flaky-tests should fire when a Vitest test fails intermittently in CI only, and
  the answer should give the concrete reproduction ladder (seed replay, repeats,
  worker throttling) rather than suggesting retries.
tags: [vitest, flaky-tests]

execution:
  prompt: |
    One of our Vitest tests, src/queue.test.ts, passes every time on my laptop but
    fails roughly 1 run in 10 on CI. The CI runner has 2 cores and I have 10. How
    do I reproduce it locally so I can find out why? Just give me the plan, don't
    run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flaky-tests"'
    min: 1
    arm: with-only

  - name: gives_repro_ladder
    type: llm
    criteria: |
      PASS if all of these hold:
      - The response tells the user to stress-run the test file with the
        Vitest --repeats flag (for example --repeats=100).
      - The response tells the user to replay or vary the shuffle order with
        --sequence.seed (or --sequence.shuffle).
      - The response tells the user to throttle concurrency to mimic the
        2-core CI runner with --maxWorkers (for example --maxWorkers=2).

      FAIL if any of these hold:
      - Any of the three flags above is missing.
      - The response presents adding retry or raising a timeout as the way to
        fix or hide the flake.
      - The response gives only generic advice with no Vitest flags.
