# Run: claude plugin eval plugins/github-pr --case pr-comments-stays-quiet-on-review-vs-issue-comment-api --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half of pr-comments' boundary: a question about how GitHub models PR
# comments uses "review comments" and "PR" but has no thread to classify and no reply to
# draft or post.
# Sabotage map: pr_comments_not_fired checks the description's trigger list ("respond to the
# review comments on PR N", "reply to the review threads on PR N"); replace it with "any
# question about PR comments" and a run should invoke the skill and fail. names_endpoint is
# a content check a default reply also passes.
# Can fail: the skill firing fails pr_comments_not_fired; a reply that never names the
# pulls/.../comments endpoint fails names_endpoint. Regression guard: a no-plugin arm passes
# by default, so Delta is about 0 by design.
schema_version: "1.1"
name: pr-comments-stays-quiet-on-review-vs-issue-comment-api
description: >
  A conceptual question about which REST endpoint returns inline PR review comments must not
  invoke pr-comments. expected_outcome: regression guard, Delta about 0 by design. PASS when
  pr-comments does not fire and the reply names the pulls comments endpoint; FAIL when it
  fires.
tags: [pr-comments, trigger, quick]

execution:
  prompt: |
    In GitHub's REST API, which endpoint path returns the inline review comments on a pull
    request, as opposed to the top-level conversation comments? Answer in two sentences. Do
    not run commands or post anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: pr_comments_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-comments"'
    min: 0
    max: 0
    arm: both

  - name: names_endpoint
    type: regex
    target: last_message
    pattern: 'pulls/\S*comments'
    match: contains
    arm: both
    weight: 0.5
