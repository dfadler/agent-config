# Run: claude plugin eval plugins/github-pr --case issue-triage-fires-on-single-issue --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-fire case: a single-issue triage request.
# Can fail: skill_fired fails if the description stops matching "triage issue N".
schema_version: "1.1"
name: issue-triage-fires-on-single-issue
description: >
  Asked to triage one issue for duplicate status, type and reporter questions, the model
  invokes issue-triage. expected_outcome: PASS when the skill fires; FAIL otherwise.
tags: [issue-triage, trigger, quick]

execution:
  prompt: |
    Triage issue 12 on dfadler/example-app: is it a duplicate, what is it, what should we
    ask the reporter? Do not run commands or post anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?issue-triage"'
    min: 1
    arm: with-only

  - name: addresses_ask
    type: regex
    target: last_message
    pattern: 'duplicate'
    flags: i
    match: contains
    arm: both
    weight: 0.5
