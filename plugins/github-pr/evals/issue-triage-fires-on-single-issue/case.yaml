# Run: claude plugin eval plugins/github-pr --case issue-triage-fires-on-single-issue --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-fire case: a single-issue triage request.
# Can fail: skill_fired fails if the description stops matching "triage issue N";
# draft_comment_marked and suggested_priority fail if the skill body is not followed.
schema_version: "1.1"
name: issue-triage-fires-on-single-issue
description: >
  Asked to triage one issue for duplicate status, type and reporter questions, the model
  invokes issue-triage. expected_outcome: PASS when the skill fires; FAIL otherwise.
tags: [issue-triage, trigger, quick]

execution:
  prompt: |
    Triage issue 12 of dfadler/example-app. Use the JSON below; do not run commands or post
    anything. Your final message must be the recommendation block and a draft comment.

    ```json
    {"number": 12, "title": "Crash when config file is missing",
     "author": "alice", "state": "OPEN",
     "body": "Running `app start` without config.yaml crashes with a stack trace. Expected a friendly error."}
    ```
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?issue-triage"'
    min: 1
    arm: with-only

  - name: draft_comment_marked
    type: regex
    target: last_message
    pattern: '🤖 \*\*Claude:\*\*'
    match: contains
    arm: both

  - name: suggested_priority
    type: regex
    target: last_message
    pattern: 'suggested priority'
    flags: i
    match: contains
    arm: both
