# Run: claude plugin eval plugins/github-pr --case issue-triage-stays-quiet-on-issue-summary --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; the issue
# text is pasted so nothing needs fetching.
# Near-miss: shares vocabulary (issue, reporter, "what does it say") but asks only for a summary,
# not classification, dedupe, priority or questions, so issue-triage must not fire.
# Regression guard: a no-plugin arm passes by default, so the Delta is about 0 by design.
# Can fail: triage_not_fired fails if the description over-triggers on any issue mention.
# Known-bad: Skill(issue-triage) invoked; the reply is then a full recommendation block.
schema_version: "1.1"
name: issue-triage-stays-quiet-on-issue-summary
description: >
  A request to summarize what a pasted issue says, with no triage ask, must not invoke
  issue-triage. expected_outcome: regression guard, Delta about 0 by design. PASS when it
  does not fire.
tags: [issue-triage, trigger, quick]

execution:
  prompt: |
    I haven't read issue 40 on dfadler/example-app yet. Summarize in two sentences what the
    reporter is describing. No commands, I only want the summary, not a triage.

    Title: "Export fails on empty report"
    Body: "Running `report --export` on a dataset with no rows throws a TypeError and writes
    no file. I expected an empty CSV with just the header row."
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: triage_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?issue-triage"'
    min: 0
    max: 0
    arm: both

  # Completion check so the quiet case cannot pass on an empty reply; a baseline passes it too.
  - name: summarizes_issue
    type: regex
    target: last_message
    pattern: 'empty|no rows|TypeError'
    flags: i
    match: contains
    arm: both
    weight: 0.5
