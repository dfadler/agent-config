# Run: claude plugin eval plugins/github-pr --case issue-triage-reads-issue-via-skill-not-shell --runs 3 --trust-plugin --no-publish --allow-tools 'Bash(gh issue *)'
# Shared run/grant facts: docs/contributing.md, "Plugin evals". Grant: Bash(gh issue *) only, so
# a bare `gh-untrusted` call is refused but still lands in the trace.
# Motivating failure: the old step 1 said "Read the issue with `gh-untrusted`" and the agent ran
# it in Bash ("command not found"). `gh-untrusted` is a skill (plugins/gh-untrusted), not a binary.
# Sabotage map: step 1 of SKILL.md ("invoking the `gh-untrusted` skill ... a skill, not a shell
# command"). Revert it to "Read the issue with `gh-untrusted`" and no_bare_gh_untrusted should
# start failing in the with arm.
# Reference-good trace: Skill(gh-untrusted) or Bash `gh issue view 52 --json ...`, then a
# recommendation. Known-bad trace: Bash `gh-untrusted 52`. read_via_skill passes the first only;
# no_bare_gh_untrusted fails the second. Neither grader reads the reply, so trace-checked only.
# The workspace has no network, so the read may fail; the graders look at the attempt, not the reply.
schema_version: "1.1"
name: issue-triage-reads-issue-via-skill-not-shell
description: >
  Asked to triage a named issue with no data supplied, the model reads it by invoking the
  gh-untrusted skill (or gh issue view --json) and never runs gh-untrusted as a Bash command.
  expected_outcome: PASS when Skill gh-untrusted is invoked and no Bash command starts with
  gh-untrusted; FAIL otherwise.
tags: [issue-triage, trigger, quick]

execution:
  prompt: |
    Can you triage issue 52 on dfadler/example-app? It says the export breaks on empty
    reports. Fetch it yourself by running whatever commands you need, then tell me what
    kind of issue it is and what we should ask the reporter. Don't post anything.
  max_turns: 8
  allowed_tools:
    - Skill
    - Bash

graders:
  - name: read_via_skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gh-untrusted"'
    min: 1
    arm: with-only

  # Indicator only: shows whether the prompt got Bash to run at all. If it is 0 in every run,
  # no_bare_gh_untrusted passes vacuously (the first version of this case had that problem).
  - name: bash_ran
    type: tool_used
    tool: Bash
    min: 1
    arm: with-only

  - name: no_bare_gh_untrusted
    type: tool_used
    tool: Bash
    input_match: '"command"\s*:\s*"(?:[^"\\]*[;&|]\s*)?gh-untrusted(?![\w./-])'
    min: 0
    max: 0
    arm: both
