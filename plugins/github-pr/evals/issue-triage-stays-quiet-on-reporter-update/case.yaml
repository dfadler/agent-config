# Run: claude plugin eval plugins/github-pr --case issue-triage-stays-quiet-on-reporter-update --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire: telling a reporter a fix landed is issue-reporter-etiquette's job.
# Regression guard: a no-plugin arm passes by default, so the Delta is about 0 by design.
# Can fail: triage_not_fired fails if issue-triage over-triggers (sabotage-checked with a
# fires-on-everything description). The prompt asks for a concrete result so a skill can fire.
schema_version: "1.1"
name: issue-triage-stays-quiet-on-reporter-update
description: >
  A request to tell the reporter of an issue that it is fixed in a PR must not invoke
  issue-triage. expected_outcome: regression guard, Delta about 0 by design. PASS when it
  does not fire.
tags: [issue-triage, trigger, quick]

execution:
  prompt: |
    Tell the reporter of issue 40 on dfadler/example-app it's fixed in PR 91. Do it now, no
    commands. Your final message must be only the draft comment text.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: triage_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?issue-triage"'
    min: 0
    max: 0
    arm: both

  # Result: a comment was drafted that points at the fixing PR (completion check, so the quiet
  # case cannot pass on an empty reply). Weighted down: a baseline passes it too.
  - name: drafts_comment_naming_pr
    type: regex
    target: last_message
    pattern: '\b91\b'
    match: contains
    arm: both
    weight: 0.5
