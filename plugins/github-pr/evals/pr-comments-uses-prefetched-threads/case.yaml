# Shared run/grant/deviation facts: docs/contributing.md, "Plugin evals".
# Run: claude plugin eval plugins/github-pr --case pr-comments-uses-prefetched-threads --allow-tools "Bash(gh *)"
# The grant lets does_not_refetch_threads and does_not_reply_to_answered_thread fail if the
# model reaches for gh; the sandbox blocks network access, so an attempt should fail
# instead of reaching GitHub.
# Composition check, sibling of pr-checks-uses-prefetched-snapshot: pr-comments documents
# (its "## Contract") that it accepts pr-babysit's thread shape, and its skip rule says a
# thread with needsAction false is already answered. The final llm grader stays because
# "classifies the pending thread and skips the answered one" is a judgment.
schema_version: "1.1"
name: pr-comments-uses-prefetched-threads
description: >
  pr-comments should consume unresolvedThreads data handed to it in the
  pr-babysit snapshot shape instead of re-querying reviewThreads, and should
  leave a thread with needsAction false alone because its latest comment is
  already the acting user's own reply.
tags: [pr-comments, composition]

execution:
  prompt: |
    I'm in the middle of a PR shepherding pass on PR 482 of dfadler/agent-config
    and already have the review threads. Handle the review comments using the
    data below; it is current. My login is dfadler.

    ```json
    {
      "unresolvedThreads": [
        {
          "threadId": "PRRT_aaa",
          "path": "src/a.ts",
          "line": 10,
          "isOutdated": false,
          "truncated": false,
          "needsAction": true,
          "comments": [
            {"id": 1001, "author": "octo-reviewer", "body": "Is this loop off by one?", "url": "https://github.com/dfadler/agent-config/pull/482#discussion_r1001", "createdAt": "2026-10-02T10:00:00Z"}
          ]
        },
        {
          "threadId": "PRRT_bbb",
          "path": "src/b.ts",
          "line": 4,
          "isOutdated": false,
          "truncated": false,
          "needsAction": false,
          "comments": [
            {"id": 2001, "author": "octo-reviewer", "body": "Rename this?", "url": "https://github.com/dfadler/agent-config/pull/482#discussion_r2001", "createdAt": "2026-10-02T09:00:00Z"},
            {"id": 2002, "author": "dfadler", "body": "Renamed in abc1234.", "url": "https://github.com/dfadler/agent-config/pull/482#discussion_r2002", "createdAt": "2026-10-02T09:30:00Z"}
          ]
        }
      ],
      "generalComments": [],
      "threadsTruncated": false,
      "generalCommentsTruncated": false
    }
    ```
  max_turns: 8
  allowed_tools:
    - Bash
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-comments"'
    min: 1
    arm: with-only

  - name: does_not_refetch_threads
    type: tool_used
    tool: Bash
    input_match: 'reviewThreads'
    min: 0
    max: 0
    arm: with-only

  - name: does_not_reply_to_answered_thread
    type: tool_used
    tool: Bash
    input_match: 'comments/2001/replies|comments/2002/replies|PRRT_bbb'
    min: 0
    max: 0
    arm: with-only

  - name: handles_pending_and_skips_answered
    type: llm
    criteria: |
      PASS if all of these hold:
      - The response works from the supplied thread data and does not claim to
        have fetched fresh review threads from GitHub.
      - It addresses the pending thread (PRRT_aaa, the off-by-one question) by
        classifying it, replying to it, or escalating or asking about it.
      - It leaves the answered thread (PRRT_bbb) alone, or notes that it is
        already answered and skipped.

      FAIL if any of these hold:
      - The response replies to, resolves, or reprocesses PRRT_bbb.
      - The response ignores the supplied data and asks the user for it.
