# Run: claude plugin eval plugins/shell-script-hygiene --case shell-script-hygiene-stays-quiet-on-one-liner
# Not run yet: paid, hand-off only (#646). No grant needed (Skill only).
# Should-not-fire near-miss: a terminal one-liner is bash but not a script file, so the baseline
# (strict flags, --help, exit codes) does not apply. The existing quiet case uses a Python script;
# this one is the nearer miss. Regression guard: the no-plugin arm passes by default, so Delta is
# zero by design.
# Can fail: no_hygiene_skill = 0 if the skill fires on any bash; gives_find_command = 0 if the
# command is not given.
schema_version: "1.1"
name: shell-script-hygiene-stays-quiet-on-one-liner
description: >
  A request for a single terminal command that finds large files must not invoke
  shell-script-hygiene. expected_outcome: PASS when the skill is not invoked and the reply gives a
  find or du command; FAIL otherwise.
tags: [shell-script-hygiene, trigger, quick]

execution:
  prompt: |
    Give me one terminal command that lists files over 100MB under the current directory. Reply
    with the command only; don't run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: no_hygiene_skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shell-script-hygiene"'
    min: 0
    max: 0
    arm: both

  - name: gives_find_command
    type: regex
    target: last_message
    pattern: 'find\s+\S+[^\n]*-size\s+\+?100|du\s+[^\n]*100'
    flags: i
    match: contains
    arm: both
