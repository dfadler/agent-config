# Run: claude plugin eval plugins/ask-form --case ask-form-stays-quiet-on-two-small-questions --runs 3 --trust-plugin --no-publish
# No grant: Skill only.
# Should-not-fire near-miss: two tiny questions that fit in one chat line, so nothing gets buried.
# Every input is inline (the first paid run showed replies hunting for a "meeting notes" file the
# empty sandbox never had).
# Ambiguity to watch: the description says "two or more open questions ... that would get buried
# in a chat reply". The guard assumes two one-word answers do not qualify; a fire here may be
# in-spec rather than a scope bug, so read a failure as a prompt for the description, not a bug.
# good-reply: Two quick things first: JSON or CSV, and is UTF-8 fine? Meanwhile I will start with JSON in UTF-8.
# bad-reply: I will put both questions in a form; click Copy answers and paste the block back.
# Regression guard: the no-plugin arm passes too, so Delta is about 0 by design.
# Can fail: ask_form_not_fired fails on a fire; handles_the_open_item fails a reply that neither
# asks nor commits to a format (a form hand-off, say). The prompt never contains "going with" or a
# code fence.
# Sabotage map: delete "that would get buried in a chat reply" from the description and a run
# should fire the skill and fail ask_form_not_fired. Smoke case: the Skill check is the only live
# signal and is noisy at 3 runs.
schema_version: "1.1"
name: ask-form-stays-quiet-on-two-small-questions
description: >
  Two small, quick questions that fit in one chat line must not fire ask-form.
  expected_outcome: regression guard, Delta about 0 by design. PASS when the skill does not fire
  and the reply asks in chat or commits to a format; FAIL when it fires.
tags: [ask-form, trigger, smoke]

execution:
  prompt: |
    Turn these meeting notes into a structured file for me.

    Notes: Tue 3 Nov, Dana and Raj. Decided to ship v2 on 20 Nov. Raj owns the migration
    script, due 12 Nov. Dana will email the customers on 16 Nov.

    Two small things are unclear and nothing else is: whether the file should be JSON or CSV,
    and whether UTF-8 is fine.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: ask_form_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask-form"'
    min: 0
    max: 0
    arm: both

  # A reply may ask back, state its pick, or just produce the file contents.
  - name: handles_the_open_item
    type: regex
    target: last_message
    pattern: '\?|going with|assum|I(?:''ll| will) (?:use|go with|write)|```(?:json|csv)'
    flags: i
    match: contains
    arm: both
