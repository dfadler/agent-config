# Run: claude plugin eval plugins/ask-form --case ask-form-fires-on-open-design-decisions --runs 3 --trust-plugin --no-publish
# No grant: Skill only. The sandbox has no Write, Bash or browser, so the form is never built. The
# real form build, browser delivery, paste-back and cleanup are untested by evals; fill-form.ts is
# unit-tested in scripts/ts/fill-form.test.ts.
# Should-fire: the user leaves five design decisions open and asks to be asked, in natural phrasing
# that never names a form, HTML, a file or the skill.
# What is graded: only the FIRE RATE. skill_fired is scored in the plugin arm only (arm: with-only).
# No outcome grader: any reply grader built on the skill's outputs is meaningless where the skill
# cannot finish, and a free "numbered list" grader passes the baseline too. Fallback behaviour is
# graded by ask-form-falls-back-to-compact-list.
# good-reply: I couldn't build a form here, so my questions are in chat. 1. Database: SQLite, Postgres, or MySQL? 2. Sign-in: SSO or password? 3. Hosting: VM, Docker, or PaaS? 4. Dashboard: none, simple, or full? 5. Default loan length: 1 week, 2 weeks, or 1 month?
# bad-reply: Sounds good, I will start with SQLite and a simple password sign-in and build from there.
# Sabotage map: delete "two or more open questions" from the description and the skill stops
# firing, so skill_fired fails (indicator needs min 1 call in the plugin arm).
schema_version: "1.1"
name: ask-form-fires-on-open-design-decisions
description: >
  Five undecided design choices plus "ask me" should fire ask-form. expected_outcome: PASS when
  the ask-form skill is invoked; FAIL when it is not. Fire rate only; the Delta comes from the
  plugin arm alone.
tags: [ask-form, trigger, quick]

execution:
  prompt: |
    I want you to build a small internal tool that tracks equipment loans for our team.
    I haven't decided anything yet: the database, how people sign in, where it runs, whether
    it needs a reporting dashboard, and how long loans last by default. You need my decisions
    on all of those before you start, so ask me.
  max_turns: 8
  allowed_tools:
    - Skill

graders:
  # Scored in the plugin arm only: fire rate of the skill.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask-form"'
    min: 1
    arm: with-only
