# Run: claude plugin eval plugins/ask-form --case ask-form-fires-on-open-design-decisions --runs 3 --trust-plugin --no-publish
# No grant: Skill only. A first run with Write(.claude/ask-form/*) granted showed the sandbox denies the
# write anyway ("denied in this mode"), so file creation and the browser steps are untested by evals.
# What is graded instead is the attempt: the trace shows the agent calling Write on
# .claude/ask-form/questions.json (SKILL.md step 1), and the reply mentions the form.
# Should-fire: the user leaves five design decisions open and asks to be asked, in natural
# phrasing that never names a form, HTML, a file or the skill.
# Expected arms: with the plugin the agent loads ask-form, tries to write questions.json, and (the
# sandbox blocking it) says it could not build the form, possibly listing the questions in chat as a
# fallback. Without it the agent lists the questions in chat and never mentions a form.
# Delta comes from attempted_questions_file (trace regex on the Write call) and points_at_form;
# skill_fired is an unscored indicator in a two-arm run. A chat-list grader was dropped: fallback
# lists in the with arm made it fail for sandbox reasons.
# good-reply: I put the questions in a form (questions.json) and opened it in the browser. Fill it in, click Copy answers, then paste the block back here. I will wait.
# bad-reply: Sure! 1. Which database do you want? 2. What sign-in method should it use? 3. Where will it be hosted? 4. Do you want a dashboard? 5. How long should loans last?
# Sabotage map: delete "two or more open questions" from the description and the skill stops
# firing, failing both graders; delete step 1 (write questions.json) and attempted_questions_file
# fails. Not covered by any eval: opening the form in the integrated browser and deleting
# .claude/ask-form/ afterwards (steps 3 and 5). The fill script is covered by
# scripts/ts/fill-form.test.ts.
schema_version: "1.1"
name: ask-form-fires-on-open-design-decisions
description: >
  Five undecided design choices plus "ask me" should fire ask-form. expected_outcome: PASS when
  the agent tries to write .claude/ask-form/questions.json and the reply refers to a form; FAIL
  when it only lists the questions in chat. The Delta comes from the two scored graders;
  skill_fired is unscored.
tags: [ask-form, trigger, quick]

execution:
  prompt: |
    I want you to build a small internal tool that tracks equipment loans for our team.
    I haven't decided anything yet: the database, how people sign in, where it runs, whether
    it needs a reporting dashboard, and how long loans last by default. You need my decisions
    on all of those before you start, so ask me.
  max_turns: 8
  allowed_tools:
    - Skill

graders:
  # Indicator only (unscored in a two-arm run).
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask-form"'
    min: 1

  # Steps: the Write call on the questions file appears in the trace even when denied. "file_path"
  # does not occur in SKILL.md, so loading the skill alone does not match.
  - name: attempted_questions_file
    type: regex
    target: trace
    pattern: 'file_path[^,]{0,200}ask-form/questions\.json'
    match: contains

  # Reply: refers to a form, a browser page, the Copy button or the file (also true of a
  # "could not build the form" fallback). The prompt contains none of these words.
  - name: points_at_form
    type: regex
    target: last_message
    pattern: '\bforms?\b|Copy answers|questions\.json|\bHTML\b|\bbrowser\b'
    flags: i
    match: contains
