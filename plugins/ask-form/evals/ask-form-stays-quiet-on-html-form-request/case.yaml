# Run: claude plugin eval plugins/ask-form --case ask-form-stays-quiet-on-html-form-request --runs 3 --trust-plugin --no-publish
# No grant: Skill only.
# Should-not-fire near-miss: shares "form", "radio buttons", "checkboxes", "dropdown" with the
# skill's vocabulary, but the user wants a form as the deliverable, not a way to be asked.
# good-reply: a single HTML snippet with <form>, radio inputs, checkboxes and a <select>.
# bad-reply: I'll put your questions in a local form and open it in the browser; click Copy answers and paste them back.
# Regression guard: the no-plugin arm passes too, so Delta is about 0 by design.
# Can fail: ask_form_not_fired fails if the skill over-triggers on the vocabulary;
# writes_form_markup fails a reply that talks about forms but provides no markup.
schema_version: "1.1"
name: ask-form-stays-quiet-on-html-form-request
description: >
  A request to write an HTML signup form with radio buttons, checkboxes and a dropdown must
  not invoke ask-form. expected_outcome: regression guard, Delta about 0 by design. PASS when
  the skill does not fire and the reply contains form markup; FAIL when it fires.
tags: [ask-form, trigger, quick]

execution:
  prompt: |
    Write the HTML for a newsletter signup form for our marketing site: an email field, radio
    buttons for frequency (daily or weekly), checkboxes for topics (news, tips, offers), and a
    dropdown for country. Reply with just the code block.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: ask_form_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask-form"'
    min: 0
    max: 0
    arm: both

  - name: writes_form_markup
    type: regex
    target: last_message
    pattern: '<form[\s>]'
    flags: i
    match: contains
    arm: both
