# Run: claude plugin eval plugins/ask-form --case ask-form-fires-on-scope-questions --runs 3 --trust-plugin --no-publish
# No grant: Skill only. The sandbox has no Write, Bash or browser, so the form is never built. The
# real form build, browser delivery, paste-back and cleanup are untested by evals; fill-form.ts is
# unit-tested in scripts/ts/fill-form.test.ts.
# Should-fire, second domain (a migration with scope choices and free-text detail), so the fire
# rate is not tied to the "build a tool" phrasing of the sibling case.
# What is graded: only the FIRE RATE. skill_fired is scored in the plugin arm only (arm: with-only).
# No outcome grader: replies built on the skill's outputs are meaningless where the skill cannot
# finish. Earlier runs fired on this prompt in only 1 of 3 runs, so expect a noisy score.
# good-reply: I couldn't build a form here, so my questions are in chat. 1. Which environment goes first? 2. How much production downtime is acceptable? 3. Which teams must be notified? 4. Any compliance constraints?
# bad-reply: Understood. I will draft the plan assuming staging first, a short maintenance window and no special constraints.
# Sabotage map: delete "two or more open questions" from the description and the skill stops
# firing, so skill_fired fails.
schema_version: "1.1"
name: ask-form-fires-on-scope-questions
description: >
  A migration request with several unanswered scope choices should fire ask-form.
  expected_outcome: PASS when the ask-form skill is invoked; FAIL when it is not. Fire rate only;
  the Delta comes from the plugin arm alone.
tags: [ask-form, trigger, quick]

execution:
  prompt: |
    We need to move our staging and production Postgres clusters to the new region next month.
    Before you draft the plan I need to give you input, but I don't know what you need. You
    probably need to know which environments go first, whether we can take downtime, which
    teams must be notified, and any constraints I haven't thought of. Get what you need from me
    in one go so we don't ping-pong.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Scored in the plugin arm only: fire rate of the skill.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?ask-form"'
    min: 1
    arm: with-only
