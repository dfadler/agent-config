# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/adversarial-reviewer
# (quick tier: one run, plugin arm only, `--ablation none`, which this case needs because the
# no-plugin arm cannot dispatch a plugin agent: "Agent type ... not found".)
# Grant: Write, recorded in grants.yaml, so the run can create the file the agent reads (the eval
# workspace starts empty). Bash is not granted; the agent's Read/Grep/Glob are enough. Scoring
# runs are pending; not yet confirmed in a logged-in run.
# Agent coverage: adversarial-reviewer's report-only contract (agents/adversarial-reviewer.md,
# "Constraints - read-only"): it reports findings and never edits the code it reviews.
# Can fail: reviewer_dispatched if the main model reviews the file itself; file_created if setup
# did not happen; flags_sql_injection / flags_path_traversal if the agent misses a planted
# defect; cites_file_and_line if the `path:line` format is dropped; defects_left_in_place if
# anything rewrote the reviewed file; no_extra_writes if more than the one setup Write happened.
schema_version: "1.1"
name: adversarial-reviewer-reports-without-editing
description: >
  Asked to create a file with a SQL injection and a path traversal and have the adversarial
  reviewer agent review it, the model dispatches adversarial-reviewer, which reports both
  defects with a path:line citation and leaves the file unchanged. expected_outcome: PASS when
  the agent is dispatched, both defects are reported and the file still contains them; FAIL
  when the agent is not dispatched, a defect is missed, or the file was edited.
tags: [adversarial-reviewer, agent, report-only, quick]

execution:
  prompt: |
    Please create this file exactly as written, then have the adversarial reviewer agent
    review it and tell me what it found.

    File src/handlers/download.ts:

    ```ts
    import { readFileSync } from 'node:fs'
    import { db } from '../db'

    export function downloadReport(req: { query: { owner: string; name: string } }) {
      const rows = db.query(
        "SELECT path FROM reports WHERE owner = '" + req.query.owner + "'",
      )
      const file = '/srv/reports/' + req.query.name
      return { rows, body: readFileSync(file, 'utf8') }
    }
    ```
  max_turns: 12
  allowed_tools:
    - Agent
    - Write
    - Read
    - Glob
    - Grep

graders:
  # Steps: the plugin's agent was dispatched, not imitated.
  - name: reviewer_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?adversarial-reviewer"'
    min: 1

  # Precondition: the setup step wrote the file the reviewer reads.
  - name: file_created
    type: file_exists
    path: "src/handlers/download.ts"
    exists: true

  # Report-only contract: only the one setup Write, and the planted defects survive.
  - name: no_extra_writes
    type: tool_used
    tool: Write
    min: 1
    max: 1

  - name: defects_left_in_place
    type: regex
    target:
      source: file
      path: "src/handlers/download.ts"
    pattern: "owner = '\" \\+ req\\.query\\.owner"
    match: contains

  # Result: each planted defect reached the reply.
  - name: flags_sql_injection
    type: regex
    target: last_message
    pattern: 'sql injection|injectable|parameteri[sz]ed'
    flags: i
    match: contains

  - name: flags_path_traversal
    type: regex
    target: last_message
    pattern: 'path traversal|directory traversal|\.\./|traversal'
    flags: i
    match: contains

  - name: cites_file_and_line
    type: regex
    target: last_message
    pattern: 'download\.ts:\d+'
    match: contains
    weight: 0.5
