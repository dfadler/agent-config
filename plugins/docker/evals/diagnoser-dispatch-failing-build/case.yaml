# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/docker --tier quick --case diagnoser-dispatch-failing-build (no grant needed; Agent only).
# Maps to docker-diagnoser description: "Use when the cause is unknown and the logs would be long."
# good-reply: (a call to Agent with subagent_type docker:docker-diagnoser whose prompt carries the symptom and /home/dev/shop, then a relay of the agent's cause/evidence/fix)
# bad-reply: "Looks like a missing file in your COPY step; check your Dockerfile." (answered from the pasted tail, no Agent call)
# No delta expected: the no-plugin arm cannot dispatch the agent, so this is a net for the plugin arm only.
schema_version: "1.1"
name: diagnoser-dispatch-failing-build
description: >
  An unexplained build failure with a huge log should be handed to docker-diagnoser with
  the project path. No delta expected: the baseline cannot dispatch the agent, so this is
  a net for the plugin arm. expected_outcome: PASS when Agent is called for
  docker:docker-diagnoser and its input names the project path; FAIL otherwise.
tags: [docker, agent, trigger, quick]

execution:
  prompt: |
    My docker build keeps dying and I can't tell why. The project is at /home/dev/shop.
    The full build output is about 4000 lines, so I'm only pasting the end of it:

    ------
     => ERROR [builder 6/9] RUN npm run build                              41.2s
    ------
    failed to solve: process "/bin/sh -c npm run build" did not complete successfully: exit code: 137

    I have no idea what caused it. Can you find out?
  max_turns: 6
  allowed_tools:
    - Agent

graders:
  - name: diagnoser_dispatched
    type: tool_used
    tool: Agent
    input_match: '"(?:subagent_type|agent)"\s*:\s*"(?:docker:)?docker-diagnoser"'
    min: 1

  # The caller passes the absolute project path. Lookaheads because JSON key order is not fixed.
  - name: dispatch_carries_project_path
    type: tool_used
    tool: Agent
    input_match: '(?=[\s\S]*docker-diagnoser)(?=[\s\S]*/home/dev/shop)'
    min: 1
