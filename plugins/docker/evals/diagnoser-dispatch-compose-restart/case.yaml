# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/docker --tier quick --case diagnoser-dispatch-compose-restart (no grant needed; Agent only).
# Maps to docker-diagnoser description: "a container that exits or restarts, a Compose project that will not start".
# good-reply: (Agent call to docker:docker-diagnoser with the symptom, /srv/blog and the service name "web", then a summary of the agent's cause and proposed fix)
# bad-reply: "Run docker compose logs web and docker compose down -v, then up again." (self-help, no dispatch)
# No delta expected: the no-plugin arm cannot dispatch the agent.
schema_version: "1.1"
name: diagnoser-dispatch-compose-restart
description: >
  A Compose service stuck in a restart loop, cause unknown, should go to docker-diagnoser.
  Natural phrasing, no agent or skill name. No delta expected (baseline cannot dispatch).
  expected_outcome: PASS when Agent is called for docker:docker-diagnoser with the project
  path; FAIL otherwise.
tags: [docker, agent, trigger, quick]

execution:
  prompt: |
    ugh, my blog stack won't stay up. `docker compose up -d` in /srv/blog and then the web
    service just keeps restarting every few seconds. `docker compose ps` shows:

    NAME        SERVICE   STATUS
    blog-web-1  web       Restarting (1) 4 seconds ago
    blog-db-1   db        Up 2 minutes (healthy)

    Please work out why web keeps dying and tell me what to change.
  max_turns: 6
  allowed_tools:
    - Agent

graders:
  - name: diagnoser_dispatched
    type: tool_used
    tool: Agent
    input_match: '"(?:subagent_type|agent)"\s*:\s*"(?:docker:)?docker-diagnoser"'
    min: 1

  - name: dispatch_carries_project_path
    type: tool_used
    tool: Agent
    input_match: '(?=[\s\S]*docker-diagnoser)(?=[\s\S]*/srv/blog)'
    min: 1
