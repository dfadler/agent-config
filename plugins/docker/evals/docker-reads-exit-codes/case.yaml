# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/docker --case docker-reads-exit-codes (no grant needed; Skill only).
# Target sentence (SKILL.md Diagnosing): "docker ps -a for the status and exit code, and read the code before the logs. docker run reserves 125 ... though a command can itself exit 125 to 127".
# good-reply: api exited 137, so the process received SIGKILL. worker exited 125: docker run reserves 125 for the Docker daemon failing, but a command can exit 125 itself, so check docker logs --tail 100 worker and docker inspect to tell which.
# bad-reply: Both just crashed. Restart them with docker compose restart and send me the logs.
schema_version: "1.1"
name: docker-reads-exit-codes
description: >
  Given docker ps -a rows with exit codes 137 and 125, the reply should read the codes
  (SIGKILL; 125 reserved by docker run but possibly the command's own) before proposing a
  fix. expected_outcome: PASS when both codes are interpreted and 125 is flagged as
  ambiguous; FAIL on a restart-first answer. The 137 half is probably known to a bare model;
  the 125 half is the discriminating one.
tags: [docker, trigger, quick]

execution:
  prompt: |
    Two containers died on my dev box. docker ps -a shows:

    CONTAINER ID   IMAGE           COMMAND            STATUS                      NAMES
    3f2a9c1d7b10   myorg/api:2.1   "node server.js"   Exited (137) 3 minutes ago  api
    8d41e0aa92c3   myorg/worker    "./run-worker.sh"  Exited (125) 9 minutes ago  worker

    What went wrong with each?
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?docker"'
    min: 1

  - name: reads_137_as_sigkill
    type: regex
    target: last_message
    pattern: '137[^\n]{0,160}(?:SIGKILL|signal 9|killed)|(?:SIGKILL|signal 9|killed)[^\n]{0,160}137'
    flags: i
    match: contains

  # Wording-dependent: one rephrase can miss it. Left at weight 1 on purpose.
  - name: flags_125_as_ambiguous
    type: regex
    target: last_message
    pattern: '125[\s\S]{0,400}(?:itself|its own|also (?:exit|return)|either|or (?:the )?(?:command|app|script|process)|ambiguous|could (?:also )?be)'
    flags: i
    match: contains
