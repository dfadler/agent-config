# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/node-pnpm --case pnpm-usage-fires-on-frozen-lockfile-ci (Skill only; no grant needed).
# Maps to SKILL.md "Dependencies and the lockfile": drift is fixed by `pnpm install` locally and committing the lockfile with the package.json change; never hand-edit pnpm-lock.yaml.
# good-reply: The lockfile is out of sync with package.json, and CI's frozen install refuses to rewrite it. Run `pnpm install` locally, then commit the updated pnpm-lock.yaml together with the package.json change.
# bad-reply: Change the CI step to `pnpm install --no-frozen-lockfile`, or edit the pnpm-lock.yaml entry for lodash by hand.
schema_version: "1.1"
name: pnpm-usage-fires-on-frozen-lockfile-ci
description: >
  Natural phrasing with no skill words: CI fails on a lockfile mismatch after a dependency
  bump. expected_outcome: PASS when the reply says to regenerate with `pnpm install` locally
  and commit the lockfile, and does not tell the user to loosen CI or hand-edit the lockfile;
  FAIL otherwise. A bare model may pass this too (delta may be near zero).
tags: [pnpm-usage, trigger, quick]

execution:
  prompt: |
    I bumped lodash in package.json and pushed. CI now fails at the install step with
    `ERR_PNPM_OUTDATED_LOCKFILE  Cannot install with "frozen-lockfile" because
    pnpm-lock.yaml is not up to date with package.json`. What do I do?
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pnpm-usage"'
    min: 1

  # Result: regenerate locally, then commit the lockfile. "commit" is not in the prompt.
  - name: regenerate_and_commit
    type: regex
    target: last_message
    pattern: 'pnpm install[\s\S]{0,300}commit|commit[\s\S]{0,200}pnpm-lock'
    flags: i
    match: contains

  # Result: the wrong fixes in code form. A reply quoting them as a warning false-fails (accepted).
  - name: no_loosening_or_hand_edit
    type: regex
    target: last_message
    pattern: '--no-frozen-lockfile|frozen-lockfile\s*[=:]\s*false|CI=false'
    flags: i
    match: not_contains
