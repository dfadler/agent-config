# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/vite
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant needed (Skill only).
# Should-not-fire half of the scaffold boundary: a near-miss that shares "Vite", "vite.config.ts"
# and "config" with scaffold's description but wants a built-in server option, not a plugin.
# The Skill check names every skill in the plugin, so any vite skill firing here fails it.
# Can fail: the Skill check scores 0 if scaffold (or another vite skill) over-triggers on any
# vite.config.ts question; answers_with_proxy_option scores 0 if the reply never shows
# server.proxy. This is a regression guard, so a no-plugin arm passes it by default and shows
# no delta by design; the quick tier already runs plugin arm only with --ablation none.
schema_version: "1.1"
name: scaffold-stays-quiet-on-proxy-config
description: >
  A request to proxy /api to a local backend in vite.config.ts must not invoke any vite
  skill, since it needs a built-in server option and no plugin. expected_outcome: PASS when
  no vite skill is invoked and the reply shows a server.proxy block; FAIL when a vite skill
  is invoked or the reply never shows server.proxy.
tags: [vite, scaffold, trigger, quick]

execution:
  prompt: |
    In my Vite app's vite.config.ts, how do I make requests to /api go to my
    backend at http://localhost:8080 during development? Show the config change
    in your reply; don't create files or run commands.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Steps. min 0 is explicit: tool_used defaults min to 1. arm both so the "never called"
  # check is scored in a two-arm run too.
  - name: no_vite_skill_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:scaffold|review|test|dev-workflow|peer-deps)"'
    min: 0
    max: 0
    arm: both

  # Result: the task was actually done (a completion check, not a skill property).
  - name: answers_with_proxy_option
    type: regex
    target: last_message
    pattern: 'server\s*:\s*\{[\s\S]{0,400}proxy\s*:\s*\{'
    match: contains
    arm: both
