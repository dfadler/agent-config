# Run: claude plugin eval plugins/accessibility-skills --case accessibility-skills-reviews-stylesheet --runs 3 --trust-plugin --no-publish
# Should-fire half, CSS form: the description covers "markup and CSS", so this checks that a
# stylesheet with no markup at all still fires the skill and gets the full report. The CSS
# plants `outline: none` on a focus state, a 16px close control, an infinite spinner animation
# with no `prefers-reduced-motion` rule and links with the underline removed, so the review
# has real material. Every grader is free, so the case is tagged `quick`.
# Why these graders: the report's "Checklist categories reviewed" line (with its N/A list) and
# the closing "Not covered by this review" section are the skill's own contract; a no-plugin
# reply has no reason to produce either. The findings are not graded: models already know
# these criteria (a first draft graded 2.4.7, 2.5.8 and 2.3.3 and case-reviewer flagged it as
# passable without the skill).
# Sabotage map: report_header, categories_line, not_covered_section: the report template in
# SKILL.md, step 5 ("# Accessibility review", "Checklist categories reviewed:", "## Not covered
# by this review"). Empty SKILL.md's body and all three should fail.
# Can fail: a freeform answer fails report_header, categories_line and not_covered_section;
# skill_fired fails if a CSS-only paste never triggers the skill.
schema_version: "1.1"
name: accessibility-skills-reviews-stylesheet
description: >
  When asked to check a pasted stylesheet for accessibility issues, the model invokes
  accessibility-skills and replies in its report format. expected_outcome: PASS when the reply
  has the "Accessibility review" heading, a "Checklist categories reviewed:" line and a "Not
  covered by this review" section; FAIL otherwise. The report shape is what a no-plugin reply
  lacks; the findings themselves are not graded.
tags: [accessibility-skills, trigger, quick]

execution:
  prompt: |
    Check this stylesheet for accessibility issues (WCAG 2.2, AA). It is
    src/styles/controls.css.

    ```css
    .btn:focus { outline: none; }

    .btn-close { width: 16px; height: 16px; }

    .spinner { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    a { color: inherit; text-decoration: none; }
    ```
  max_turns: 12
  allowed_tools:
    - Skill
    - Read

graders:
  # Steps. Indicator in a two-arm run, scored only with the plugin.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?accessibility-skills"'
    min: 1
    arm: with-only

  # Result.
  - name: report_header
    type: regex
    target: last_message
    pattern: '^#+\s*Accessibility review'
    flags: im
    match: contains
    arm: both

  - name: categories_line
    type: regex
    target: last_message
    pattern: 'Checklist categories reviewed:'
    match: contains
    arm: both

  - name: not_covered_section
    type: regex
    target: last_message
    pattern: '^##[^\n]*Not covered by this review'
    flags: im
    match: contains
    arm: both
