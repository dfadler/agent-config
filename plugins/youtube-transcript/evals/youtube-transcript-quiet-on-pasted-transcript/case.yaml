# Run: claude plugin eval plugins/youtube-transcript --case youtube-transcript-quiet-on-pasted-transcript --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Near-miss must-not-fire case: the user already pasted the transcript text, so nothing needs
# fetching. It shares the skill's vocabulary ("YouTube", "transcript") but wants a summary.
# A regression guard with no expected Delta: the no-plugin arm passes too. Tagged smoke
# because its only live signal is the Skill check, which is noisy at 3 runs.
# Written in the session that wrote the skill: shares that session's view of the boundary.
schema_version: "1.1"
name: youtube-transcript-quiet-on-pasted-transcript
description: >
  A request to summarize a transcript the user pasted must not fire youtube-transcript.
  A regression guard: the no-plugin arm passes too, so there is no delta by design.
  expected_outcome: PASS when the skill is not invoked; FAIL when it is.
tags: [youtube-transcript, trigger, smoke]

execution:
  prompt: |
    I copied this transcript from a YouTube talk. Give me three bullet points on it.

    "So the main thing we learned is that evals should start from real failures. We read
    fifty traces first, then wrote graders for the three problems that showed up most.
    Scores only meant something once the judge agreed with us on a hand-labeled sample."
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: youtube_transcript_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?youtube-transcript"'
    min: 0
    max: 0
    arm: both
