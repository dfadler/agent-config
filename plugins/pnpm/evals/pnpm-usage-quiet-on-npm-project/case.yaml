# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts plugins/pnpm --trigger-boundary (plugin arm only; no grant needed).
# Maps to the SKILL.md description: "Use when working in a pnpm project (`pnpm-lock.yaml`, a `packageManager` pin or `pnpm-workspace.yaml`)".
# good-reply: (no Skill call for pnpm-usage) That ERESOLVE is a peer-dependency conflict: `npm install --legacy-peer-deps` or add an "overrides" entry in package.json for the conflicting package.
# bad-reply: (pnpm-usage invoked for an npm-only project)
schema_version: "1.1"
name: pnpm-usage-quiet-on-npm-project
description: >
  A package-lock.json project with an npm override question shares the description's
  vocabulary (overrides, lockfile, dependencies) but has no pnpm marker. A trigger-boundary
  negative: counted by `run-evals --trigger-boundary`, plugin arm only, so no delta.
tags: [pnpm-usage, trigger-boundary, "pair:pnpm-usage-fires-on-overrides"]

execution:
  prompt: |
    This is a plain npm project, package-lock.json is committed. `npm install` fails with
    ERESOLVE on a peer dependency of eslint-plugin-react. Do I fix it with `overrides` in
    package.json, and does the lockfile need regenerating after?
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: pnpm_usage_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pnpm-usage"'
    min: 0
    max: 0
