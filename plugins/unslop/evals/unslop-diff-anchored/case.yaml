# Run: claude plugin eval plugins/unslop --case unslop-diff-anchored --runs 3 --trust-plugin --no-publish
# Drafted in the session that edited SKILL.md, not by blind-case-writer: it shares that session's reading of U34 to U39.
# Target: U34. Exempt text (changelogs) is not tested here.
# good-reply: The retry helper waits 2 seconds before each retry after a timeout.
# bad-reply: The retry helper was added to replace the old loop and now handles timeouts by waiting 2 seconds before each retry.
# EVAL024 is intended where a grader is not_contains: an echo of the prompt FAILS it. "Keeps" graders pass on a no-plugin run by design.
schema_version: "1.1"
name: unslop-diff-anchored
description: >
  /unslop on prose that narrates an edit should describe the current behavior and keep the mechanism.
  expected_outcome: PASS when the narration words are gone and retry and 2 survive; FAIL when any narration word remains.
tags: [unslop]

execution:
  prompt: |
    /unslop:unslop The retry helper was added to replace the old loop and now handles timeouts by waiting 2 seconds before each retry.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: narration_removed
    type: regex
    pattern: '\b(?:was added|replace[sd]?|previously|now handles)\b'
    flags: i
    match: not_contains
    weight: 2

  - name: mechanism_kept
    type: regex
    pattern: '\bretr(?:y|ies)\b[\s\S]*\b2 seconds\b'
    flags: i
    match: contains
    weight: 1
