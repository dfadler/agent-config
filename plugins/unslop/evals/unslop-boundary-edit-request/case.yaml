# Run: claude plugin eval plugins/unslop --case unslop-boundary-edit-request --runs 3 --trust-plugin --no-publish
# Smoke guard, not a trigger-boundary measurement: the /unslop prefix expands the skill inline, so no
# should-fire twin can grade a Skill call, and run-evals --trigger-boundary would have no positive control.
# Drafted by the blind-case-writer agent from SKILL.md alone, then adapted to the repo case format.
# Near-miss: shares "rewrite" and "paragraph" with the skill but never types /unslop. The skill is
# manual-only (disable-model-invocation), so it must not fire here.
# This is a tripwire with no expected delta. One negative cannot bound the over-trigger rate.
schema_version: "1.1"
name: unslop-boundary-edit-request
description: >
  A plain request to rewrite a paragraph, with no /unslop, should not load the unslop skill.
  expected_outcome: PASS when the Skill tool is not called for unslop; FAIL when it is.
tags: [smoke]

execution:
  prompt: |
    Can you rewrite this paragraph so it flows better? "Our new dashboard is fast. It loads data from
    three sources and caches the result for ten minutes."
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: stays_quiet
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?unslop"'
    min: 0
    max: 0
    arm: both
