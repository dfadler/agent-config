# Run: claude plugin eval plugins/gha-ci-audit --case agent-dispatch-analyzer-quiet
# Not run yet: paid, hand-off only (#646). No grant needed (Agent and Read only).
# Quiet case for gha-ci-audit:analyzer: shares "benchmark", "assertion" and "with/without" with the
# agent's description but asks a conceptual question that needs no agent. Regression guard: the
# no-plugin arm passes it by default (the agent does not exist there), so Delta is zero by design.
# Can fail: analyzer_not_dispatched = 0 if the agent over-triggers on benchmark vocabulary;
# explains_discrimination = 0 if the question is not answered.
schema_version: "1.1"
name: agent-dispatch-analyzer-quiet
description: >
  A conceptual question about assertions that pass in every configuration must not dispatch
  gha-ci-audit:analyzer. expected_outcome: PASS when the agent is not dispatched and the reply
  says such an assertion does not discriminate; FAIL when the agent is dispatched or the reply
  misses the point.
tags: [gha-ci-audit, analyzer, agent, trigger, quick]

execution:
  prompt: |
    In an A/B benchmark of a prompt with and without a skill, one assertion passes in every run
    of both arms. In two sentences, what does that tell me about the assertion? No files, no
    commands.
  max_turns: 4
  allowed_tools:
    - Agent
    - Read

graders:
  # Steps. min 0 is explicit (tool_used defaults min to 1); arm both so the check scores in a
  # two-arm run too.
  - name: analyzer_not_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?analyzer"'
    min: 0
    max: 0
    arm: both

  # Result: completion check, not a skill property.
  - name: explains_discrimination
    type: regex
    target: last_message
    pattern: 'discriminat|differentiat|tells? (you|us) (nothing|little)|no signal|not (measuring|testing)|too (easy|weak)'
    flags: i
    match: contains
    arm: both
