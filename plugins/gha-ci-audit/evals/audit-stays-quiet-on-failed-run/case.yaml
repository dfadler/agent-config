# Run: claude plugin eval plugins/gha-ci-audit --case audit-stays-quiet-on-failed-run
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant needed (Skill only).
# Second should-not-fire case for gha-ci-audit, a nearer miss than
# audit-stays-quiet-on-workflow-authoring: a CI question about one failing run, which shares
# "CI", "GitHub Actions" and "workflow" with the skill's description but is debugging, not a
# usage or cost audit.
# Can fail: the Skill check scores 0 if gha-ci-audit over-triggers on any CI trouble;
# names_the_permission scores 0 if the reply misses the permission. Regression guard, so a
# no-plugin arm passes it by default and shows no delta by design.
schema_version: "1.1"
name: audit-stays-quiet-on-failed-run
description: >
  A question about why one GitHub Actions step failed with a permissions error must not
  invoke gha-ci-audit, since it is debugging, not an audit of CI cost or speed.
  expected_outcome: PASS when the skill is not invoked and the reply names the
  pull-requests write permission; FAIL when the skill is invoked or the reply omits it.
  Regression guard: a no-plugin run is expected to pass, so the Delta is zero by design.
tags: [gha-ci-audit, trigger, quick]

execution:
  prompt: |
    My GitHub Actions workflow fails on a `gh pr comment` step with "Resource not
    accessible by integration". What permission does the job need? Answer in your reply;
    don't create files or run commands.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Steps. min 0 is explicit: tool_used defaults min to 1. arm both so the "never called"
  # check is scored in a two-arm run too.
  - name: gha_ci_audit_not_invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gha-ci-audit"'
    min: 0
    max: 0
    arm: both

  # Result: the question was actually answered (a completion check, not a skill property).
  - name: names_the_permission
    type: regex
    target: last_message
    pattern: 'pull-requests:\s*write'
    match: contains
    arm: both
