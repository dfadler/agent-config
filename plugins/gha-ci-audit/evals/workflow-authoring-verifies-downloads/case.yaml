# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case workflow-authoring-verifies-downloads plugins/gha-ci-audit
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant needed (Skill only, reply-only).
# Security case for gha-workflow-authoring's "Verify downloads" rule: a release binary's checksum is
# checked against the publisher's manifest, and a download is never piped into a shell or `tar`.
# The prompt asks only to download and put the binary on PATH; it names neither rule.
# Can fail: the common `curl -sSL <url> | tar xJ` form fails no_pipe_to_tar_or_shell, and a step that
# downloads and extracts with no checksum fails checks_checksum. A bare model often does both.
# Sabotage map: no_pipe_to_tar_or_shell and checks_checksum <- "Verify downloads".
# good-reply: "- name: Install shellcheck\n  run: |\n    curl -sSLO https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz\n    echo \"<sha256 from the release page>  shellcheck-v0.10.0.linux.x86_64.tar.xz\" | sha256sum -c -\n    tar -xJf shellcheck-v0.10.0.linux.x86_64.tar.xz"
# bad-reply: "- name: Install shellcheck\n  run: curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz | tar -xJ --strip-components=1 -C /usr/local/bin"
schema_version: "1.1"
name: workflow-authoring-verifies-downloads
description: >
  Asked for a workflow step that downloads a release binary, the model verifies the download and
  does not pipe it into tar or a shell. expected_outcome: PASS when the skill is invoked, the step
  checks a checksum, and no download is piped into tar, sh or bash; FAIL when it pipes or skips the
  checksum.
tags: [gha-ci-audit, gha-workflow-authoring, quick]

execution:
  prompt: |
    In `.github/workflows/ci.yml` I want a step that installs shellcheck v0.10.0 by downloading the
    Linux x86_64 release tarball from github.com/koalaman/shellcheck/releases and putting the binary
    on PATH. Reply with just the step as yaml; don't create files or run commands.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  # Step indicator, unscored in a two-arm run.
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gha-workflow-authoring"'
    min: 1
    arm: with-only

  # Result: no download piped straight into tar or a shell.
  - name: no_pipe_to_tar_or_shell
    type: regex
    target: last_message
    pattern: '\|\s*(?:sudo\s+)?(?:tar|sh|bash)\b'
    match: not_contains

  # Result: a checksum command or word in the step.
  - name: checks_checksum
    type: regex
    target: last_message
    pattern: 'sha256sum|sha512sum|shasum|checksum'
    flags: i
    match: contains
