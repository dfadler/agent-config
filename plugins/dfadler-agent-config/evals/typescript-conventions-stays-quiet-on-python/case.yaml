# Run: claude plugin eval plugins/dfadler-agent-config --case typescript-conventions-stays-quiet-on-python --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire case for typescript-conventions: a Python `typing.cast` question shares
# "type assertion", "cast" and "comment" vocabulary with the skill but is not TypeScript or
# JavaScript. Regression guard: a no-plugin arm passes by default, Delta about 0 by design.
# Can fail: skill_not_fired fails if the TS skill loads for Python; answers_with_isinstance
# fails if the reply does not offer an isinstance-style narrowing.
schema_version: "1.1"
name: typescript-conventions-stays-quiet-on-python
description: >
  A request to remove a `typing.cast` from Python code must not invoke typescript-conventions.
  expected_outcome: regression guard, Delta about 0 by design. PASS when the skill does not
  fire and the reply narrows with isinstance; FAIL when it fires.
tags: [typescript-conventions, trigger, quick]

execution:
  prompt: |
    Replace the `cast` in this Python function with a proper runtime check. Reply with one
    python code block and no other text. Do not run commands.

    ```python
    from typing import cast

    def first_name(value: object) -> str:
        return cast(str, value).split()[0]
    ```
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?typescript-conventions"'
    min: 0
    max: 0
    arm: both

  - name: answers_with_isinstance
    type: regex
    target: last_message
    pattern: 'isinstance\('
    match: contains
    arm: both
