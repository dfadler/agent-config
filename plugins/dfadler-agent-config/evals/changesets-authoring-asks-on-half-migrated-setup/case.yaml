# Run: claude plugin eval plugins/dfadler-agent-config --case changesets-authoring-asks-on-half-migrated-setup --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; inputs are
# pasted and nothing runs.
# Delta case for changesets-authoring Step 1: when only one of the two signals is present
# (`.changeset/config.json` exists but `@changesets/cli` is gone), treat the setup as stale or
# half-migrated and ask, rather than guess and write a changeset. A model without the skill
# tends to write the file because `.changeset/` exists.
# Can fail: skill_fired if the description stops matching; says_ask if the reply starts WRITE;
# no_changeset_written if a `"@acme/parser": patch` frontmatter appears anyway.
# Skill phrases checked: "If only one signal is present ... treat that as a stale or
# half-migrated setup and ask rather than guessing".
schema_version: "1.1"
name: changesets-authoring-asks-on-half-migrated-setup
description: >
    With only one of the two Changesets signals present, the model invokes changesets-authoring
    and asks instead of writing a changeset. expected_outcome: PASS when the skill fires, the reply
    starts with ASK and no changeset frontmatter is written; FAIL otherwise.
tags: [changesets-authoring, trigger, quick]

execution:
  prompt: |
    I fixed a bug in `@acme/parser`: it dropped the last label when a diagram ended without a
    trailing newline. The repo has a `.changeset/config.json`, but `@changesets/cli` is not in
    any `package.json` (someone removed the dependency last month). Should you write a changeset
    for this PR now?

    Start your reply with exactly one word on its own line: WRITE if you would write it now, or
    ASK if you would ask me something first. Then one sentence. Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?changesets-authoring"'
    min: 1
    arm: with-only

  - name: says_ask
    type: regex
    target: last_message
    pattern: '^\W*ASK\b'
    match: contains

  - name: no_changeset_written
    type: regex
    target: last_message
    pattern: '"@acme/parser"\s*:\s*(?:patch|minor|major)'
    match: not_contains
