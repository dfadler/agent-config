# Run: claude plugin eval plugins/dfadler-agent-config --case shell-script-hygiene-stays-quiet-on-python-script --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half: a Python script for the same job shares "script", "backup" and "exit
# code" vocabulary with the skill but is not bash. Regression guard: a no-plugin arm passes by
# default, Delta about 0 by design.
# Can fail: skill_not_fired if shell-script-hygiene over-triggers on a non-shell script;
# writes_python if the reply is not a Python script.
schema_version: "1.1"
name: shell-script-hygiene-stays-quiet-on-python-script
description: >
  A request for a Python backup script must not invoke shell-script-hygiene. expected_outcome:
  regression guard, Delta about 0 by design. PASS when the skill does not fire and the reply is
  Python; FAIL when it fires.
tags: [shell-script-hygiene, trigger, quick]

execution:
  prompt: |
    Write `backup.py`, a Python 3 script that takes one argument, a directory, and tars it into
    `/tmp/backup.tar.gz`. If the directory does not exist it must exit with a non-zero code and
    an error message. Reply with one python code block and no other text. Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shell-script-hygiene"'
    min: 0
    max: 0
    arm: both

  - name: writes_python
    type: regex
    target: last_message
    pattern: 'import (?:sys|os|tarfile|argparse)'
    match: contains
    arm: both
