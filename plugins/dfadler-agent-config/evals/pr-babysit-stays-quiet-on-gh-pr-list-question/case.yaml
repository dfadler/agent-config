# Run: claude plugin eval plugins/dfadler-agent-config --case pr-babysit-stays-quiet-on-gh-pr-list-question --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half of pr-babysit's boundary: "which of my open PRs" shares vocabulary
# with "check on my open PRs", but asking for a single read-only command is not a shepherding
# pass (no snapshot, no action, no PACING footer).
# Scope: only pr-babysit is checked. github-pr-workflow's description also covers drafting a
# `gh pr` command, so a sibling PR skill firing here is out of scope for this case.
# Sabotage map: pr_babysit_not_fired checks the description's trigger list ("check on my open
# PRs", "shepherd PR N to merge"); replace it with "any question about open PRs" and a run
# should invoke the skill and fail. gives_gh_command is a content check a default reply also
# passes.
# Can fail: the skill firing fails pr_babysit_not_fired; a reply without a `gh pr list`
# author filter fails gives_gh_command. Regression guard: a no-plugin arm passes by default,
# so Delta is about 0 by design.
schema_version: "1.1"
name: pr-babysit-stays-quiet-on-gh-pr-list-question
description: >
  A request for the one-line gh command that lists my open PRs must not invoke pr-babysit.
  expected_outcome: regression guard, Delta about 0 by design. PASS when pr-babysit does not
  fire and the reply gives a gh pr list command; FAIL when it fires.
tags: [pr-babysit, trigger, quick]

execution:
  prompt: |
    What is the gh command that lists just my own open pull requests in this repo? Reply
    with the command only. Do not run it or any other command.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: pr_babysit_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-babysit"'
    min: 0
    max: 0
    arm: both

  - name: gives_gh_command
    type: regex
    target: last_message
    pattern: 'gh pr list[^\n]*(?:--author|-A)'
    match: contains
    arm: both
    weight: 0.5
