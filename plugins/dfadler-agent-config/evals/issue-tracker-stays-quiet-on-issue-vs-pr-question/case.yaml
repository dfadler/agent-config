# Run: claude plugin eval plugins/dfadler-agent-config --case issue-tracker-stays-quiet-on-issue-vs-pr-question --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half: a conceptual question about issues versus pull requests shares the
# vocabulary but creates, references and updates nothing. Regression guard: a no-plugin arm
# passes by default, Delta about 0 by design.
# Can fail: skill_not_fired if issue-tracker over-triggers on a conceptual question; explains if
# the reply does not contrast the two.
schema_version: "1.1"
name: issue-tracker-stays-quiet-on-issue-vs-pr-question
description: >
  A conceptual "issue versus pull request" question must not invoke issue-tracker.
  expected_outcome: regression guard, Delta about 0 by design. PASS when the skill does not fire
  and the reply mentions both terms; FAIL when it fires.
tags: [issue-tracker, trigger, quick]

execution:
  prompt: |
    In one or two sentences, what is the difference between a GitHub issue and a GitHub pull
    request? Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?issue-tracker"'
    min: 0
    max: 0
    arm: both

  - name: explains
    type: regex
    target: last_message
    pattern: 'issue[\s\S]*pull request|pull request[\s\S]*issue'
    flags: i
    match: contains
    arm: both
