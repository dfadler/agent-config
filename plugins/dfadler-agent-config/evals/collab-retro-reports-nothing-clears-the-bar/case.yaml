# Run: claude plugin eval plugins/dfadler-agent-config --case collab-retro-reports-nothing-clears-the-bar --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; the
# scanner output and memory contents are pasted.
# Should-fire case for collab-retro Step 2's exit: a retro with no recurring, repo-fixable
# pattern says so and stops instead of forcing an issue. All three memories are one-off
# preferences from a single project. The NOTHING/ISSUE first word makes the decision the
# graded thing.
# Can fail: skill_fired fails if the description stops matching "retro"; decides_nothing
# fails if the reply starts with ISSUE (a model with no bar tends to draft something from
# any feedback memory); no_draft fails if a `## Pattern observed` section appears anyway.
# Skill phrases checked: "a retro with no findings is a valid, useful outcome", "Most
# `feedback` memories are legitimately fine staying as memory".
schema_version: "1.1"
name: collab-retro-reports-nothing-clears-the-bar
description: >
  Given three one-off feedback memories from a single project, the model invokes collab-retro
  and reports that nothing clears the bar instead of drafting an issue. expected_outcome: PASS
  when the skill fires and the reply starts with NOTHING and has no issue template; FAIL
  otherwise. Guard: a no-skill reply may decide NOTHING too, so the Delta may be small.
tags: [collab-retro, trigger, quick]

execution:
  prompt: |
    Do a collaboration retro. I can't run the scanner here, so this is what it listed and
    what is in the files. Assume no open issue already covers any of this.

    ```
    2026-09-30  -Users-dfadler-Development-orders-service  feedback_keep_old_column
    2026-09-21  -Users-dfadler-Development-orders-service  feedback_no_squash_this_pr
    2026-09-02  -Users-dfadler-Development-orders-service  feedback_tabs_in_makefile
    ```

    feedback_keep_old_column: "For the orders migration, keep the legacy `status_v1` column
    until the March release."
    feedback_no_squash_this_pr: "For the PR that rewrites the importer, keep the commits
    unsquashed so the history is readable."
    feedback_tabs_in_makefile: "Use tabs in this repo's Makefile."

    Start your reply with exactly one word on its own line: ISSUE if you would draft an
    issue, or NOTHING if nothing clears the bar. Then give the title and body (ISSUE) or one
    sentence of reason (NOTHING). Do not run commands or post anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?collab-retro"'
    min: 1
    arm: with-only

  - name: decides_nothing
    type: regex
    target: last_message
    pattern: '^\W*NOTHING\b'
    match: contains

  - name: no_draft
    type: regex
    target: last_message
    pattern: '##\s*Pattern observed'
    match: not_contains
