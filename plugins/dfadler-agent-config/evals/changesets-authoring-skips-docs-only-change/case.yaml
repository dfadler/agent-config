# Run: claude plugin eval plugins/dfadler-agent-config --case changesets-authoring-skips-docs-only-change --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-fire case for changesets-authoring Step 2: the repo uses Changesets (both signals
# pasted) but a README-only change has no externally visible effect, so no changeset is
# needed. The YES/NO first line makes the check a decision, not wording.
# Can fail: skill_fired fails if the description stops matching "add a changeset"; says_no
# fails if the reply starts with YES (a default model that sees a Changesets repo may ask for
# an empty changeset to satisfy a CI gate).
# Skill phrases checked: "Skip it for a change with no externally visible effect: ... docs-only".
schema_version: "1.1"
name: changesets-authoring-skips-docs-only-change
description: >
  Asked whether a README typo fix needs a changeset in a repo that uses Changesets, the model
  invokes changesets-authoring and answers NO. expected_outcome: PASS when the skill fires and
  the reply starts with NO; FAIL when it starts with YES or the skill never fires.
tags: [changesets-authoring, trigger, quick]

execution:
  prompt: |
    My PR only fixes a typo in README.md in a pnpm monorepo that publishes `@acme/core` and
    `@acme/cli`. The repo has `.changeset/config.json` and `@changesets/cli` in its root
    devDependencies. Do I need to add a changeset for this PR?

    Start your reply with exactly one word on its own line, YES or NO, then one sentence of
    reason. Follow the Changesets guidance for when a change needs one.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?changesets-authoring"'
    min: 1
    arm: with-only

  - name: says_no
    type: regex
    target: last_message
    pattern: '^\W*NO\b'
    match: contains
