# Run: claude plugin eval plugins/dfadler-agent-config --case agent-cost-tiers-stays-quiet-on-subagent-definition --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half: a conceptual question about what a subagent is shares the vocabulary but
# makes no model or fan-out decision. Regression guard: a no-plugin arm passes by default, Delta
# about 0 by design.
# Can fail: skill_not_fired if agent-cost-tiers over-triggers on a definition question;
# defines if the reply does not describe a subagent.
schema_version: "1.1"
name: agent-cost-tiers-stays-quiet-on-subagent-definition
description: >
  A "what is a subagent" question must not invoke agent-cost-tiers. expected_outcome: regression
  guard, Delta about 0 by design. PASS when the skill does not fire and the reply describes a
  subagent; FAIL when it fires.
tags: [agent-cost-tiers, trigger, quick]

execution:
  prompt: |
    In one or two sentences, what is a subagent in Claude Code? Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?agent-cost-tiers"'
    min: 0
    max: 0
    arm: both

  - name: defines
    type: regex
    target: last_message
    pattern: 'subagent'
    flags: i
    match: contains
    arm: both
