# A case's allowed_tools cannot grant Bash, so run this case with a narrow grant:
#   claude plugin eval plugins/dfadler-agent-config --case pr-checks-uses-prefetched-snapshot --allow-tools "Bash(gh pr checks *)"
# The grant lets does_not_refetch_checks fail if the model tries `gh pr checks`. The OS
# sandbox blocks network access unless it is granted, so a re-fetch should fail instead
# of reaching GitHub.
#
# This tests skill composition: pr-checks documents (in its "## Contract") that it
# accepts pr-babysit's snapshot shape, so a caller that already holds the data should
# not pay for a second fetch.
schema_version: "1.1"
name: pr-checks-uses-prefetched-snapshot
description: >
  pr-checks should consume checks/failedRuns data handed to it in the pr-babysit
  snapshot shape instead of re-running `gh pr checks`, and should treat a
  CANCELLED run as a superseded run, not a real failure.
tags: [pr-checks, composition]

execution:
  prompt: |
    I'm in the middle of a PR shepherding pass and just snapshotted PR 482.
    Handle its CI checks using the data below; it's current as of a minute ago.

    ```json
    {
      "checks": [
        {"name": "lint", "state": "pass", "conclusion": "SUCCESS", "required": true},
        {"name": "integration-tests", "state": "fail", "conclusion": "CANCELLED", "required": true}
      ],
      "failedRuns": [
        {
          "runId": 9100123,
          "workflow": "integration",
          "runAttempt": 1,
          "conclusion": "CANCELLED",
          "url": "https://github.com/example/repo/actions/runs/9100123",
          "rerunBudgetLeft": true
        }
      ]
    }
    ```
  max_turns: 6
  allowed_tools:
    - Bash
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-checks"'
    min: 1
    arm: with-only

  - name: does_not_refetch_checks
    type: tool_used
    tool: Bash
    input_match: 'gh\s+pr\s+checks'
    min: 0
    max: 0
    arm: with-only

  - name: classifies_cancelled_as_not_a_failure
    type: llm
    criteria: |
      PASS if all of these hold:
      - The response reports on both checks, lint and integration-tests.
      - It treats the CANCELLED integration-tests run as superseded or not a
        real failure, and takes no fix or rerun action on it.
      - It does not claim to have fetched fresh check data from GitHub.

      FAIL if any of these hold:
      - The response treats the CANCELLED run as a genuine failure to fix.
      - The response triggers a rerun or pushes a change.
      - The response ignores the supplied data and asks the user for a PR number
        or for the check status.
