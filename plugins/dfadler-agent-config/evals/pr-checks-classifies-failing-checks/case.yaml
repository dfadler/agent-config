# Run: claude plugin eval plugins/dfadler-agent-config --case pr-checks-classifies-failing-checks --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; the
# gh output and log excerpts are pasted and Bash is not offered, so nothing can reach GitHub.
# Should-fire case for pr-checks, and the sibling boundary with pr-babysit: a question about
# one PR's CI must fire pr-checks and must not fire the many-PR sweep. Uses the skill's
# report vocabulary (branch-related / flaky / CANCELLED = superseded) without cueing it.
# Can fail: skill_fired fails if the description stops matching "why is CI failing on PR N";
# babysit_not_fired fails if the sweep skill over-triggers on a single-PR question (arm
# both); lint_branch_related, integration_flaky and coverage_superseded fail if the reply
# misclassifies a check; in_flight_summary (half weight) fails without the closing summary.
# Without the skill a reply tends to call the cancelled run a failure to investigate and has
# no "in flight" summary.
# Skill phrases checked: "Branch-related", "Flaky/infra", "A `CANCELLED` run is not a real
# failure", "Close with a one-line \"in flight\" summary".
schema_version: "1.1"
name: pr-checks-classifies-failing-checks
description: >
  Asked why CI is failing on one PR, with check output and log excerpts pasted, the model
  invokes pr-checks (not pr-babysit) and classifies a lint failure in a touched file as
  branch-related, a registry timeout as flaky, and a cancelled run as superseded.
  expected_outcome: PASS when pr-checks fires, pr-babysit does not, and the three
  classifications are right; FAIL otherwise.
tags: [pr-checks, trigger, quick]

execution:
  prompt: |
    Why is CI failing on PR 482? I can't run gh here, so here is what I have. This PR edits
    scripts/build.sh and nothing else (no dependency changes).

    ```
    gh pr checks 482
    lint               fail     1m2s   https://github.com/dfadler/example-app/actions/runs/9100001
    integration-tests  fail     3m10s  https://github.com/dfadler/example-app/actions/runs/9100002
    coverage           cancel   0s     https://github.com/dfadler/example-app/actions/runs/9100003
    unit-tests         pass     2m5s   https://github.com/dfadler/example-app/actions/runs/9100004
    ```

    Failed-step excerpts (gh run view --log-failed):

    ```
    lint:
      In scripts/build.sh line 12:
      rm -rf $OUT_DIR/*
             ^-------^ SC2086: Double quote to prevent globbing and word splitting.

    integration-tests (step: Install dependencies):
      npm ERR! code ETIMEDOUT
      npm ERR! network request to https://registry.npmjs.org/left-pad failed, reason: connect ETIMEDOUT 104.16.0.35:443
    ```

    Reply with one line per check (name, what you conclude, what you would do), then one
    closing line. Do not run commands.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-checks"'
    min: 1
    arm: with-only

  # Boundary: a single-PR CI question is not a sweep of every open PR.
  - name: babysit_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-babysit"'
    min: 0
    max: 0
    arm: both

  - name: lint_branch_related
    type: regex
    target: last_message
    pattern: 'lint[^\n]*(?:branch-related|caused by|this PR|your (?:change|edit))'
    flags: i
    match: contains

  - name: integration_flaky
    type: regex
    target: last_message
    pattern: 'integration-tests[^\n]*(?:flaky|infra|transient|network)'
    flags: i
    match: contains

  - name: coverage_superseded
    type: regex
    target: last_message
    pattern: 'coverage[^\n]*(?:superseded|newer push)'
    flags: i
    match: contains

  - name: in_flight_summary
    type: regex
    target: last_message
    pattern: 'in flight|nothing in flight|all quiet'
    flags: i
    match: contains
    weight: 0.5
