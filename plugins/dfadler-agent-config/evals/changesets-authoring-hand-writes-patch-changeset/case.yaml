# Run: claude plugin eval plugins/dfadler-agent-config --case changesets-authoring-hand-writes-patch-changeset --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; the
# repo listing is pasted because the eval workspace is empty.
# Should-fire case for changesets-authoring: a bug fix in a repo that has both Changesets
# signals gets a hand-written `.changeset/<slug>.md` with quoted package name and `patch`,
# not a run of the interactive CLI. The prompt does not name Changesets.
# Can fail: skill_fired fails if the description stops matching; path_and_frontmatter fails
# if the file path or the quoted `"@acme/parser": patch` line is missing or the bump is
# wrong; no_cli_run fails if the code block runs `changeset add` instead of writing the file.
# Without the skill a reply may still know the format, so expect a modest Delta.
# Skill phrases checked: "Step 3 - the file format" (quoted package name), "Step 4 - pick the
# bump type" (bug fix is patch), "Step 5 - hand-write the file".
schema_version: "1.1"
name: changesets-authoring-hand-writes-patch-changeset
description: >
  Told to prepare a bug-fix PR in a repo with `.changeset/config.json` and `@changesets/cli`,
  the model invokes changesets-authoring and answers with a hand-written changeset file: a
  `.changeset/*.md` path, quoted package name with `patch`, and a summary. expected_outcome:
  PASS when the skill fires and the block has the path and the patch frontmatter without a CLI
  run; FAIL otherwise.
tags: [changesets-authoring, trigger, quick]

execution:
  prompt: |
    I fixed a bug in `@acme/parser`: it dropped the last label when a diagram ended without a
    trailing newline. Only that package changed, and the fix does not change its API. Before
    I open the PR, what do I add to the repo for the release notes? Repo facts:

    ```
    $ ls -a
    .changeset  .git  package.json  packages  pnpm-workspace.yaml
    $ ls .changeset
    README.md  config.json
    $ grep changesets package.json
        "@changesets/cli": "^2.27.0"
    ```

    Reply with one code block holding the file path on the first line and the full file
    contents below it, and no other text. Do not run commands or create files.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?changesets-authoring"'
    min: 1
    arm: with-only

  - name: path_and_frontmatter
    type: regex
    target: last_message
    pattern: '\.changeset/[\w-]+\.md[\s\S]*---\s*\n\s*"@acme/parser"\s*:\s*patch\s*\n---'
    match: contains

  - name: no_cli_run
    type: regex
    target: last_message
    pattern: '(?:npx|pnpm|yarn)\s+changeset|changeset add'
    flags: i
    match: not_contains
