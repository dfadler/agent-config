# Run: claude plugin eval plugins/dfadler-agent-config --case pr-comments-drafts-marked-fixed-reply --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; the
# reply is drafted, never posted, and the thread JSON is pasted.
# Should-fire case for pr-comments' reply contract: every reply opens with the AI marker and
# a Fixed reply uses the "Fixed in <sha>: ..." template. Tested on the drafted body so no
# gh write is needed. Related but separate: #483 (consuming pre-fetched threads), already
# covered by pr-comments-uses-prefetched-threads.
# Can fail: skill_fired fails if the description stops matching; marker_and_template fails if
# the draft lacks the exact opener and "Fixed in abc1234" (a no-skill reply has no
# `🤖 **Claude:**` marker); not_bare_done fails if the draft is just "done".
# Skill phrases checked: "opens with the AI-authorship marker", "Fixed in <sha>: <what
# changed and why>".
schema_version: "1.1"
name: pr-comments-drafts-marked-fixed-reply
description: >
  Asked to answer a review thread whose finding was fixed in a named commit, the model
  invokes pr-comments and drafts a reply that starts with the AI marker and the Fixed-in-sha
  template. expected_outcome: PASS when the skill fires and the single code block starts
  with `🤖 **Claude:** Fixed in abc1234`; FAIL otherwise.
tags: [pr-comments, trigger, quick]

execution:
  prompt: |
    Respond to the review feedback on PR 482 of dfadler/example-app. My login is dfadler.
    There is one unresolved thread and I already fixed it: commit abc1234 renames the
    shadowed variable `d` to `delayMs` in src/retry.ts.

    ```json
    {
      "unresolvedThreads": [
        {
          "threadId": "PRRT_ccc",
          "path": "src/retry.ts",
          "line": 21,
          "isOutdated": false,
          "truncated": false,
          "needsAction": true,
          "comments": [
            {"id": 3001, "author": "octo-reviewer", "body": "`d` shadows the outer `d` here, which is easy to misread.", "url": "https://github.com/dfadler/example-app/pull/482#discussion_r3001", "createdAt": "2026-10-02T10:00:00Z"}
          ]
        }
      ],
      "generalComments": [],
      "threadsTruncated": false,
      "generalCommentsTruncated": false
    }
    ```

    Reply with the exact body you would post on thread PRRT_ccc, in one code block and no
    other text. Do not run commands or post anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?pr-comments"'
    min: 1
    arm: with-only

  - name: marker_and_template
    type: regex
    target: last_message
    pattern: '🤖 \*\*Claude:\*\* Fixed in `?abc1234`?'
    match: contains

  # Completion check a default reply also passes: the draft says what changed.
  - name: says_what_changed
    type: regex
    target: last_message
    pattern: 'delayMs'
    match: contains
    weight: 0.5
