# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier quick plugins/dfadler-agent-config
# (quick tier: one run, plugin arm only, `--ablation none`, which this case needs because the
# no-plugin arm cannot dispatch a plugin agent: "Agent type ... not found".)
# Grant: Write, recorded in grants.yaml, so the run can create the small repo the agent reads
# (the eval workspace starts empty). Bash is not granted. Scoring runs are pending.
# Agent coverage: docs-staleness-checker's report-only contract (agents/docs-staleness-checker.md,
# "Constraints - read-only"): it reports prose that drifted from the code and never edits the doc.
# Can fail: checker_dispatched if the main model audits the docs itself; the *_created checks if setup
# did not happen; flags_missing_script if the agent misses the README naming a script that no
# longer exists; flags_stale_count if it misses the "three jobs" claim against four jobs;
# readme_left_unchanged if the README was rewritten; no_extra_writes if more than the three
# setup Writes happened.
schema_version: "1.1"
name: docs-staleness-checker-reports-without-editing
description: >
  Asked to create a README that names a missing script and undercounts CI jobs, then have the
  docs staleness checker agent audit it, the model dispatches docs-staleness-checker, which
  reports both drifts and leaves the README unchanged. expected_outcome: PASS when the agent is
  dispatched, both drifts are reported and the README is unchanged; FAIL otherwise.
tags: [docs-staleness-checker, agent, report-only, quick]

execution:
  prompt: |
    Please create these three files exactly as written, then have the docs staleness checker
    agent audit the README against the code and tell me what it found.

    File README.md:

    ```markdown
    # tidy

    Build a release with `scripts/build.sh --release`.

    CI runs three jobs: lint, test and build.
    ```

    File scripts/package.sh:

    ```bash
    #!/usr/bin/env bash
    set -euo pipefail
    tar -czf dist/tidy.tgz src
    ```

    File .github/workflows/ci.yml:

    ```yaml
    name: ci
    on: [push]
    jobs:
      lint:
        runs-on: ubuntu-latest
        steps: [{ run: make lint }]
      test:
        runs-on: ubuntu-latest
        steps: [{ run: make test }]
      build:
        runs-on: ubuntu-latest
        steps: [{ run: scripts/package.sh }]
      audit:
        runs-on: ubuntu-latest
        steps: [{ run: make audit }]
    ```
  max_turns: 14
  allowed_tools:
    - Agent
    - Write
    - Read
    - Glob
    - Grep

graders:
  # Steps: the plugin's agent was dispatched, not imitated.
  - name: checker_dispatched
    type: tool_used
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:[\w-]+:)?docs-staleness-checker"'
    min: 1

  # Precondition: the setup step wrote the files the checker reads.
  - name: readme_created
    type: file_exists
    path: "README.md"
    exists: true

  - name: script_created
    type: file_exists
    path: "scripts/package.sh"
    exists: true

  - name: workflow_created
    type: file_exists
    path: ".github/workflows/ci.yml"
    exists: true

  # Report-only contract: only the three setup Writes, and the README is untouched.
  - name: no_extra_writes
    type: tool_used
    tool: Write
    min: 3
    max: 3

  - name: readme_left_unchanged
    type: regex
    target:
      source: file
      path: "README.md"
    pattern: 'scripts/build\.sh --release[\s\S]*three jobs'
    match: contains

  # Result: each planted drift reached the reply.
  - name: flags_missing_script
    type: regex
    target: last_message
    pattern: 'build\.sh[\s\S]{0,200}(no longer|does not exist|missing|not exist|stale|nonexistent|doesn.t exist)'
    flags: i
    match: contains

  - name: flags_stale_count
    type: regex
    target: last_message
    pattern: 'audit[\s\S]{0,300}(four|4)|(four|4)[\s\S]{0,300}audit'
    flags: i
    match: contains

  - name: cites_readme_section
    type: regex
    target: last_message
    pattern: 'README\.md'
    match: contains
    weight: 0.25
