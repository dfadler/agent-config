# Run: claude plugin eval plugins/dfadler-agent-config --case issue-reporter-etiquette-stays-quiet-on-pr-review-reply --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half of the issue-vs-PR boundary: the skill's own description says it is for
# the issue reporter, "not a PR review thread". A reply to an inline PR review comment shares
# "reply", "comment" and "GitHub" with it. pr-comments or github-pr-workflow may fire here;
# only issue-reporter-etiquette is forbidden.
# Regression guard: a no-plugin arm passes by default, so the Delta is about 0 by design.
# Can fail: issue_etiquette_not_fired fails if the issue skill over-triggers on a PR review
# reply; answers_the_question fails if the reply does not address the Map question.
schema_version: "1.1"
name: issue-reporter-etiquette-stays-quiet-on-pr-review-reply
description: >
  A request to draft a reply to an inline PR review comment must not invoke
  issue-reporter-etiquette. expected_outcome: PASS when that skill does not fire and the reply
  addresses the reviewer's Map question; FAIL when it fires.
tags: [issue-reporter-etiquette, trigger, quick]

execution:
  prompt: |
    A reviewer left this inline comment on my PR (src/cache.ts line 14): "Why a Map here
    instead of a plain object?" The reason is that keys are user-supplied strings and a plain
    object would let a key like `__proto__` through. Draft my reply to the reviewer in one or
    two sentences. Do not run commands or post anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: issue_etiquette_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?issue-reporter-etiquette"'
    min: 0
    max: 0
    arm: both

  - name: answers_the_question
    type: regex
    target: last_message
    pattern: '__proto__|prototype|user-supplied'
    flags: i
    match: contains
    arm: both
