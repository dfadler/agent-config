# Run: claude plugin eval plugins/dfadler-agent-config --case url-to-audio-falls-back-to-say-without-openai-key --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only; nothing
# is run.
# Should-fire case for url-to-audio Step 3: a request for the OpenAI backend with no
# `OPENAI_API_KEY` is not failed silently, the skill says so and falls back to `say`. Listed
# in the skill's "Degrading cleanly" table.
# Can fail: skill_fired fails if the description stops matching; names_the_missing_key fails
# (half weight) if the reply does not mention the key; falls_back_to_say fails if it does
# not name a fallback to `say`. A no-skill model may ask for the key instead, which this
# check does not accept.
# Skill phrases checked: "if it's requested but missing, say so and fall back to `say`".
schema_version: "1.1"
name: url-to-audio-falls-back-to-say-without-openai-key
description: >
  Asked to narrate an article with the OpenAI backend when OPENAI_API_KEY is unset, the model
  invokes url-to-audio and says it will fall back to the macOS `say` voice. expected_outcome:
  PASS when the skill fires and the reply names the missing key and the `say` fallback; FAIL
  otherwise.
tags: [url-to-audio, trigger, quick]

execution:
  prompt: |
    Make an audio version of https://example.com/posts/launch-notes using the OpenAI voice
    backend (TTS_BACKEND=openai). On this Mac `OPENAI_API_KEY` is not set. Follow your
    article-to-audio guidance. In one sentence, say what you will do about the backend.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?url-to-audio"'
    min: 1
    arm: with-only

  - name: names_the_missing_key
    type: regex
    target: last_message
    pattern: 'OPENAI_API_KEY[^\n]{0,40}(?:not set|n.t set|unset|missing|absent)|(?:no|missing|without)[^\n]{0,20}(?:API key|OPENAI_API_KEY)'
    flags: i
    match: contains
    weight: 0.5

  - name: falls_back_to_say
    type: regex
    target: last_message
    pattern: 'fall(?:s|ing)?\s*back\s+to[^\n.]{0,40}\bsay\b|`say`'
    flags: i
    match: contains
