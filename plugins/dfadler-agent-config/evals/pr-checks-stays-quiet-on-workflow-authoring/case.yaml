# Run: claude plugin eval plugins/dfadler-agent-config --case pr-checks-stays-quiet-on-workflow-authoring --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half of the PR-CI boundary: a request to write a new workflow shares
# "CI", "checks" and "PR" with the PR skills but is not about one PR's check status.
# Regression guard: a no-plugin arm passes by default (it has no PR skills), so the Delta is
# about 0 by design.
# Can fail: no_pr_skill_fired fails if pr-checks, pr-babysit or pr-comments over-trigger on
# authoring a workflow; writes_workflow fails if the reply does not contain a workflow.
schema_version: "1.1"
name: pr-checks-stays-quiet-on-workflow-authoring
description: >
  A request to write a GitHub Actions workflow that runs lint on pull requests must not
  invoke pr-checks, pr-babysit or pr-comments. expected_outcome: PASS when none of those
  skills fires and the reply contains a workflow; FAIL when one fires.
tags: [pr-checks, trigger, quick]

execution:
  prompt: |
    Write a GitHub Actions workflow that runs `npm run lint` on every pull request to main.
    Reply with one yaml code block and no other text. Do not create files or run commands.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: no_pr_skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:pr-checks|pr-babysit|pr-comments)"'
    min: 0
    max: 0
    arm: both

  - name: writes_workflow
    type: regex
    target: last_message
    pattern: 'runs-on:[\s\S]*npm run lint'
    match: contains
    arm: both
