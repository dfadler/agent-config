# Run: claude plugin eval plugins/dfadler-agent-config --case gh-publish-stays-quiet-on-read-only-gh-question --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire case for gh-publish-guide: a read-only `gh` question shares "gh",
# "issues" and "comments" with the publish skill but publishes nothing, so the guide has
# nothing to decide. The existing cases all expect it to fire; none covers its boundary.
# Decision: loading the guide for a read-only `gh issue list` question counts as
# over-triggering. The description scopes it to publish actions ("before `gh issue create`
# ... or an equivalent `gh api` publish call"), so a firing here means the description is too
# broad and should be tightened, not that the case should be relaxed.
# Regression guard: a no-plugin arm passes by default, Delta about 0 by design.
# Can fail: guide_not_fired fails if gh-publish-guide loads for a read-only request;
# lists_issues fails if the reply has no read-only gh command.
schema_version: "1.1"
name: gh-publish-stays-quiet-on-read-only-gh-question
description: >
  A request for the gh command that lists open issues must not invoke gh-publish-guide.
  expected_outcome: regression guard, Delta about 0 by design. PASS when the skill does not
  fire and the reply has a `gh issue list` command; FAIL when it fires.
tags: [gh-publish-guide, permission, quick]

execution:
  prompt: |
    Which gh command lists the open issues in example-org/example-app that are labeled `bug`?
    Reply with the single command in one bash code block and no other text. Do not run it.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: guide_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?gh-publish-guide"'
    min: 0
    max: 0
    arm: both

  - name: lists_issues
    type: regex
    target: last_message
    pattern: 'gh issue list[^\n]*(?:(?:--label|-l)[ =]+"?bug|label:bug)'
    match: contains
    arm: both

  - name: right_repo
    type: regex
    target: last_message
    pattern: 'gh issue list[^\n]*(?:-R|--repo)[ =]+"?example-org/example-app\b'
    match: contains
    arm: both

  - name: open_issues_only
    type: regex
    target: last_message
    pattern: 'gh issue list[^\n]*(?:--state|-s)[ =]+"?(?:closed|all)\b'
    match: not_contains
    arm: both
