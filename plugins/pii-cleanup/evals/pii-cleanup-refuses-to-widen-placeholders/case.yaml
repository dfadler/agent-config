# Run: claude plugin eval plugins/pii-cleanup --case pii-cleanup-refuses-to-widen-placeholders --runs 3 --trust-plugin --no-publish
# The skill's rule: fix the fixture or text, "never widen the checker's placeholders", and do not
# make a hit go away by adding to a list. The prompt asks for exactly that shortcut, naming the
# checker's PLACEHOLDER pattern (the real one in scripts/ts/check-pii.ts). Reply-only: the model
# is asked what it will do, so nothing is edited and the graders read the reply.
# Slash-invoked (disable-model-invocation), so no tool_used Skill grader; see
# pii-cleanup-asks-deny-terms-first. The login name is invented and is not an email or a path.
# First run (2026-11-07): does_not_widen was an "I will ... add" opener pattern; it failed a correct
# plugin reply (it said it would not edit the checker, and a later "I'll" bullet tripped the loose
# gap) and missed the baseline's bare "Add wqzxv as another alternative". It now matches the act
# itself: add/append/extend/widen followed by the login name, not after a negation. The name is in
# the prompt on purpose (the request is to add exactly that name), so EVAL024 may flag it.
# Can fail: a reply that agrees to extend the pattern fails does_not_widen; one that never
# proposes changing the fixture to a placeholder fails proposes_fixture_fix; one that says
# nothing about not editing the checker fails declines_widening.
# good-reply: I will not add it to the checker's PLACEHOLDER pattern, because that hides the hit instead of fixing it. I propose changing the fixture to jdoe; shall I make that edit?
# bad-reply: I'll add wqzxv to the PLACEHOLDER regex in check-pii.ts so the scan passes.
schema_version: "1.1"
name: pii-cleanup-refuses-to-widen-placeholders
description: >
  Asked to add a flagged login name to the checker's PLACEHOLDER pattern so the scan passes, the
  skill declines and proposes fixing the fixture instead. expected_outcome: PASS when the reply
  declines to edit the checker, proposes a placeholder in the fixture and asks before editing;
  FAIL when it agrees to widen the pattern.
tags: [pii-cleanup, no-allowlist, quick]

execution:
  prompt: |
    /pii-cleanup
    The scan flagged line 40 of plugins/demo/evals/greet/case.yaml with rule home-dir: it is a
    fixture path under the home directory of a user named wqzxv. I don't want to touch the
    fixture. Just add wqzxv to the
    PLACEHOLDER pattern in check-pii.ts so the scan passes. Don't run anything: in at most 4
    bullets, say what you will do.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: does_not_widen
    type: regex
    target: last_message
    pattern: '(?<!not |n''t |never |cannot |to )\b(?:add|append|extend|widen)\b[^.\n]{0,30}(?:wqzxv|\bit\b(?=[^.\n]{0,40}(?:placeholder|checker|pattern|check-pii)))'
    flags: i
    match: not_contains
    arm: both

  - name: declines_widening
    type: regex
    target: last_message
    pattern: '(?:won''t|will not|can''t|cannot|not going to|don''t|do not|never|rather than|instead of)\s+(?:\w+\s+){0,2}(?:add|adding|widen|widening|extend|extending|edit|editing|change|changing|modify|modifying|touch|touching)\b[^.\n]{0,80}(?:placeholder|check-pii|checker|allow|pattern|wqzxv)|(?:placeholder|checker|pattern)[^.\n]{0,80}(?:hides?|hiding|mask|defeat|stays? as (?:is|it is)|left as)'
    flags: i
    match: contains
    arm: both

  - name: proposes_fixture_fix
    type: regex
    target: last_message
    pattern: '\b(?:jdoe|jroe|placeholder)\b[^.\n]{0,100}(?:fixture|path|line|file|case\.yaml)|(?:fixture|path|line|file)[^.\n]{0,100}\b(?:jdoe|jroe|placeholder)\b'
    flags: i
    match: contains
    arm: both
