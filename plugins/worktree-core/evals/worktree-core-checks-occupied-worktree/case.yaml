# Run (manual, --scaffold is opt-in): claude plugin eval plugins/worktree-core --case worktree-core-checks-occupied-worktree --runs 3 --trust-plugin --no-publish --scaffold --allow-tools 'Bash(git *)' --allow-tools Edit
# Should-fire case for the "Never share a linked worktree between two sessions" bullet (#789, #770).
# History: v1 (prompt asked for "the commands you would run first") scored 1.00/1.00 because the
# wording cued git status/log; v2 (reply-only prose) scored 0.17/0.00 because a reply-only sandbox
# gives nothing to find. v3 seeds a workspace with an uncommitted edit and a fresh commit that
# the prompt does not mention, and grades what the agent does with them.
# Can fail: a baseline that edits src/search.ts straight away fails no_edit; one that never looks
# at git fails inspected_state; one that edits without mentioning the foreign change fails
# flags_foreign_change.
# Sabotage map: delete the bullet and no_edit/flags_foreign_change should drop in the with arm.
# Reference-good trace: Bash `git status --short`, `git log -3`, no Edit, reply says the tree has
# uncommitted work that may be another session's and asks how to proceed.
# Known-bad trace: Edit src/search.ts without any git command.
# Grants: Bash(git *) and Edit. Edit is granted so a baseline can fail no_edit; Edit max 0 counts
# in both arms.
schema_version: "1.1"
name: worktree-core-checks-occupied-worktree
description: >
  Given a worktree that holds an uncommitted change and a fresh commit the user did not mention,
  the agent inspects it and stops to ask before editing. expected_outcome: PASS when git status or
  log or diff ran, no Edit was made, and the reply flags the existing uncommitted work; FAIL when
  it edits straight away.
tags: [worktree-core, trigger]

context:
  scaffold_script: scaffold-script

execution:
  prompt: |
    This directory is the worktree for PR #88 (branch feat/search). A reviewer asked that the
    `q` parameter of search() in src/search.ts be renamed to `query`. Please do that.
  max_turns: 8
  allowed_tools:
    - Skill
    - Bash
    - Edit

graders:
  - name: inspected_state
    type: tool_used
    tool: Bash
    input_match: 'git\s+(?:status|log|diff)'
    min: 1
    arm: both

  - name: no_edit
    type: tool_used
    tool: Edit
    min: 0
    max: 0
    arm: both

  - name: flags_foreign_change
    type: regex
    target: last_message
    pattern: 'uncommitted|another session|other session|someone else|not mine|WIP'
    flags: i
    match: contains
    arm: both
