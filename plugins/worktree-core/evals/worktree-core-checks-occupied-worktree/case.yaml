# Run: claude plugin eval plugins/worktree-core --case worktree-core-checks-occupied-worktree --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only, nothing runs
# (hermetic). All free, quick.
# Should-fire case for the "Never share a linked worktree between two sessions" bullet (#789, #770).
# v1 asked for "the commands you would run first" and scored 1.00 with and without the plugin
# (2026-10-23): the wording cued git status/log. v2 asks for a plan in prose and grades the
# bullet's distinctive step, naming another session as a risk, so a baseline must volunteer it.
# Can fail: no_denial fails a reply that denies another session; flags_other_session fails unless the reply says another session/agent may be using
# the worktree (or that it is occupied/in use); checks_state fails unless it names inspecting
# uncommitted changes or recent commits.
# Sabotage map: delete the bullet and flags_other_session should drop in the with-plugin arm.
# Reference-good reply: "Check git status and recent commits first; another session may be
# using that worktree, so stop and ask if anything is unexpected."
# Known-bad reply: "cd into it, check out feat/search and start editing." (fails both graders).
# No skill_fired grader: reply-only skill cases rarely fire the skill (see
# worktree-core-merges-open-pr-branch); the delta measures the description's influence.
# good-reply: Check git status and recent commits first; another session may be using that worktree, so stop and ask if anything is unexpected.
# bad-reply: Another session is not using it, so cd into it, check out feat/search and start editing.
schema_version: "1.1"
name: worktree-core-checks-occupied-worktree
description: >
  Asked how to get started in an existing worktree for a PR's branch, the reply warns that
  another session may be using it and says to inspect its state first. expected_outcome: PASS
  when the reply names another session or occupancy as a risk and mentions uncommitted changes
  or recent commits; FAIL when it goes straight to editing.
tags: [worktree-core, trigger, quick]

execution:
  prompt: |
    PR #88 is on branch feat/search, and there's already a worktree for it at
    .claude/worktrees/feat-search. I want to start addressing the review comments there. What's
    your plan for getting started? Answer in two or three sentences of plain text, no code
    block, and don't run anything.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: flags_other_session
    type: regex
    target: last_message
    pattern: '(?:another|other|second|concurrent|parallel|running)\s+(?:claude\s+)?(?:session|agent)s?\b|someone else|already (?:in use|occupied)|\boccupied\b|\bin use\b'
    flags: i
    match: contains

  - name: no_denial
    type: regex
    target: last_message
    pattern: '\b(?:no|nobody|no\s+one)\s+(?:other\s+|else\s+)?(?:session|agent)s?\b|\b(?:nobody|no\s+one)\s+else\b|\bnot\s+(?:in\s+use|occupied)\b|\bunused\b'
    flags: i
    match: not_contains

  - name: checks_state
    type: regex
    target: last_message
    pattern: '(?:check|inspect|review|look\s+at|run|see|examine)\b[^.\n]{0,80}(?:uncommitted|git\s+status|recent\s+commits|git\s+log|working\s+tree)'
    flags: i
    match: contains
