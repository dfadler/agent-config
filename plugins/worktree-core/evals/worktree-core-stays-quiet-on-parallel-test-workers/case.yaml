# Run: claude plugin eval plugins/worktree-core --case worktree-core-stays-quiet-on-parallel-test-workers --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant: Skill only.
# Should-not-fire half for the concurrency section: sizing parallel Jest workers shares "how
# many" and "parallel" with the skill but involves no Claude sessions or worktrees. Regression
# guard: a no-plugin arm passes by default, Delta about 0 by design.
# Can fail: skill_not_fired if git-worktree-usage over-triggers on a test-runner question;
# answers if the reply does not mention workers.
schema_version: "1.1"
name: worktree-core-stays-quiet-on-parallel-test-workers
description: >
  A question about parallel Jest workers must not invoke git-worktree-usage. expected_outcome:
  regression guard, Delta about 0 by design. PASS when the skill does not fire and the reply
  mentions workers; FAIL when it fires.
tags: [worktree-core, trigger, quick]

execution:
  prompt: |
    My laptop has 8 CPU cores. How many parallel workers should I let Jest use? Answer in one
    sentence. Do not run anything.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: skill_not_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?git-worktree-usage"'
    min: 0
    max: 0
    arm: both

  - name: answers
    type: regex
    target: last_message
    pattern: 'worker|maxWorkers|core'
    flags: i
    match: contains
    arm: both
