# Run: claude plugin eval plugins/worktree-core --case worktree-core-caps-parallel-sessions --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only.
# BASE-MODEL CHECK, not a plugin-effect measure. Mirrors the concurrency guidance ("Default to
# roughly 2-5 concurrent agents", "Stagger session starts"), but the model gives the same advice
# without the plugin (3-5 then add more as they finish), so a with/without delta is noise. It guards
# against a regression to "launch all ten"; it cannot show the skill helps. The skill-specific
# facts (burst rate limits at 5-10 quick launches, ~$50-130/day) are not elicited by this prompt.
# Can fail: gives_range fails without a 2-5 style range; staggers fails without staggered starts.
# The prompt names neither number nor stagger.
schema_version: "1.1"
name: worktree-core-caps-parallel-sessions
description: >
  Asked how many Claude Code sessions to run at once on ten independent tickets, the reply gives
  a small range of roughly 2 to 5 and advises staggering starts. expected_outcome: PASS when the
  reply names a 2-5 range and staggered launches; FAIL when it says to launch all ten at once.
tags: [worktree-core, base-model, quick]

execution:
  prompt: |
    I have ten independent tickets and a worktree for each. Should I just start ten Claude
    Code sessions at once to knock them all out? Answer in a short paragraph, no commands.
  max_turns: 4
  allowed_tools:
    - Skill

graders:
  - name: gives_range
    type: regex
    target: last_message
    pattern: '\b(?:[2-3]|two|three)\s*(?:-|–|—|to)\s*(?:[4-6]|four|five|six)\b|\b(?:two|three|four|[2-4])\s+or\s+(?:three|four|five|six|[3-6])\b'
    flags: i
    match: contains

  - name: staggers
    type: regex
    target: last_message
    pattern: 'stagger|ramp(?:ing)?[- ]up|one (?:or two )?at a time|a few at a time|in (?:batches|waves)|gradually|incrementally|add(?:ing)? more as|then add|start the (?:rest|next)|start with (?:two|three|four|five|[2-5])\b'
    flags: i
    match: contains
