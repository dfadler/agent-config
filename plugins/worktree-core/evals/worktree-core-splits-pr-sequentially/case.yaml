# Run: claude plugin eval plugins/worktree-core --case worktree-core-splits-pr-sequentially --runs 3 --trust-plugin --no-publish
# Shared run/grant facts: docs/contributing.md, "Plugin evals". No grant; reply-only.
# Should-fire case for "Splitting a large or already-written PR": default to sequential PRs
# against main coordinated by a `## Sequencing` section, not branch-off-branch stacks, even
# though the three pieces depend on each other. All free, quick.
# Can fail: skill_fired fails if a split-the-diff request does not match the description;
# has_sequencing_section fails without a Sequencing section/mention (the skill's own term, so
# a no-plugin reply rarely has it); every_base_is_main fails on a stacked base (a
# PR line whose base is `big-change-*` or "PR 1"; the word "stacked" alone does not count). The prompt rules out concurrent review, the skill's
# one exception for a branch-off-branch base, which correct replies otherwise hedge with; names_main_base (half weight) wants main named.
# Skill phrases checked: "Default to sequential PRs against `main`, coordinated in prose",
# "a `## Sequencing` section in the PR body", "Reserve branch-off-branch PRs".
schema_version: "1.1"
name: worktree-core-splits-pr-sequentially
description: >
  Asked to plan the split of a 900-line change into dependent PRs, the model invokes
  git-worktree-usage and plans sequential PRs against main with a Sequencing section in the
  bodies, not a stack of branch-off-branch PRs. expected_outcome: PASS when the skill is
  invoked, the plan mentions Sequencing, has no stacked base and names main; FAIL otherwise.
tags: [worktree-core, trigger, quick]

execution:
  prompt: |
    I already wrote one 900-line diff on branch big-change that does three things in order: a
    database schema migration, an API endpoint that uses it, and a UI page that uses the
    endpoint. It's too big to review, so I need to split the already-written diff into
    multiple pull requests. Plan the split, including what goes in each PR body to
    coordinate them. Assume reviewers take them one at a time, so PR 2 is reviewed only after
    PR 1 has merged and PR 3 only after PR 2. Your final message must be a numbered list of at most 8 lines, each
    naming the PR's base branch, and no other text.
  max_turns: 6
  allowed_tools:
    - Skill

graders:
  - name: skill_fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?git-worktree-usage"'
    min: 1
    arm: with-only

  - name: has_sequencing_section
    type: regex
    target: last_message
    pattern: '\bSequencing\b[^\n]*\b(?:merge|merged|order|first|before|after|depends?)\b'
    flags: i
    match: contains

  - name: every_base_is_main
    type: regex
    target: last_message
    pattern: '(?<!--)\bbase\b[:\s=]*`?(?!main\b)(?:big-change|PR\s*#?\d|previous|develop|master|trunk|release|the\s+(?:migration|endpoint))'
    flags: i
    match: not_contains

  - name: names_main_base
    type: regex
    target: last_message
    pattern: '\b(?:base|target(?:s|ing)?|against)\b[^\n]{0,24}\bmain\b'
    match: contains
    weight: 0.5
