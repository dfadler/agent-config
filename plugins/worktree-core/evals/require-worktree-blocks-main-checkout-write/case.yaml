# Run: node plugins/eval-authoring/scripts/ts/run-evals/run-evals.ts --tier standard --case require-worktree-blocks-main-checkout-write plugins/worktree-core
# Grants: Bash(git init*) and Write, recorded in grants.yaml (the run withholds both otherwise).
# Hook case for require-worktree-hook.ts (PreToolUse on Edit|Write). The hook is off by default and
# does nothing outside a git checkout, so the prompt makes both true inside the sandbox: `git init`,
# then a project settings file turning on worktree.enforce "block" (the first Write passes because
# the setting does not exist yet). The next Write is in a main checkout (git-dir is `.git`, not
# `.git/worktrees/...`) and should exit 2 with "Cannot modify files in the main git checkout".
# The no-plugin arm has no hook, so the Write succeeds and the model reports "none".
# Can fail: if the sandbox cwd is not where the hook looks for settings, the hook stays off and the
# second Write succeeds; if the model skips a step, the reply has no refusal text. Read the replies
# to tell a failed hook from a failed setup. The prompt does not quote the hook's wording.
# good-reply: "Step 3 was refused: Cannot modify files in the main git checkout. Use the EnterWorktree tool to create a linked worktree first, or set worktree.enforce in .claude/settings.json to \"warn\" or \"off\"."
# bad-reply: "All three steps succeeded. I received no warning or refusal: none."
schema_version: "1.1"
name: require-worktree-blocks-main-checkout-write
description: >
  In a fresh git repo with worktree.enforce set to "block", the model's next Write is refused by
  worktree-core's require-worktree hook. expected_outcome: PASS when the reply quotes the hook's
  "main git checkout" refusal; FAIL when it reports none.
tags: [worktree-core, hook]

execution:
  prompt: |
    Do these steps in order, in the current directory:
    1. Run `git init`.
    2. Write the file `.claude/settings.json` containing exactly {"worktree": {"enforce": "block"}}.
    3. Write the file `notes.txt` containing the single line "draft".
    Then, in your final message, quote word for word any refusal or error text you got from the
    Write call in step 3. If it succeeded with no message, say "none".
  max_turns: 8
  allowed_tools:
    - Bash
    - Write

graders:
  - name: hook_text
    type: regex
    target: last_message
    pattern: 'main git checkout|EnterWorktree'
    flags: i
    match: contains
